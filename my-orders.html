<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | Acai Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
background:#05080f;
color:#fff;
padding:20px;
min-height:100vh;
position:relative;
overflow-x:hidden;
}
body::after{
content:"";
position:fixed;
inset:0;
background:url("https://raw.githubusercontent.com/skyfallrudo/acai-assets/main/bg-desktop.jpg") center/cover no-repeat;
z-index:-2;
}
@media(max-width:768px){
body::after{
background-image:url("https://raw.githubusercontent.com/skyfallrudo/acai-assets/main/bg-mobile.jpg");
}
}
body::before{
content:"";
position:fixed;
inset:0;
background:rgba(5,8,15,.65);
z-index:-1;
}
.container{max-width:950px;margin:auto}
.back{
display:inline-flex;
align-items:center;
gap:8px;
color:#CBD5E1;
text-decoration:none;
margin-bottom:22px;
font-weight:500;
}
h1{
display:flex;
align-items:center;
gap:10px;
margin-bottom:22px;
font-size:34px;
}
.card{
background:rgba(15,23,42,.86);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
border-radius:26px;
padding:24px;
margin-bottom:22px;
box-shadow:0 12px 35px rgba(0,0,0,.35);
}
.top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:20px;
flex-wrap:wrap;
}
.order-id{
font-size:30px;
font-weight:700;
}
.time{
color:#94A3B8;
font-size:14px;
margin-top:6px;
}
.badge{
padding:8px 18px;
border-radius:999px;
font-size:14px;
font-weight:700;
}
.Pending{background:#64748B}
.Confirmed{background:#2563EB}
.Processing{background:#EA580C}
.Shipped{background:#2563EB}
.Delivered{background:#16A34A}
.Cancelled{background:#DC2626}
.items{
margin:18px 0;
padding:16px;
background:rgba(30,41,59,.45);
border-radius:16px;
}
.item{
display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}
.item:last-child{border:none}
.info{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:12px;
margin:18px 0;
}
.info div{
background:rgba(30,41,59,.35);
padding:12px 14px;
border-radius:12px;
font-size:14px;
}
.info i{
width:20px;
color:#60A5FA;
}
.summary{
margin-top:18px;
border-top:1px solid rgba(255,255,255,.08);
padding-top:16px;
display:flex;
flex-direction:column;
gap:10px;
}
.row{
display:flex;
justify-content:space-between;
}
.final{
border-top:1px solid rgba(255,255,255,.08);
padding-top:12px;
font-size:20px;
font-weight:700;
}
.empty{
text-align:center;
padding:70px 20px;
background:rgba(15,23,42,.86);
border-radius:24px;
}
.empty p{color:#94A3B8;margin-top:8px}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">
<i class="fa-solid fa-arrow-left"></i>
Back to Shop
</a>

<h1>📦 My Orders</h1>

<div id="orders"></div>

</div>

<script>
fetch("/my-orders")
.then(r=>r.json())
.then(orders=>{

const container=document.getElementById("orders");

if(!orders||orders.length===0){
container.innerHTML=`
<div class="empty">
<h2>No Orders Yet</h2>
<p>Your orders will appear here.</p>
</div>`;
return;
}

container.innerHTML="";

orders.forEach(order=>{

let items=[];

try{
items=typeof order.items==="string"
?JSON.parse(order.items)
:order.items;
}catch{
items=[];
}

let itemHTML="";

items.forEach(item=>{
itemHTML+=`
<div class="item">
<span>${item.name} × ${item.qty}</span>
<span>${Number(item.price*(item.qty||1)).toLocaleString()} MMK</span>
</div>`;
});

const productTotal=(Number(order.total)||0)-(Number(order.deli_fee)||0);

container.innerHTML+=`
<div class="card">

<div class="top">

<div>
<div class="order-id">Order #${order.id}</div>
<div class="time">${order.created_at||""}</div>
</div>

<div class="badge ${order.status||"Pending"}">
${order.status||"Pending"}
</div>

</div>

<div class="items">
${itemHTML}
</div>

<div class="info">

<div><i class="fa-solid fa-user"></i> <b>Customer:</b> ${order.customer||"-"}</div>

<div><i class="fa-solid fa-phone"></i> <b>Phone:</b> ${order.phone||"-"}</div>

<div><i class="fa-brands fa-telegram"></i> <b>Telegram:</b> ${order.telegram||"-"}</div>

<div><i class="fa-solid fa-comment"></i> <b>Alt Social:</b> ${order.alt_social||"-"}</div>

<div><i class="fa-solid fa-city"></i> <b>City:</b> ${order.city||"-"}</div>

<div><i class="fa-solid fa-map-location-dot"></i> <b>Township:</b> ${order.township||"-"}</div>

<div><i class="fa-solid fa-road"></i> <b>Road:</b> ${order.road||"-"}</div>

<div><i class="fa-solid fa-building"></i> <b>Building:</b> ${order.building||"-"}</div>

<div style="grid-column:1/-1">
<i class="fa-solid fa-location-dot"></i>
<b>Address:</b> ${order.address||"-"}
</div>

<div><i class="fa-solid fa-wallet"></i> <b>Payment:</b> ${order.payment_method||"-"}</div>

</div>

<div class="summary">

<div class="row">
<span>Products</span>
<span>${productTotal.toLocaleString()} MMK</span>
</div>

<div class="row">
<span>Delivery Fee</span>
<span>${Number(order.deli_fee||0).toLocaleString()} MMK</span>
</div>

<div class="row final">
<span>Total</span>
<span>${Number(order.total||0).toLocaleString()} MMK</span>
</div>

</div>

</div>`;
});

})
.catch(()=>{
document.getElementById("orders").innerHTML=`
<div class="empty">
<h2>Cannot Load Orders</h2>
<p>Please check your server connection.</p>
</div>`;
});
</script>

</body>
</html>
