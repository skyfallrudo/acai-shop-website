<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | Acai Shop</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F00XQ96WFJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-F00XQ96WFJ');
</script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

body {
    background-color: #05080f;
    min-height: 100vh;
    color: white;
    padding: 25px 20px;
    position: relative;
}

/* Background ပုံကို fixed အလွှာသီးသန့်ခွဲထုတ်ပြီး PC/Mobile ခွဲခြားပေးထားသည် */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}

/* PC (ကွန်ပျူတာ Screen များ) အတွက် Desktop ပုံ */
@media (min-width: 769px) {
    body::after {
        background-image: url("https://raw.githubusercontent.com/skyfallrudo/acai-assets/main/bg-desktop.jpg");
    }
}

/* ဖုန်း Screen များအတွက် Mobile ပုံ */
@media (max-width: 768px) {
    body::after {
        background-image: url("https://raw.githubusercontent.com/skyfallrudo/acai-assets/main/bg-mobile.jpg");
    }
}

/* အမည်းရောင် ပါးပါးအုပ်ထားသည့် အလွှာ (Blur မပါသောကြောင့် ပုံမဝါးပါ) */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 8, 15, 0.65);
    z-index: -1;
}

.container {
    max-width: 900px;
    margin: auto;
    position: relative;
    z-index: 2;
}

.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    color: #94A3B8;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: .25s;
}

.back:hover {
    color: white;
    transform: translateX(-4px);
}

h1 {
    margin-bottom: 25px;
    font-size: 28px;
}

.order {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
}

.id {
    font-size: 20px;
    font-weight: 700;
}

.date {
    color: #94A3B8;
    font-size: 13px;
    margin-top: 4px;
}

.status {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
}

.Pending { background: #475569; }
.Packed { background: #EA580C; }
.Shipped { background: #2563EB; }
.Delivered { background: #16A34A; }

.items {
    margin-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 15px;
}

.item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    color: #E2E8F0;
    font-size: 15px;
}

.total {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    justify-content: space-between;
    font-size: 18px;
    font-weight: bold;
}

.address {
    margin-top: 12px;
    color: #CBD5E1;
    font-size: 14px;
    line-height: 1.6;
}

.empty {
    text-align: center;
    padding: 70px 20px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
}

.empty h2 {
    font-size: 22px;
    margin-bottom: 8px;
}

.empty p {
    color: #94A3B8;
}

.empty a {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 22px;
    border-radius: 12px;
    background: #2563EB;
    color: white;
    text-decoration: none;
    font-weight: 600;
    transition: .25s;
}

.empty a:hover {
    background: #1D4ED8;
    transform: translateY(-2px);
}

@media(max-width: 600px) {
    body {
        padding: 18px 12px;
    }

    .top {
        flex-direction: column;
        align-items: flex-start;
    }

    .item {
        font-size: 14px;
    }

    .total {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">
  <i class="fa-solid fa-arrow-left"></i> Back to Shop
</a>

<h1>📦 My Orders</h1>

<div id="orders"></div>

</div>

<script>
async function loadOrders(){
  try {
    const res = await fetch("/my-orders");

    if(res.status === 401){
      window.location = "login.html";
      return;
    }

    const orders = await res.json();
    const container = document.getElementById("orders");
    container.innerHTML = "";

    if(!orders || orders.length === 0){
      container.innerHTML = `
        <div class="empty">
          <h2>No Orders Yet</h2>
          <p>You haven't placed any orders.</p>
          <a href="index.html">Start Shopping</a>
        </div>
      `;
      return;
    }

    orders.forEach(o => {
      let items = [];

      try {
        items = typeof o.items === "string" ? JSON.parse(o.items) : o.items;
      } catch(e) {
        items = [];
      }

      const itemHTML = items.map(i => `
        <div class="item">
          <span>${i.name} × ${i.qty}</span>
          <span>${Number(i.price * i.qty).toLocaleString()} MMK</span>
        </div>
      `).join("");

      container.innerHTML += `
        <div class="order">
          <div class="top">
            <div>
              <div class="id">Order #${o.id}</div>
              <div class="date">${o.created_at || ""}</div>
            </div>
            <div class="status ${o.status}">${o.status}</div>
          </div>

          <div class="items">
            ${itemHTML}
          </div>

          <div class="address">
            <b>Delivery Address</b><br>
            ${o.address || "N/A"}<br>
            📞 ${o.phone || "N/A"}
          </div>

          <div class="total">
            <span>Total</span>
            <span>${Number(o.total).toLocaleString()} MMK</span>
          </div>
        </div>
      `;
    });

  } catch (err) {
    document.getElementById("orders").innerHTML = `
      <div class="empty">
        <h2>Cannot connect to server</h2>
        <p>Please check your connection and try again.</p>
      </div>
    `;
  }
}

loadOrders();

// Auto Refresh every 5 seconds
setInterval(loadOrders, 5000);
</script>

</body>
</html>
