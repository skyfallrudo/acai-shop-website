<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | Acai Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:url("bg.jpg") center/cover no-repeat;

    overflow-x:hidden;
    overflow-y:auto;

    position:relative;
    padding:20px;
}

body::before{
    content:"";
    position:absolute;
    inset:0;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(3px);
}

.glow{
    position:absolute;

    top:5%;
    left:50%;

    transform:translateX(-50%);

    width:550px;
    height:180px;

    background:
        radial-gradient(
            circle,
            rgba(255,245,210,.8),
            transparent 75%
        );

    filter:blur(22px);

    pointer-events:none;
}

.card{
    position:relative;
    z-index:2;

    width:100%;
    max-width:430px;

    max-height:calc(100dvh - 40px);

    overflow-y:auto;

    padding:38px;

    border-radius:26px;

    background:rgba(15,23,42,.78);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 25px 60px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    margin-bottom:18px;
}

.logo img{
    width:82px;
    height:82px;

    border-radius:50%;

    background:white;
    padding:6px;
}

h1{
    color:white;

    text-align:center;

    font-size:30px;

    margin-bottom:8px;
}

p{
    text-align:center;

    color:#94A3B8;

    margin-bottom:24px;

    font-size:14px;
}

.email{
    color:#60A5FA;

    text-align:center;

    font-size:13px;

    margin-bottom:18px;

    word-break:break-word;
}

.otp-boxes{
    display:flex;

    justify-content:center;

    gap:10px;

    margin-bottom:22px;
}

.otp{
    width:52px;
    height:58px;

    border:none;
    outline:none;

    border-radius:14px;

    background:#1E293B;

    color:white;

    font-size:24px;

    text-align:center;

    font-weight:600;

    transition:.25s;
}

.otp:focus{
    border:1px solid #3B82F6;

    box-shadow:
        0 0 18px rgba(37,99,235,.35);
}

#passwordSection{
    display:none;

    margin-top:10px;
}

.input{
    position:relative;

    margin-bottom:18px;
}

.input i{
    position:absolute;

    left:16px;
    top:50%;

    transform:translateY(-50%);

    color:#94A3B8;

    pointer-events:none;
}

.input input{
    width:100%;

    padding:15px 18px 15px 48px;

    background:#1E293B;

    border:1px solid transparent;

    border-radius:14px;

    outline:none;

    color:white;

    font-size:15px;

    transition:.3s;
}

.input input::placeholder{
    color:#94A3B8;
}

.input input:focus{
    border-color:#2563EB;

    box-shadow:
        0 0 18px rgba(37,99,235,.35);
}

button{
    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #3B82F6,
            #2563EB
        );

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

button:hover:not(:disabled){
    transform:translateY(-2px);

    box-shadow:
        0 12px 28px rgba(37,99,235,.4);
}

button:disabled{
    opacity:.75;

    cursor:not-allowed;

    transform:none;
}


#msg{
    margin-top:18px;

    font-size:14px;

    text-align:center;

    min-height:20px;

    line-height:1.5;
}

.success{
    color:#22C55E;
}

.error{
    color:#EF4444;
}

.resend{
    margin-top:18px;

    color:#94A3B8;

    font-size:14px;

    text-align:center;
}

.resend a{
    color:#60A5FA;

    text-decoration:none;

    pointer-events:none;

    opacity:.5;
}

.resend a.active{
    pointer-events:auto;

    opacity:1;
}

.back{
    display:block;

    text-align:center;

    margin-top:18px;

    color:#60A5FA;

    text-decoration:none;
}


/* =========================
   LOADING
   ========================= */

.loading-overlay{
    position:fixed;

    inset:0;

    background:rgba(5,10,20,.78);

    backdrop-filter:blur(8px);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:9999;
}

.loading-box{
    background:rgba(15,23,42,.92);

    padding:35px;

    border-radius:24px;

    border:1px solid rgba(255,255,255,.08);

    text-align:center;

    min-width:300px;
}

.spinner{
    width:58px;
    height:58px;

    margin:auto;

    border:4px solid rgba(255,255,255,.12);

    border-top:4px solid #3B82F6;

    border-radius:50%;

    animation:spin .9s linear infinite;
}

@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}

.loading-box h3{
    color:white;

    margin:18px 0 8px;
}

.loading-box p{
    color:#94A3B8;

    margin:0;
}


@media(max-width:480px){

    .card{
        padding:30px 20px;
    }

    .otp{
        width:45px;
        height:52px;
        font-size:22px;
    }

}

</style>

</head>


<body>

<div class="glow"></div>


<div class="card">

    <div class="logo">

        <img
            src="logo.jpg"
            alt="Acai Shop"
        >

    </div>


    <h1>
        Reset Password
    </h1>


    <p id="description">
        Enter the verification code sent to your email.
    </p>


    <div
        class="email"
        id="emailText"
    ></div>


    <!-- =========================
         OTP SECTION
         ========================= -->

    <div id="otpSection">

        <div class="otp-boxes">

            <input
                class="otp"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
            >

            <input
                class="otp"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                class="otp"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                class="otp"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                class="otp"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                class="otp"
                maxlength="1"
                inputmode="numeric"
            >

        </div>


        <button
            id="verifyBtn"
            type="button"
        >

            <i class="fa-solid fa-paper-plane"></i>

            Verify OTP

        </button>


        <div
            class="resend"
            id="resendSection"
        >

            Resend OTP in
            <span id="timer">60</span>s

            <br>
            <br>

            <a
                href="#"
                id="resendLink"
            >
                Resend OTP
            </a>

        </div>

    </div>


    <!-- =========================
         MESSAGE
         IMPORTANT:
         Outside otpSection
         ========================= -->

    <div id="msg"></div>


    <!-- =========================
         PASSWORD SECTION
         ========================= -->

    <div id="passwordSection">

        <div class="input">

            <i class="fa-solid fa-lock"></i>

            <input
                id="password"
                type="password"
                placeholder="New Password"
                autocomplete="new-password"
            >

        </div>


        <div class="input">

            <i class="fa-solid fa-lock"></i>

            <input
                id="confirm"
                type="password"
                placeholder="Confirm Password"
                autocomplete="new-password"
            >

        </div>


        <button
            id="resetBtn"
            type="button"
        >

            <i class="fa-solid fa-floppy-disk"></i>

            Reset Password

        </button>

    </div>


    <a
        href="login.html"
        class="back"
    >
        ← Back to Login
    </a>

</div>


<!-- =========================
     LOADING OVERLAY
     ========================= -->

<div
    id="loadingOverlay"
    class="loading-overlay"
>

    <div class="loading-box">

        <div class="spinner"></div>

        <h3 id="loadingTitle">
            Please wait...
        </h3>

        <p id="loadingText">
            Please wait a moment.
        </p>

    </div>

</div>


<script>

/* =====================================================
   GET EMAIL
   ===================================================== */

const params =
    new URLSearchParams(location.search);


const email =
    params.get("email") ||
    sessionStorage.getItem("resetEmail");


const emailText =
    document.getElementById("emailText");


if(email){

    emailText.innerText = email;

}else{

    emailText.innerText =
        "No email address found.";

}


/* =====================================================
   OTP INPUTS
   ===================================================== */

const inputs =
    document.querySelectorAll(".otp");


let verifiedOtp = "";

let otpVerified = false;


if(inputs.length > 0){

    inputs[0].focus();

}



inputs.forEach((input,index)=>{

    input.addEventListener("input",()=>{

        input.value =
            input.value.replace(/\D/g,"");


        if(
            input.value &&
            index < inputs.length - 1
        ){

            inputs[index + 1].focus();

        }

    });


    input.addEventListener("keydown",(e)=>{

        if(
            e.key === "Backspace" &&
            !input.value &&
            index > 0
        ){

            inputs[index - 1].focus();

        }

    });

});



document.addEventListener("paste",(e)=>{

    const text =
        (
            e.clipboardData.getData("text") ||
            ""
        )
        .replace(/\D/g,"")
        .slice(0,6);


    if(text.length === 6){

        inputs.forEach((input,index)=>{

            input.value =
                text[index];

        });


        inputs[5].focus();

        e.preventDefault();

    }

});




function show(text,type){

    const message =
        document.getElementById("msg");


    message.innerText =
        text;


    message.className =
        type || "";

}




const loadingOverlay =
    document.getElementById("loadingOverlay");

const loadingTitle =
    document.getElementById("loadingTitle");

const loadingText =
    document.getElementById("loadingText");


function loading(showLoading,title,text){

    if(showLoading){

        loadingTitle.innerText =
            title || "Please wait...";

        loadingText.innerText =
            text || "Please wait a moment.";

        loadingOverlay.style.display =
            "flex";

    }else{

        loadingOverlay.style.display =
            "none";

    }

}


let time = 60;

const timer =
    document.getElementById("timer");

const resend =
    document.getElementById("resendLink");


let interval;


function startTimer(){

    clearInterval(interval);

    time = 60;

    timer.innerText = "60";

    resend.classList.remove("active");


    interval =
        setInterval(()=>{

            time--;

            timer.innerText =
                time;


            if(time <= 0){

                clearInterval(interval);

                timer.innerText =
                    "0";

                resend.classList.add(
                    "active"
                );

            }

        },1000);

}


startTimer();


resend.addEventListener(
    "click",
    async function(e){

        e.preventDefault();


        if(
            !resend.classList.contains("active")
        ){

            return;

        }


        if(!email){

            show(
                "Email address not found.",
                "error"
            );

            return;

        }


        loading(
            true,
            "Sending verification code...",
            "Please wait a moment."
        );


        try{

            const response =
                await fetch(
                    "/forgot-password",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            email:email
                        })
                    }
                );


            const data =
                await response.json();


            loading(false);


            if(
                !response.ok ||
                !data.success
            ){

                show(
                    data.message ||
                    "Failed to send OTP.",
                    "error"
                );

                return;

            }


            otpVerified = false;

            verifiedOtp = "";


            inputs.forEach(input=>{

                input.value = "";

            });


            inputs[0].focus();


            show(
                "New OTP sent.",
                "success"
            );


            startTimer();


        }catch(error){

            console.error(error);


            loading(false);


            show(
                "Cannot connect to server.",
                "error"
            );

        }

    }
);



document
.getElementById("verifyBtn")
.addEventListener(
    "click",
    async ()=>{


        if(!email){

            show(
                "Email address not found.",
                "error"
            );

            return;

        }


        const otp =
            [...inputs]
            .map(input=>input.value)
            .join("");


        if(!/^\d{6}$/.test(otp)){

            show(
                "Enter all 6 digits.",
                "error"
            );

            return;

        }


        const verifyBtn =
            document.getElementById(
                "verifyBtn"
            );


        verifyBtn.disabled = true;

        verifyBtn.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';


        try{

            const response =
                await fetch(
                    "/reset-password",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            email:email,

                            otp:otp,

                            password:"__VERIFY__"

                        })
                    }
                );


            const data =
                await response.json();


            if(
                !response.ok ||
                data.success !== true ||
                data.verified !== true
            ){

                show(
                    data.message ||
                    "Wrong OTP.",
                    "error"
                );


                otpVerified = false;

                verifiedOtp = "";


                verifyBtn.disabled =
                    false;

                verifyBtn.innerHTML =
                    '<i class="fa-solid fa-paper-plane"></i> Verify OTP';


                return;

            }


            /* OTP VERIFIED */

            otpVerified = true;

            verifiedOtp = otp;


            clearInterval(interval);


            /* Hide OTP */

            document
            .getElementById("otpSection")
            .style.display = "none";


            /* Show Password */

            document
            .getElementById("passwordSection")
            .style.display = "block";


            document
            .getElementById("description")
            .innerText =
                "Enter your new password twice.";


            show(
                "OTP verified. Enter your new password.",
                "success"
            );


            /*
             * Focus new password
             */

            document
            .getElementById("password")
            .focus();


        }catch(error){

            console.error(error);


            otpVerified = false;

            verifiedOtp = "";


            show(
                "Cannot connect to server.",
                "error"
            );


            verifyBtn.disabled =
                false;

            verifyBtn.innerHTML =
                '<i class="fa-solid fa-paper-plane"></i> Verify OTP';

        }

    }
);


/* =====================================================
   RESET PASSWORD
   ===================================================== */

document
.getElementById("resetBtn")
.addEventListener(
    "click",
    async ()=>{


        /*
         * OTP MUST BE VERIFIED
         */

        if(!otpVerified){

            show(
                "Please verify your OTP first.",
                "error"
            );

            return;

        }


        const passwordInput =
            document.getElementById("password");


        const confirmInput =
            document.getElementById("confirm");


        const password =
            passwordInput.value.trim();


        const confirm =
            confirmInput.value.trim();


        /*
         * PASSWORD EMPTY
         */

        if(!password){

            show(
                "Please enter a new password.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        /*
         * PASSWORD LENGTH
         */

        if(password.length < 6){

            show(
                "Password must be at least 6 characters.",
                "error"
            );

            passwordInput.focus();

            return;

        }


        /*
         * CONFIRM PASSWORD EMPTY
         */

        if(!confirm){

            show(
                "Please confirm your new password.",
                "error"
            );

            confirmInput.focus();

            return;

        }


        /*
         * PASSWORD MATCH
         */

        if(password !== confirm){

            show(
                "Passwords do not match.",
                "error"
            );

            confirmInput.focus();

            return;

        }


        const button =
            document.getElementById(
                "resetBtn"
            );


        button.disabled = true;


        loading(
            true,
            "Resetting password...",
            "Please wait a moment."
        );


        try{

            const response =
                await fetch(
                    "/reset-password",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({

                            email:email,

                            otp:verifiedOtp,

                            password:password

                        })
                    }
                );


            const data =
                await response.json();


            loading(false);


            /*
             * SERVER SUCCESS
             */

            if(
                !response.ok ||
                data.success !== true
            ){

                button.disabled =
                    false;


                show(
                    data.message ||
                    "Failed to reset password.",
                    "error"
                );


                return;

            }


            /*
             * PASSWORD SUCCESSFULLY UPDATED
             */

            otpVerified = false;

            verifiedOtp = "";


            show(
                "Password updated successfully!",
                "success"
            );


            /*
             * Clear saved email
             */

            sessionStorage.removeItem(
                "resetEmail"
            );


            /*
             * Disable inputs
             */

            passwordInput.disabled = true;

            confirmInput.disabled = true;


            /*
             * Wait 1.2 seconds,
             * then go to login page.
             */

            setTimeout(()=>{

                location.href =
                    "login.html";

            },1200);


        }catch(error){

            console.error(error);


            loading(false);


            button.disabled =
                false;


            show(
                "Cannot connect to server.",
                "error"
            );

        }

    }
);

</script>

</body>
</html>
