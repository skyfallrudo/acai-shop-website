<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Acai Shop</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

body {
    background-color: #05080f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 20px;
    position: relative;
    color: white;
}

/* Background ပုံကို fixed အလွှာသီးသန့်ခွဲထုတ်ပြီး PC/Mobile ခွဲခြားပေးထားသည် */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}

/* PC (ကွန်ပျူတာ Screen များ) အတွက် Desktop ပုံ */
@media (min-width: 769px) {
    body::after {
        background-image: url("https://raw.githubusercontent.com/skyfallrudo/acai-assets/main/bg-desktop.jpg");
    }
}

/* ဖုန်း Screen များအတွက် Mobile ပုံ */
@media (max-width: 768px) {
    body::after {
        background-image: url("https://raw.githubusercontent.com/skyfallrudo/acai-assets/main/bg-mobile.jpg");
    }
}

/* အမည်းရောင် ပါးပါးအုပ်ထားသည့် အလွှာ (Blur မပါသောကြောင့် ပုံမဝါးပါ) */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 8, 15, 0.65);
    z-index: -1;
}

.container {
    width: 100%;
    max-width: 430px;
    padding: 20px;
    position: relative;
    z-index: 2;
}

.card {
    width: 100%;
    padding: 35px 30px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
}

.logo {
    width: 85px;
    height: 85px;
    display: block;
    margin: 0 auto 18px;
    object-fit: cover;
    border-radius: 50%;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.1);
}

h1 {
    text-align: center;
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #CBD5E1;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 28px;
}

.input-group {
    position: relative;
    margin-bottom: 18px;
}

.input-group i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #94A3B8;
    font-size: 15px;
}

input {
    width: 100%;
    height: 52px;
    padding: 0 16px 0 45px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    outline: none;
    background: rgba(30, 41, 59, 0.6);
    color: white;
    font-family: "Poppins", sans-serif;
    font-size: 14px;
    transition: all 0.25s ease;
}

input::placeholder {
    color: #94A3B8;
}

input:focus {
    border-color: #3B82F6;
    background: rgba(30, 41, 59, 0.9);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
}

#sendOtpBtn {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 14px;
    background: #2563EB;
    color: white;
    font-family: "Poppins", sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
}

#sendOtpBtn:hover:not(:disabled) {
    background: #1D4ED8;
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
}

#sendOtpBtn:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

/* Spinner */
.spinner {
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255, 255, 255, 0.35);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: none;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Loading text */
#loadingMessage {
    display: none;
    text-align: center;
    margin-top: 18px;
    color: #93C5FD;
    font-size: 13px;
    line-height: 1.7;
}

.loading-title {
    font-weight: 600;
    color: white;
}

/* Error */
#errorMessage {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #FCA5A5;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
}

/* Success */
#successMessage {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #86EFAC;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
}

.back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 22px;
    text-align: center;
    color: #93C5FD;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.25s ease;
}

.back:hover {
    color: white;
}

@media (max-width: 480px) {
    .container {
        padding: 15px;
    }

    .card {
        padding: 30px 22px;
    }

    h1 {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <img src="logo.jpg" class="logo" alt="Acai Shop">

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered email address and<br>
            we'll send you a verification code.
        </p>

        <form id="forgotForm">

            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <button type="submit" id="sendOtpBtn">
                <span id="spinner" class="spinner"></span>
                <i id="buttonIcon" class="fa-solid fa-paper-plane"></i>
                <span id="buttonText">Send OTP</span>
            </button>

        </form>

        <!-- Loading -->
        <div id="loadingMessage">
            <div class="loading-title">Sending verification code...</div>
            <div>Please wait a moment.</div>
        </div>

        <!-- Error -->
        <div id="errorMessage"></div>

        <!-- Success -->
        <div id="successMessage">
            Verification code sent successfully.
        </div>

        <a href="register.html" class="back">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Sign In
        </a>

    </div>

</div>

<script>
const forgotForm = document.getElementById("forgotForm");
const emailInput = document.getElementById("email");
const sendOtpBtn = document.getElementById("sendOtpBtn");
const spinner = document.getElementById("spinner");
const buttonIcon = document.getElementById("buttonIcon");
const buttonText = document.getElementById("buttonText");
const loadingMessage = document.getElementById("loadingMessage");
const errorMessage = document.getElementById("errorMessage");
const successMessage = document.getElementById("successMessage");

/* ---------------- Loading ---------------- */
function setLoading(isLoading) {
    if (isLoading) {
        sendOtpBtn.disabled = true;
        spinner.style.display = "block";
        buttonIcon.style.display = "none";
        buttonText.textContent = "Sending...";
        loadingMessage.style.display = "block";
        errorMessage.style.display = "none";
        successMessage.style.display = "none";
    } else {
        sendOtpBtn.disabled = false;
        spinner.style.display = "none";
        buttonIcon.style.display = "inline-block";
        buttonText.textContent = "Send OTP";
        loadingMessage.style.display = "none";
    }
}

/* ---------------- Send OTP ---------------- */
forgotForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = emailInput.value.trim();

    errorMessage.style.display = "none";
    successMessage.style.display = "none";

    if (!email) {
        errorMessage.textContent = "Please enter your email address.";
        errorMessage.style.display = "block";
        return;
    }

    /* Start spinner */
    setLoading(true);

    try {
        const response = await fetch("/forgot-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Failed to send verification code."
            );
        }

        /* Save email for reset-password.html */
        sessionStorage.setItem("resetEmail", email);

        /* Show success message before redirecting */
        successMessage.textContent = "Verification code sent successfully.";
        successMessage.style.display = "block";

        /* Redirect to reset-password.html */
        setTimeout(function() {
            window.location.href = "reset-password.html";
        }, 500);

    } catch (error) {
        console.error("Forgot password error:", error);

        setLoading(false);

        errorMessage.textContent =
            error.message || "Something went wrong. Please try again.";
        errorMessage.style.display = "block";
    }
});

/* ---------------- Input Change ---------------- */
emailInput.addEventListener("input", function() {
    errorMessage.style.display = "none";
});
</script>

</body>
</html>
