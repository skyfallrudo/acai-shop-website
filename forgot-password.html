<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password - Acai Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: "Poppins", sans-serif;

    background:
        linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.55)),
        url("bg.jpg") center/cover fixed no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
}

.container {
    width: 100%;
    max-width: 430px;
    padding: 20px;
}

.card {
    width: 100%;
    padding: 35px 30px;

    background: rgba(15,20,35,.78);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow: 0 20px 50px rgba(0,0,0,.45);
}

.logo {
    width: 85px;
    height: 85px;

    display: block;
    margin: 0 auto 18px;

    object-fit: cover;
    border-radius: 50%;

    box-shadow: 0 5px 25px rgba(0,0,0,.35);
}

h1 {
    text-align: center;
    font-size: 25px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #bfc6d4;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 28px;
}

.input-group {
    position: relative;
    margin-bottom: 18px;
}

.input-group i {
    position: absolute;

    left: 16px;
    top: 50%;

    transform: translateY(-50%);

    color: #9da7bb;
    font-size: 15px;
}

input {
    width: 100%;
    height: 52px;

    padding: 0 16px 0 45px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 13px;

    outline: none;

    background: rgba(255,255,255,.08);
    color: white;

    font-family: "Poppins", sans-serif;
    font-size: 14px;

    transition: .2s;
}

input::placeholder {
    color: #929aaa;
}

input:focus {
    border-color: #6ea8ff;

    background: rgba(255,255,255,.10);

    box-shadow:
        0 0 0 3px rgba(110,168,255,.10);
}

#sendOtpBtn {
    width: 100%;
    height: 52px;

    border: none;
    border-radius: 13px;

    background: #4f8cff;
    color: white;

    font-family: "Poppins", sans-serif;
    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    transition: .2s;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;
}

#sendOtpBtn:hover:not(:disabled) {
    background: #3979ee;
    transform: translateY(-1px);
}

#sendOtpBtn:disabled {
    opacity: .7;
    cursor: not-allowed;
}

/* Spinner */

.spinner {
    width: 18px;
    height: 18px;

    border: 3px solid rgba(255,255,255,.35);
    border-top-color: white;

    border-radius: 50%;

    animation: spin .8s linear infinite;

    display: none;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Loading text */

#loadingMessage {
    display: none;

    text-align: center;

    margin-top: 18px;

    color: #dce5ff;

    font-size: 13px;
    line-height: 1.7;
}

.loading-title {
    font-weight: 600;
    color: white;
}

/* Error */

#errorMessage {
    display: none;

    margin-top: 16px;
    padding: 12px 14px;

    border-radius: 10px;

    background: rgba(255,70,70,.12);

    border: 1px solid rgba(255,90,90,.25);

    color: #ff9b9b;

    text-align: center;

    font-size: 13px;
    line-height: 1.5;
}

/* Success */

#successMessage {
    display: none;

    margin-top: 16px;
    padding: 12px 14px;

    border-radius: 10px;

    background: rgba(70,220,130,.10);

    border: 1px solid rgba(70,220,130,.22);

    color: #8ff0b0;

    text-align: center;

    font-size: 13px;
    line-height: 1.5;
}

.back {
    display: block;

    margin-top: 22px;

    text-align: center;

    color: #9fbfff;

    text-decoration: none;

    font-size: 13px;

    transition: .2s;
}

.back:hover {
    color: white;
}

@media (max-width: 480px) {

    .container {
        padding: 15px;
    }

    .card {
        padding: 30px 22px;
    }

    h1 {
        font-size: 23px;
    }

}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <img
            src="logo.jpg"
            class="logo"
            alt="Acai Shop"
        >

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered email address and<br>
            we'll send you a verification code.
        </p>


        <form id="forgotForm">

            <div class="input-group">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                id="sendOtpBtn"
            >

                <span
                    id="spinner"
                    class="spinner"
                ></span>

                <i
                    id="buttonIcon"
                    class="fa-solid fa-paper-plane"
                ></i>

                <span id="buttonText">
                    Send OTP
                </span>

            </button>

        </form>


        <!-- Loading -->

        <div id="loadingMessage">

            <div class="loading-title">
                Sending verification code...
            </div>

            <div>
                Please wait a moment.
            </div>

        </div>


        <!-- Error -->

        <div id="errorMessage"></div>


        <!-- Success -->

        <div id="successMessage">
            Verification code sent successfully.
        </div>


        <a
            href="register.html"
            class="back"
        >
            <i class="fa-solid fa-arrow-left"></i>
            Back to Sign In
        </a>

    </div>

</div>


<script>

const forgotForm =
    document.getElementById("forgotForm");

const emailInput =
    document.getElementById("email");

const sendOtpBtn =
    document.getElementById("sendOtpBtn");

const spinner =
    document.getElementById("spinner");

const buttonIcon =
    document.getElementById("buttonIcon");

const buttonText =
    document.getElementById("buttonText");

const loadingMessage =
    document.getElementById("loadingMessage");

const errorMessage =
    document.getElementById("errorMessage");

const successMessage =
    document.getElementById("successMessage");


/* ---------------- Loading ---------------- */

function setLoading(isLoading) {

    if (isLoading) {

        sendOtpBtn.disabled = true;

        spinner.style.display = "block";

        buttonIcon.style.display = "none";

        buttonText.textContent = "Sending...";

        loadingMessage.style.display = "block";

        errorMessage.style.display = "none";

        successMessage.style.display = "none";

    } else {

        sendOtpBtn.disabled = false;

        spinner.style.display = "none";

        buttonIcon.style.display = "inline-block";

        buttonText.textContent = "Send OTP";

        loadingMessage.style.display = "none";

    }

}


/* ---------------- Send OTP ---------------- */

forgotForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();


        errorMessage.style.display = "none";

        successMessage.style.display = "none";


        if (!email) {

            errorMessage.textContent =
                "Please enter your email address.";

            errorMessage.style.display = "block";

            return;

        }


        /* Start spinner */

        setLoading(true);


        try {

            /*
             * IMPORTANT
             *
             * Your server.js uses:
             *
             * POST /forgot-password
             *
             * NOT /send-forgot-otp
             */

            const response = await fetch(
                "/forgot-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );


            /*
             * Server should return JSON.
             */

            const data =
                await response.json();


            /*
             * Check server response.
             */

            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Failed to send verification code."
                );

            }


            /*
             * Save email for
             * reset-password.html
             */

            sessionStorage.setItem(
                "resetEmail",
                email
            );


            /*
             * Show success message
             * before redirecting.
             */

            successMessage.textContent =
                "Verification code sent successfully.";

            successMessage.style.display =
                "block";


            /*
             * Email was successfully sent.
             * Now go to reset-password.html
             */

            setTimeout(function() {

                window.location.href =
                    "reset-password.html";

            }, 500);


        } catch (error) {

            console.error(
                "Forgot password error:",
                error
            );


            /*
             * ERROR:
             *
             * Stop spinner
             * Hide loading message
             * Enable button again
             */

            setLoading(false);


            errorMessage.textContent =
                error.message ||
                "Something went wrong. Please try again.";

            errorMessage.style.display =
                "block";

        }

    }
);


/* ---------------- Input Change ---------------- */

emailInput.addEventListener(
    "input",
    function() {

        errorMessage.style.display =
            "none";

    }
);

</script>

</body>
</html>
```
