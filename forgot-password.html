<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
<title>Forgot Password | Acai Shop</title>
<script src="language.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
/* --- Light Mode (Default) --- */
:root {
    --bg-color: #f8fafc;
    --text-color: #0f172a;
    --card-bg: #ffffff;
    --border-color: rgba(0, 0, 0, 0.08);
    --primary-blue: #2563eb;
    --accent-text: #2563eb;
    --subtext-color: #64748b;
    --input-bg: #f1f5f9;
}

/* --- Dark Mode --- */
[data-theme="dark"] {
    --bg-color: #05080f;
    --text-color: #ffffff;
    --card-bg: rgba(15, 23, 42, 0.82);
    --border-color: rgba(255, 255, 255, 0.08);
    --primary-blue: #2563eb;
    --accent-text: #60A5FA;
    --subtext-color: #94A3B8;
    --input-bg: #1E293B;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-color: var(--bg-color);
    min-height: 100vh;
    padding: 20px 0;
    color: var(--text-color);
}

/* Top Right Controls Container */
.top-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
}

.icon-btn {
    width: 38px;
    height: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    cursor: pointer;
    transition: 0.3s;
}

.icon-btn:hover {
    background: var(--primary-blue);
    color: white;
    border-color: var(--primary-blue);
}

.language-select {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-color);
    outline: none;
    cursor: pointer;
    font-family: Poppins, sans-serif;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 13px;
}

.language-select option {
    background: #111827;
    color: white;
}

.glow {
    position: fixed;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 550px;
    height: 180px;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.1), transparent 75%);
    filter: blur(22px);
    pointer-events: none;
    z-index: 1;
}

.card {
    position: relative;
    z-index: 2;
    width: 420px;
    padding: 38px;
    border-radius: 26px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25);
    animation: float 5s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

.logo {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    padding: 6px;
    background: white;
    margin: 0 auto 18px auto;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    object-fit: cover;
    display: block;
}

h1 {
    color: var(--text-color);
    text-align: center;
    font-size: 28px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: var(--subtext-color);
    font-size: 13.5px;
    line-height: 1.6;
    margin-bottom: 26px;
}

.input-group {
    position: relative;
    margin-bottom: 20px;
}

.input-group i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--subtext-color);
    font-size: 15px;
}

input {
    width: 100%;
    height: 52px;
    padding: 0 16px 0 48px;
    border: 1px solid var(--border-color);
    border-radius: 14px;
    outline: none;
    background: var(--input-bg);
    color: var(--text-color);
    font-family: "Poppins", sans-serif;
    font-size: 15px;
    transition: all 0.3s ease;
}

input::placeholder {
    color: var(--subtext-color);
}

input:focus {
    border-color: #2563EB;
    box-shadow: 0 0 18px rgba(37, 99, 235, .35);
}

button {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    color: white;
    font-family: "Poppins", sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(37, 99, 235, .4);
}

#errorMessage {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #FCA5A5;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
}

#successMessage {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #86EFAC;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
}

.back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 22px;
    text-align: center;
    color: var(--accent-text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.25s ease;
}

.back:hover {
    text-decoration: underline;
}

.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 10, 20, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.loading-box {
    background: var(--card-bg);
    padding: 35px;
    border-radius: 24px;
    border: 1px solid var(--border-color);
    text-align: center;
    min-width: 300px;
}

.spinner {
    width: 58px;
    height: 58px;
    margin: auto;
    border: 4px solid rgba(255, 255, 255, 0.12);
    border-top: 4px solid #3B82F6;
    border-radius: 50%;
    animation: spin .9s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

.loading-box h3 {
    color: var(--text-color);
    margin: 18px 0 8px;
}

.loading-box p {
    color: var(--subtext-color);
    margin: 0;
}

.captcha-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 10, 20, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9998;
    padding: 20px;
}

.captcha-box {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 28px;
    border-radius: 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    position: relative;
}

.captcha-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.captcha-header h3 {
    color: var(--text-color);
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
}

.captcha-header h3 i {
    color: #3B82F6;
}

.captcha-close {
    background: transparent;
    border: none;
    color: var(--subtext-color);
    font-size: 18px;
    cursor: pointer;
    width: auto;
    padding: 0;
}

.captcha-close:hover {
    color: var(--text-color);
    transform: none;
    box-shadow: none;
}

.captcha-desc {
    color: var(--subtext-color);
    font-size: 12.5px;
    text-align: left;
    margin-bottom: 16px;
    line-height: 1.4;
}

.captcha-canvas-wrap {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    align-items: center;
}

#captchaCanvas {
    width: 100%;
    height: 46px;
    background: var(--input-bg);
    border-radius: 12px;
    border: 1px solid var(--border-color);
    cursor: pointer;
}

.btn-refresh {
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: 12px;
    background: var(--input-bg);
    color: var(--subtext-color);
    flex-shrink: 0;
    border: 1px solid var(--border-color);
}

.btn-refresh:hover {
    color: var(--text-color);
    background: #334155;
    transform: none;
    box-shadow: none;
}

.captcha-input-wrap {
    margin-bottom: 16px;
}

.captcha-input-wrap input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    color: var(--text-color);
    font-size: 16px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
    outline: none;
}

.captcha-input-wrap input:focus {
    border-color: #3B82F6;
}

.captcha-error {
    color: #F87171;
    font-size: 12px;
    margin-top: 6px;
    display: none;
    text-align: left;
}

.captcha-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
}

.captcha-actions button {
    flex: 1;
    height: 44px !important;
    padding: 0 8px !important;
    font-size: 12.5px !important;
    font-weight: 500;
    white-space: nowrap !important;
    border-radius: 12px !important;
    display: flex;
    justify-content: center;
    align-items: center;
}

.btn-cancel {
    background: var(--input-bg) !important;
    color: var(--subtext-color) !important;
    border: 1px solid var(--border-color);
}

.btn-cancel:hover {
    background: #334155 !important;
    color: white !important;
    transform: none !important;
    box-shadow: none !important;
}

@media (max-width: 768px) {
    body {
        padding: 16px !important;
        align-items: flex-start !important;
    }

    .top-controls {
        top: 12px !important;
        right: 12px !important;
    }

    .language-select {
        padding: 6px 10px !important;
        font-size: 12px !important;
    }

    .glow {
        width: 260px !important;
        height: 100px !important;
        top: 8px !important;
    }

    .card {
        width: 100% !important;
        max-width: 420px !important;
        margin: 58px auto 18px !important;
        padding: 24px 18px !important;
        border-radius: 22px !important;
        animation: none !important;
    }

    .logo {
        width: 68px !important;
        height: 68px !important;
        padding: 5px !important;
        margin-bottom: 14px !important;
    }

    h1 {
        font-size: 23px !important;
        line-height: 1.2 !important;
    }

    .subtitle {
        font-size: 13px !important;
        line-height: 1.5 !important;
        margin-bottom: 20px !important;
    }

    .input-group {
        margin-bottom: 15px !important;
    }

    .input-group i {
        left: 14px !important;
        font-size: 15px !important;
    }

    input {
        height: 50px !important;
        padding: 0 14px 0 42px !important;
        font-size: 16px !important;
        border-radius: 12px !important;
    }

    button {
        height: 50px !important;
        padding: 0 !important;
        font-size: 15px !important;
        border-radius: 12px !important;
    }

    .back {
        margin-top: 18px !important;
        font-size: 13px !important;
    }

    .loading-box {
        width: 90% !important;
        max-width: 310px !important;
        min-width: auto !important;
        padding: 26px 20px !important;
    }

    .spinner {
        width: 48px !important;
        height: 48px !important;
    }
}

@media (max-width: 360px) {
    .card {
        padding: 20px 15px !important;
    }

    .logo {
        width: 60px !important;
        height: 60px !important;
    }

    h1 {
        font-size: 20px !important;
    }

    .subtitle {
        font-size: 12px !important;
    }
}
</style>
</head>

<body data-theme="dark">

<div class="top-controls">
    <!-- Dark / Light Mode Toggle Button -->
    <button class="icon-btn" id="theme-toggle" title="Toggle Theme">
        <i class="fa-solid fa-sun" id="theme-icon"></i>
    </button>
    <select class="language-select" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="mm">မြန်မာ</option>
    </select>
</div>

<div class="glow"></div>

<div class="card">
    <img src="logo.jpg" class="logo" alt="Acai Shop">

    <h1 data-lang="forgotPasswordTitle">Forgot Password?</h1>

    <p class="subtitle" data-lang="forgotPasswordSubtitle">
        Enter your registered email address and we'll send you a verification code.
    </p>

    <form id="forgotForm" onsubmit="event.preventDefault(); openCaptchaModal();">
        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                data-lang-placeholder="enterEmailPlaceholder"
                autocomplete="email"
                required
            >
        </div>

        <button type="submit" id="sendOtpBtn">
            <i class="fa-solid fa-paper-plane"></i>
            <span data-lang="sendOtpBtnText">Send OTP</span>
        </button>
    </form>

    <div id="errorMessage"></div>

    <div id="successMessage" data-lang="otpSuccessText">
        Verification code sent successfully.
    </div>

    <a href="login.html" class="back">
        <i class="fa-solid fa-arrow-left"></i>
        <span data-lang="backToSignIn">Back to Sign In</span>
    </a>
</div>

<div id="captchaOverlay" class="captcha-overlay">
    <div class="captcha-box">
        <div class="captcha-header">
            <h3>
                <i class="fa-solid fa-shield-halved"></i> 
                <span data-lang="botVerificationTitle">Bot Verification</span>
            </h3>
            <button type="button" class="captcha-close" onclick="closeCaptchaModal()">✕</button>
        </div>

        <p class="captcha-desc" data-lang="captchaDesc">Please enter the security code shown below:</p>

        <div class="captcha-canvas-wrap">
            <canvas id="captchaCanvas" width="200" height="46" onclick="generateCaptcha()" title="Click to refresh"></canvas>
            <button type="button" class="btn-refresh" onclick="generateCaptcha()" title="Refresh Code">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

        <div class="captcha-input-wrap">
            <input type="text" id="captchaInput" maxlength="5" placeholder="CODE" data-lang-placeholder="captchaPlaceholder" autocomplete="off">
            <div id="captchaError" class="captcha-error">
                <i class="fa-solid fa-circle-exclamation"></i> 
                <span data-lang="captchaErrorText">Incorrect code. Please try again.</span>
            </div>
        </div>

        <div class="captcha-actions">
            <button type="button" class="btn-cancel" onclick="closeCaptchaModal()" data-lang="cancelBtnText">Cancel</button>
            <button type="button" onclick="verifyAndSendOTP()" data-lang="verifySendBtnText">Verify & Send</button>
        </div>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
        <div class="spinner"></div>
        <h3 data-lang="sendingCodeTitle">Sending verification code...</h3>
        <p data-lang="pleaseWaitText">Please wait a moment.</p>
    </div>
</div>

<script>
/* --- Dark/Light Mode Toggle Logic --- */
const themeToggleBtn = document.getElementById("theme-toggle");
const themeIcon = document.getElementById("theme-icon");
const currentTheme = localStorage.getItem("theme") || "dark";

document.body.setAttribute("data-theme", currentTheme);
updateThemeIcon(currentTheme);

themeToggleBtn.addEventListener("click", () => {
    let theme = document.body.getAttribute("data-theme");
    let newTheme = theme === "dark" ? "light" : "dark";
    
    document.body.setAttribute("data-theme", newTheme);
    localStorage.setItem("theme", newTheme);
    updateThemeIcon(newTheme);
});

function updateThemeIcon(theme) {
    if (theme === "dark") {
        themeIcon.className = "fa-solid fa-sun";
    } else {
        themeIcon.className = "fa-solid fa-moon";
    }
}

let generatedCaptcha = "";
const emailInput = document.getElementById("email");
const errorMessage = document.getElementById("errorMessage");
const successMessage = document.getElementById("successMessage");
const loadingOverlay = document.getElementById("loadingOverlay");

function openCaptchaModal() {
    const email = emailInput.value.trim();

    errorMessage.style.display = "none";
    successMessage.style.display = "none";

    if (!email) {
        errorMessage.textContent = "Please enter your email address.";
        errorMessage.style.display = "block";
        return;
    }

    generateCaptcha();
    document.getElementById("captchaInput").value = "";
    document.getElementById("captchaError").style.display = "none";
    document.getElementById("captchaOverlay").style.display = "flex";
}

function closeCaptchaModal() {
    document.getElementById("captchaOverlay").style.display = "none";
}

function generateCaptcha() {
    const canvas = document.getElementById("captchaCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    
    generatedCaptcha = "";
    for (let i = 0; i < 5; i++) {
        generatedCaptcha += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    ctx.fillStyle = document.body.getAttribute("data-theme") === "dark" ? "#0F172A" : "#e2e8f0";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < 4; i++) {
        ctx.strokeStyle = "rgba(148, 163, 184, 0.35)";
        ctx.beginPath();
        ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.stroke();
    }

    ctx.font = "bold 22px 'Poppins', sans-serif";
    for (let i = 0; i < generatedCaptcha.length; i++) {
        ctx.fillStyle = ['#60A5FA', '#F472B6', '#34D399', '#FBBF24', '#A78BFA'][i % 5];
        ctx.save();
        ctx.translate(25 + i * 35, 32);
        ctx.rotate((Math.random() - 0.5) * 0.35);
        ctx.fillText(generatedCaptcha[i], 0, 0);
        ctx.restore();
    }
}

function verifyAndSendOTP() {
    const userInput = document.getElementById("captchaInput").value.trim().toUpperCase();
    const errorEl = document.getElementById("captchaError");

    if (userInput === generatedCaptcha) {
        closeCaptchaModal();
        sendForgotPasswordOTP(); 
    } else {
        errorEl.style.display = "block";
        document.getElementById("captchaInput").value = "";
        generateCaptcha();
    }
}

async function sendForgotPasswordOTP() {
    const email = emailInput.value.trim();

    loadingOverlay.style.display = "flex";

    try {
        const response = await fetch("/forgot-password", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email: email })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Failed to send verification code.");
        }

        sessionStorage.setItem("resetEmail", email);
        loadingOverlay.style.display = "none";
        successMessage.style.display = "block";

        setTimeout(function() {
            window.location.href = "reset-password.html";
        }, 600);

    } catch (error) {
        console.error("Forgot password error:", error);
        loadingOverlay.style.display = "none";
        errorMessage.textContent = error.message || "Something went wrong. Please try again.";
        errorMessage.style.display = "block";
    }
}

emailInput.addEventListener("input", function() {
    errorMessage.style.display = "none";
});

document.addEventListener("DOMContentLoaded", () => {
    const savedLang = localStorage.getItem("language") || "en";
    const langSelect = document.querySelector(".language-select");
    if (langSelect) langSelect.value = savedLang;

    if (typeof changeLanguage === "function") {
        changeLanguage(savedLang);
    }
});
</script>

</body>
</html>
