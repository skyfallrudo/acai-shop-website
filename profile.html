<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | Acai Shop</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F00XQ96WFJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-F00XQ96WFJ');
</script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-color: #05080f;
    min-height: 100vh;
    padding: 20px;
}

body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}


@media (min-width: 769px) {
    body::after {
        background-image: url("bg-desktop.jpg");
    }
}

@media (max-width: 768px) {
    body::after {
        background-image: url("bg-mobile.jpg");
    }
}


body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 8, 15, 0.65);
    z-index: -1;
}

.card {
    position: relative;
    z-index: 2;
    width: min(100%, 460px);
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
}

.top {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: white;
    padding: 6px;
    margin: 0 auto 12px auto;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    object-fit: cover;
    display: block;
}

h1 {
    color: white;
    font-size: 28px;
}

.sub {
    color: #94A3B8;
    font-size: 14px;
    margin-top: 6px;
}

label {
    display: block;
    color: #CBD5E1;
    margin: 16px 0 8px;
    font-size: 14px;
}

.input-box {
    position: relative;
}

.input-box i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748B;
}

.input-box i.textarea-icon {
    top: 18px;
    transform: none;
}

input, textarea {
    width: 100%;
    padding: 14px 14px 14px 44px;
    background: #1E293B;
    border: 1px solid transparent;
    border-radius: 14px;
    color: white;
    outline: none;
    font-size: 15px;
    transition: .25s;
}

textarea {
    padding-top: 14px;
    resize: none;
    height: 90px;
}

input:focus,
textarea:focus {
    border-color: #3B82F6;
    box-shadow: 0 0 16px rgba(59, 130, 246, .25);
}

input[disabled] {
    opacity: .75;
    cursor: not-allowed;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 26px;
}

button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .25s;
}

.save {
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    color: white;
}

.back {
    background: #334155;
    color: white;
}

button:hover {
    transform: translateY(-2px);
}

#msg {
    margin-top: 18px;
    text-align: center;
    font-size: 14px;
    min-height: 20px;
}

.success { color: #22C55E; }
.error { color: #EF4444; }

@media(max-width: 430px) {
    .card {
        padding: 24px 18px;
    }

    .actions {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="card">

<div class="top">
  <img src="logo.jpg" class="logo" alt="Acai Shop">
  <h1>My Profile</h1>
  <div class="sub">Manage your account information</div>
</div>

<label>Username</label>
<div class="input-box">
  <i class="fa-solid fa-user"></i>
  <input id="username" placeholder="Username">
</div>

<label>Email</label>
<div class="input-box">
  <i class="fa-solid fa-envelope"></i>
  <input id="email" disabled>
</div>

<label>Phone</label>
<div class="input-box">
  <i class="fa-solid fa-phone"></i>
  <input id="phone" placeholder="09xxxxxxxxx">
</div>

<label>Address</label>
<div class="input-box">
  <i class="fa-solid fa-location-dot textarea-icon"></i>
  <textarea id="address" placeholder="Your address"></textarea>
</div>

<div class="actions">
  <button class="save" onclick="saveProfile()">
    <i class="fa-solid fa-floppy-disk"></i> Save
  </button>

  <button class="back" onclick="location.href='index.html'">
    <i class="fa-solid fa-arrow-left"></i> Back
  </button>
</div>

<div id="msg"></div>

</div>

<script>
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const phoneInput = document.getElementById("phone");
const addressInput = document.getElementById("address");
const msg = document.getElementById("msg");

async function loadProfile() {
  try {
    const res = await fetch("/profile", { credentials: "same-origin" });

    if (!res.ok) {
      location.href = "login.html";
      return;
    }

    const data = await res.json();

    usernameInput.value = data.user.username || "";
    emailInput.value = data.user.email || "";
    phoneInput.value = data.user.phone || "";
    addressInput.value = data.user.address || "";
  } catch (err) {
    msg.innerText = "Failed to load profile";
    msg.className = "error";
    console.error(err);
  }
}

async function saveProfile() {
  try {
    const res = await fetch("/profile", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        username: usernameInput.value.trim(),
        phone: phoneInput.value.trim(),
        address: addressInput.value.trim()
      })
    });

    const data = await res.json();

    msg.innerText = data.success ? "Profile updated successfully!" : "Update failed";
    msg.className = data.success ? "success" : "error";
  } catch (err) {
    msg.innerText = "Update failed";
    msg.className = "error";
    console.error(err);
  }
}

loadProfile();
</script>

</body>
</html>
