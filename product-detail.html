<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Details - Acai Shop</title>

    <link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">

    <style>
        :root {
            --bg-color: #05080f;
            --text-color: #ffffff;
            --card-bg: #0f172a;
            --nav-bg: rgba(15, 23, 42, 0.88);
            --border-color: rgba(255, 255, 255, 0.09);
            --primary-blue: #2563eb;
            --accent-text: #60a5fa;
            --subtext-color: #94a3b8;
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.88);
            --border-color: rgba(0, 0, 0, 0.08);
            --primary-blue: #2563eb;
            --accent-text: #2563eb;
            --subtext-color: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 95px;
        }

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 5%;
            background: var(--nav-bg);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            transition: 0.25s;
        }

        .nav-btn:hover {
            background: var(--primary-blue);
            color: #fff;
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: #fff;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .detail-container {
            max-width: 1050px;
            margin: 24px auto;
            padding: 0 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            align-items: start;
        }

        .gallery-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            position: relative;
        }

        .slider-window {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow-x: auto;
            display: flex;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            background: #020617;
        }

        .slider-window::-webkit-scrollbar {
            display: none;
        }

        .slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-counter {
            position: absolute;
            bottom: 14px;
            right: 14px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .thumb-strip {
            display: flex;
            gap: 10px;
            padding: 12px;
            overflow-x: auto;
            border-top: 1px solid var(--border-color);
        }

        .thumb-item {
            width: 58px;
            height: 58px;
            border-radius: 10px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.55;
            border: 2px solid transparent;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .thumb-item.active {
            opacity: 1;
            border-color: var(--primary-blue);
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .id-pill {
            display: inline-block;
            width: fit-content;
            padding: 4px 11px;
            border-radius: 8px;
            background: rgba(37, 99, 235, 0.15);
            color: var(--accent-text);
            font-size: 12px;
            font-weight: 600;
        }

        .product-title {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .product-price {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-text);
        }

        .product-stock {
            font-size: 13px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
        }

        .product-stock.out {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border-color);
        }

        .section-label {
            font-size: 13px;
            color: var(--subtext-color);
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }

        .color-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .color-btn {
            padding: 9px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .color-btn.active {
            background: rgba(37, 99, 235, 0.18);
            border-color: var(--primary-blue);
            color: var(--accent-text);
            font-weight: 600;
        }

        .color-btn.sold-out {
            opacity: 0.45;
            text-decoration: line-through;
        }

        .variant-qty-tag {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--subtext-color);
        }

        .color-btn.active .variant-qty-tag {
            background: var(--primary-blue);
            color: #ffffff;
        }

        .qty-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 12px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 8px;
            background: var(--primary-blue);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .qty-value {
            font-size: 15px;
            font-weight: 600;
            min-width: 24px;
            text-align: center;
        }

        .product-desc {
            font-size: 14px;
            color: var(--subtext-color);
            line-height: 1.65;
            white-space: pre-line;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-cart, .btn-buy {
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.25s;
        }

        .btn-cart {
            background: rgba(37, 99, 235, 0.16);
            color: var(--accent-text);
            border: 1px solid rgba(96, 165, 250, 0.35);
        }

        .btn-buy {
            background: var(--primary-blue);
            color: #fff;
        }

        .btn-cart:disabled, .btn-buy:disabled {
            background: #334155;
            color: #64748b;
            border-color: transparent;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .detail-container {
                grid-template-columns: 1fr;
                gap: 18px;
                margin-top: 12px;
            }
            .info-card {
                padding: 20px;
            }
            .product-title {
                font-size: 20px;
            }
            .product-price {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <header class="top-nav">
        <a href="shop.html" class="nav-btn" title="Back to Shop">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <span style="font-weight:600;font-size:16px;">Product Details</span>

        <div style="display:flex;gap:10px;">
            <button class="nav-btn" id="themeBtn" title="Toggle Theme">
                <i class="fa-solid fa-sun" id="themeIcon"></i>
            </button>
            <a href="cart.html" class="nav-btn" title="Cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </a>
        </div>
    </header>

    <main class="detail-container" id="detailContainer">
        <!-- Left: Multi-Image Slider -->
        <div class="gallery-card">
            <div style="position:relative;">
                <div class="slider-window" id="sliderTrack">
                    <div class="slide"><img src="logo.jpg" alt="Loading..."></div>
                </div>
                <div class="slide-counter" id="slideCounter">1 / 1</div>
            </div>
            <div class="thumb-strip" id="thumbStrip"></div>
        </div>

        <!-- Right: Product Details -->
        <div class="info-card">
            <span class="id-pill" id="productCodePill">PRD-0000</span>
            <h1 class="product-title" id="productName">Loading product...</h1>

            <div class="price-row">
                <div class="product-price" id="productPrice">0 MMK</div>
                <div class="product-stock" id="productStock">Stock: 0</div>
            </div>

            <hr class="divider">

            <div>
                <span class="section-label">Select Color / Design</span>
                <div class="color-options" id="colorOptions">
                    <button class="color-btn active">Default</button>
                </div>
            </div>

            <div class="qty-row">
                <span class="section-label" style="margin:0;">Quantity</span>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="changeQty(-1)">-</button>
                    <span class="qty-value" id="qtyValue">1</span>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                </div>
            </div>

            <hr class="divider">

            <div>
                <span class="section-label">Description</span>
                <p class="product-desc" id="productDesc">No description provided.</p>
            </div>

            <div class="action-buttons">
                <button class="btn-cart" id="addToCartBtn" onclick="handleOrderAction(false)">
                    <i class="fa-solid fa-cart-plus"></i> Add to Cart
                </button>
                <button class="btn-buy" id="buyNowBtn" onclick="handleOrderAction(true)">
                    <i class="fa-solid fa-bolt"></i> Buy Now
                </button>
            </div>
        </div>
    </main>

    <script>
        /* Theme Setup */
        const themeBtn = document.getElementById("themeBtn");
        const themeIcon = document.getElementById("themeIcon");
        const savedTheme = localStorage.getItem("theme") || "dark";
        if (savedTheme === "light") {
            document.body.setAttribute("data-theme", "light");
            themeIcon.className = "fa-solid fa-moon";
        }

        themeBtn.addEventListener("click", () => {
            const isLight = document.body.getAttribute("data-theme") === "light";
            if (isLight) {
                document.body.removeAttribute("data-theme");
                localStorage.setItem("theme", "dark");
                themeIcon.className = "fa-solid fa-sun";
            } else {
                document.body.setAttribute("data-theme", "light");
                localStorage.setItem("theme", "light");
                themeIcon.className = "fa-solid fa-moon";
            }
        });

        /* Cart Count */
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        function updateCartBadge() {
            const total = cart.reduce((sum, item) => sum + (Number(item.qty) || 1), 0);
            document.getElementById("cartCount").innerText = total;
        }
        updateCartBadge();

        /* Product & Variant Stock Logic */
        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id");

        let currentProduct = null;
        let variantsList = []; // [{ name: "Black", stock: 5 }, ...]
        let selectedVariant = { name: "Default", stock: 0 };
        let selectedQty = 1;
        let productImages = [];

        /* Parse "Black:5, White:2" or "Black, White" */
        function parseVariants(colorsStr, fallbackTotalStock) {
            const rawParts = String(colorsStr || "")
                .split(",")
                .map(s => s.trim())
                .filter(Boolean);

            if (rawParts.length === 0) {
                return [{ name: "Default", stock: Number(fallbackTotalStock) || 0, hasCustomStock: false }];
            }

            return rawParts.map(part => {
                if (part.includes(":")) {
                    const [cName, cQty] = part.split(":");
                    const parsedStock = Number(cQty);
                    return {
                        name: cName.trim(),
                        stock: Number.isFinite(parsedStock) && parsedStock >= 0 ? parsedStock : 0,
                        hasCustomStock: true
                    };
                }
                return {
                    name: part.trim(),
                    stock: Number(fallbackTotalStock) || 0,
                    hasCustomStock: false
                };
            });
        }

        function updateStockDisplay() {
            const stockEl = document.getElementById("productStock");
            const addBtn = document.getElementById("addToCartBtn");
            const buyBtn = document.getElementById("buyNowBtn");
            const available = Number(selectedVariant.stock) || 0;

            if (available > 0) {
                stockEl.innerText = `${selectedVariant.name !== "Default" ? selectedVariant.name + " • " : ""}In Stock: ${available}`;
                stockEl.classList.remove("out");
                addBtn.disabled = false;
                buyBtn.disabled = false;
                if (selectedQty > available) {
                    selectedQty = available;
                    document.getElementById("qtyValue").innerText = selectedQty;
                }
            } else {
                stockEl.innerText = `${selectedVariant.name !== "Default" ? selectedVariant.name + " • " : ""}Out of Stock`;
                stockEl.classList.add("out");
                addBtn.disabled = true;
                buyBtn.disabled = true;
            }
        }

        function selectVariant(index) {
            selectedVariant = variantsList[index];
            selectedQty = 1;
            document.getElementById("qtyValue").innerText = 1;

            document.querySelectorAll(".color-btn").forEach((btn, idx) => {
                btn.classList.toggle("active", idx === index);
            });

            updateStockDisplay();
        }

        function changeQty(delta) {
            if (!currentProduct) return;
            const maxStock = Number(selectedVariant.stock) || 0;
            const next = selectedQty + delta;
            if (next < 1) return;
            if (next > maxStock) {
                alert(`Only ${maxStock} left for ${selectedVariant.name}.`);
                return;
            }
            selectedQty = next;
            document.getElementById("qtyValue").innerText = selectedQty;
        }

        function goToSlide(index) {
            const slider = document.getElementById("sliderTrack");
            slider.scrollTo({
                left: slider.clientWidth * index,
                behavior: "smooth"
            });
        }

        document.getElementById("sliderTrack").addEventListener("scroll", function() {
            if (!productImages.length) return;
            const index = Math.round(this.scrollLeft / this.clientWidth);
            document.getElementById("slideCounter").innerText = `${index + 1} / ${productImages.length}`;
            document.querySelectorAll(".thumb-item").forEach((t, i) => {
                t.classList.toggle("active", i === index);
            });
        });

        async function loadSingleProduct() {
            if (!productId) {
                document.getElementById("productName").innerText = "Product not selected.";
                return;
            }

            try {
                const res = await fetch("/products");
                const products = await res.json();
                const item = products.find(p => String(p.id) === String(productId));

                if (!item) {
                    document.getElementById("productName").innerText = "Product not found.";
                    document.getElementById("addToCartBtn").disabled = true;
                    document.getElementById("buyNowBtn").disabled = true;
                    return;
                }

                currentProduct = item;
                document.title = `${item.name} - Acai Shop`;

                const code = "PRD-" + String(item.id).padStart(4, "0");
                document.getElementById("productCodePill").innerText = `#${item.id} • ${code}`;
                document.getElementById("productName").innerText = item.name;
                document.getElementById("productPrice").innerText = Number(item.price).toLocaleString() + " MMK";
                document.getElementById("productDesc").innerText = item.description || "High quality item from Acai Shop.";

                /* Multiple Images Setup */
                productImages = [];
                try {
                    if (item.images) {
                        const parsed = JSON.parse(item.images);
                        if (Array.isArray(parsed)) productImages = parsed.filter(Boolean);
                    }
                } catch (e) {}

                if (productImages.length === 0 && item.image) {
                    productImages = [item.image];
                }
                if (productImages.length === 0) {
                    productImages = ["logo.jpg"];
                }

                productImages = productImages.map(img => 
                    img.startsWith("http") || img === "logo.jpg" ? img : "/uploads/" + img
                );

                const sliderTrack = document.getElementById("sliderTrack");
                sliderTrack.innerHTML = productImages.map(src => `
                    <div class="slide">
                        <img src="${src}" onerror="this.src='logo.jpg'" alt="${item.name}">
                    </div>
                `).join("");

                document.getElementById("slideCounter").innerText = `1 / ${productImages.length}`;

                const thumbStrip = document.getElementById("thumbStrip");
                if (productImages.length > 1) {
                    thumbStrip.style.display = "flex";
                    thumbStrip.innerHTML = productImages.map((src, idx) => `
                        <img src="${src}" class="thumb-item ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})" alt="Thumb">
                    `).join("");
                } else {
                    thumbStrip.style.display = "none";
                }

                /* Variant Stock Setup */
                variantsList = parseVariants(item.colors, item.stock);
                const firstAvailableIdx = variantsList.findIndex(v => v.stock > 0);
                const defaultIdx = firstAvailableIdx >= 0 ? firstAvailableIdx : 0;

                const colorBox = document.getElementById("colorOptions");
                colorBox.innerHTML = variantsList.map((v, idx) => `
                    <button 
                        class="color-btn ${idx === defaultIdx ? 'active' : ''} ${v.stock <= 0 ? 'sold-out' : ''}" 
                        onclick="selectVariant(${idx})"
                    >
                        <span>${v.name}</span>
                        ${v.hasCustomStock ? `<span class="variant-qty-tag">${v.stock}</span>` : ""}
                    </button>
                `).join("");

                selectVariant(defaultIdx);

            } catch (err) {
                console.error("Failed to load product detail:", err);
            }
        }

        async function handleOrderAction(goToCartImmediately) {
            if (!currentProduct) return;

            try {
                const res = await fetch("/me", { credentials: "include" });
                const data = await res.json();
                if (!data.loggedIn) {
                    alert("Login your account first.");
                    window.location.href = "login.html";
                    return;
                }
            } catch (e) {
                alert("Login your account first.");
                window.location.href = "login.html";
                return;
            }

            const maxStock = Number(selectedVariant.stock) || 0;
            const existing = cart.find(i => 
                String(i.productId || i.id) === String(currentProduct.id) && 
                (i.color || "Default") === selectedVariant.name
            );
            const currentInCart = existing ? Number(existing.qty) : 0;

            if (currentInCart + selectedQty > maxStock) {
                alert(`Only ${maxStock} items available for ${selectedVariant.name}.`);
                return;
            }

            if (existing) {
                existing.qty += selectedQty;
            } else {
                cart.push({
                    id: currentProduct.id,
                    productId: currentProduct.id,
                    name: selectedVariant.name !== "Default" ? `${currentProduct.name} (${selectedVariant.name})` : currentProduct.name,
                    color: selectedVariant.name,
                    price: Number(currentProduct.price),
                    qty: selectedQty,
                    image: productImages[0] || "logo.jpg"
                });
            }

            localStorage.setItem("cart", JSON.stringify(cart));
            updateCartBadge();

            if (goToCartImmediately) {
                window.location.href = "cart.html";
            } else {
                alert(`${currentProduct.name} (${selectedVariant.name}) added to cart!`);
            }
        }

        loadSingleProduct();
    </script>
</body>
</html>
