<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Details | Acai Shop</title>
    
    <link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="language.js"></script>

    <style>
        /* --- Light / Dark Mode Colors --- */
        :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --primary-blue: #2563eb;
            --accent-text: #2563eb;
            --subtext-color: #64748b;
            --input-bg: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg-color: #05080f;
            --text-color: #ffffff;
            --card-bg: #0f172a;
            --nav-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-blue: #2563eb;
            --accent-text: #60a5fa;
            --subtext-color: #94a3b8;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Nav Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 6%;
            background: var(--nav-bg);
            backdrop-filter: blur(18px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-color);
        }

        .logo img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: white;
            padding: 2px;
            object-fit: cover;
        }

        .logo h2 { font-size: 19px; font-weight: 600; }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            text-decoration: none;
            cursor: pointer;
        }

        .language-select {
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
            cursor: pointer;
            font-size: 12px;
        }

        /* Modern Centered E-Commerce Product Layout */
        .product-wrapper {
            max-width: 580px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .product-card-main {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        /* Image Carousel Slider */
        .slider-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #020617;
            overflow: hidden;
        }

        .slider-track {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .slider-track::-webkit-scrollbar { display: none; }

        .slide {
            min-width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-badge {
            position: absolute;
            bottom: 14px;
            right: 14px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: white;
        }

        /* Product Details Section Below Photo */
        .details-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .product-name {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .product-price {
            color: var(--accent-text);
            font-size: 24px;
            font-weight: 800;
        }

        .stock-tag {
            font-size: 13px;
            color: var(--subtext-color);
            background: var(--input-bg);
            padding: 4px 10px;
            border-radius: 8px;
        }

        /* Color / Variant Option Buttons */
        .variant-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .variant-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--subtext-color);
        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-btn {
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .color-btn.active, .color-btn:hover {
            border-color: var(--primary-blue);
            background: rgba(37, 99, 235, 0.15);
            color: var(--accent-text);
        }

        /* Promo Code Section */
        .promo-box {
            display: flex;
            gap: 8px;
        }

        .promo-input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-size: 13px;
        }

        .apply-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            background: var(--input-bg);
            color: var(--text-color);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: 0.3s;
        }

        .apply-btn:hover {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .description {
            font-size: 13.5px;
            color: var(--subtext-color);
            line-height: 1.6;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }

        .btn-cart {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-buy {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: var(--primary-blue);
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .btn-buy:disabled, .btn-cart:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        @media (max-width: 480px) {
            .product-wrapper { margin: 10px auto; }
            .details-body { padding: 16px; gap: 14px; }
            .product-name { font-size: 18px; }
            .product-price { font-size: 20px; }
        }
    </style>
</head>
<body data-theme="dark">

<nav>
    <a href="index.html" class="logo">
        <img src="logo.jpg" alt="Acai Shop">
        <h2>Acai Shop</h2>
    </a>
    <div class="nav-right">
        <button class="icon-btn" id="theme-toggle" title="Toggle Theme">
            <i class="fa-solid fa-moon" id="theme-icon"></i>
        </button>

        <select class="language-select" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="mm">မြန်မာ</option>
        </select>
        
        <a href="cart.html" class="icon-btn" style="position:relative;">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count" style="position:absolute;top:-4px;right:-4px;background:#ef4444;color:white;width:18px;height:18px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:10px;font-weight:700;">0</span>
        </a>
    </div>
</nav>

<div class="product-wrapper">
    <div class="product-card-main">
        
        <!-- 1. Item Image Slider -->
        <div class="slider-box">
            <div class="slider-track" id="sliderTrack">
                <div class="slide"><img id="mainImage" src="logo.jpg" alt="Product Image"></div>
            </div>
            <div class="slide-badge" id="counter">1/1</div>
        </div>

        <!-- 2. Product Information Directly Below Image -->
        <div class="details-body">
            
            <h1 class="product-name" id="productName">Loading product...</h1>
            
            <div class="price-row">
                <div class="product-price" id="productPrice">0 MMK</div>
                <div class="stock-tag" id="productStock">Stock: 0</div>
            </div>

            <!-- Color / Design Selector -->
            <div class="variant-section">
                <div class="variant-title">Select Color / Option:</div>
                <div class="color-options" id="colorOptions">
                    <button class="color-btn active" onclick="selectColor(this)">Default</button>
                    <button class="color-btn" onclick="selectColor(this)">Black</button>
                    <button class="color-btn" onclick="selectColor(this)">Blue</button>
                    <button class="color-btn" onclick="selectColor(this)">White</button>
                </div>
            </div>

            <!-- Promo Code Section -->
            <div class="variant-section">
                <div class="variant-title">Promo Code:</div>
                <div class="promo-box">
                    <input type="text" id="promoInput" class="promo-input" placeholder="Enter coupon code (e.g. ACAI10)">
                    <button class="apply-btn" onclick="applyPromo()">Apply</button>
                </div>
            </div>

            <!-- Description -->
            <p class="description" id="productDesc">
                Premium quality accessories crafted for your lifestyle with exclusive design.
            </p>

            <!-- Action Buttons -->
            <div class="actions">
                <button class="btn-cart" id="addToCartBtn" onclick="addCurrentToCart()">Add to Cart</button>
                <button class="btn-buy" id="buyNowBtn" onclick="buyNow()">Buy Now</button>
            </div>

        </div>

    </div>
</div>

<script>
/* --- Dark/Light Mode --- */
const themeToggleBtn = document.getElementById("theme-toggle");
const themeIcon = document.getElementById("theme-icon");
const currentTheme = localStorage.getItem("theme") || "dark";

document.body.setAttribute("data-theme", currentTheme);
updateThemeIcon(currentTheme);

themeToggleBtn.addEventListener("click", () => {
    let theme = document.body.getAttribute("data-theme");
    let newTheme = theme === "dark" ? "light" : "dark";
    document.body.setAttribute("data-theme", newTheme);
    localStorage.setItem("theme", newTheme);
    updateThemeIcon(newTheme);
});

function updateThemeIcon(theme) {
    themeIcon.className = theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
}

/* --- Product Data & Logic --- */
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let currentProduct = null;
let selectedColor = "Default";

function updateCartCount(){
    const count = cart.reduce((t,i)=>t+i.qty,0);
    const cartCountEl = document.getElementById("cart-count");
    if(cartCountEl) cartCountEl.innerText = count;
}

const urlParams = new URLSearchParams(window.location.search);
const productId = urlParams.get("id");

async function loadProductDetail() {
    try {
        const res = await fetch("/products");
        const products = await res.json();
        const p = products.find(x => String(x.id) === String(productId));

        if (!p) {
            document.getElementById("productName").innerText = "Product not found";
            return;
        }

        currentProduct = p;

        document.getElementById("productName").innerText = p.name;
        document.getElementById("productPrice").innerText = Number(p.price).toLocaleString() + " MMK";
        document.getElementById("productStock").innerText = `Stock: ${p.stock}`;
        
        if(p.description) {
            document.getElementById("productDesc").innerText = p.description;
        }

        const imageUrl = p.image ? (p.image.startsWith("http") ? p.image : "/uploads/" + p.image) : "logo.jpg";
        
        const sliderTrack = document.getElementById("sliderTrack");
        sliderTrack.innerHTML = `
            <div class="slide"><img src="${imageUrl}" alt="${p.name}"></div>
            <div class="slide"><img src="${imageUrl}" alt="${p.name} 2"></div>
        `;
        document.getElementById("counter").innerText = "1/2";

        if(Number(p.stock) <= 0) {
            document.getElementById("addToCartBtn").disabled = true;
            document.getElementById("addToCartBtn").innerText = "Out of Stock";
            document.getElementById("buyNowBtn").disabled = true;
        }

    } catch (err) {
        console.error("Error loading product detail:", err);
    }
}

function selectColor(btn) {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedColor = btn.innerText;
}

function applyPromo() {
    const code = document.getElementById("promoInput").value.trim();
    if(!code) return alert("Please enter a coupon code");
    
    if(code.toUpperCase() === "ACAI10") {
        alert("Success! 10% Discount applied.");
    } else {
        alert("Invalid promo code.");
    }
}

const track = document.getElementById('sliderTrack');
track.addEventListener('scroll', () => {
    const index = Math.round(track.scrollLeft / track.clientWidth) + 1;
    document.getElementById('counter').innerText = `${index}/2`;
});

async function addCurrentToCart() {
    if (!currentProduct) return;

    try {
        const res = await fetch("/me", { credentials: "include" });
        const data = await res.json();
        if (!data.loggedIn) {
            alert("Login your account first.");
            window.location.href = "login.html";
            return;
        }
    } catch (err) {
        alert("Login your account first.");
        window.location.href = "login.html";
        return;
    }

    const itemKey = currentProduct.id + "_" + selectedColor;
    const item = cart.find(i => i.itemKey === itemKey);
    const currentQty = item ? item.qty : 0;

    if (currentQty >= currentProduct.stock) {
        alert("Only " + currentProduct.stock + " items left in stock.");
        return;
    }

    if (item) {
        item.qty++;
    } else {
        cart.push({ 
            id: currentProduct.id, 
            itemKey: itemKey,
            name: `${currentProduct.name} (${selectedColor})`, 
            price: Number(currentProduct.price), 
            qty: 1 
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
    alert(`${currentProduct.name} (${selectedColor}) added to cart!`);
}

function buyNow() {
    addCurrentToCart();
    window.location.href = "cart.html";
}

function initLanguage() {
    const savedLang = localStorage.getItem("language") || "en";
    const langSelect = document.querySelector(".language-select");
    if (langSelect) langSelect.value = savedLang;
    if (typeof changeLanguage === "function") changeLanguage(savedLang);
}

initLanguage();
updateCartCount();
loadProductDetail();
</script>

</body>
</html>
