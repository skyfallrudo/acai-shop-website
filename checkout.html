html, body {

}

body {

    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
    position: relative;
    color: white;
}

body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}

    }
}

@media (max-width: 768px) {

body::before {

    top: 0;

    height: 100vh;

    z-index: -1;

.lang-container {

    border: 1px solid rgba(255,255,255,.15);

    color: white;
    outline: none;
    cursor: pointer;
    font-family: Poppins, sans-serif;
    backdrop-filter: blur(12px);

    font-size: 13px;
}

.language-select option {
    background: #111827;
    color: white;
}

.card {

    padding: 38px 32px;

    position: relative;
    z-index: 2;
}

.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    color: #93C5FD;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.25s ease;
}

.back:hover {
    color: white;
    transform: translateX(-3px);
}

h1 {
    text-align: center;
    margin-bottom: 6px;
    font-size: 30px;
    font-weight: 700;
}

.subtitle {
    text-align: center;
    color: #CBD5E1;
    font-size: 14px;
    margin-bottom: 28px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #CBD5E1;
    font-size: 13.5px;
    font-weight: 500;
}

.input-wrapper {
    position: relative;
}

.input-wrapper i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #94A3B8;
    font-size: 15px;
    pointer-events: none;
}

.input-wrapper.textarea-wrapper i {
    top: 20px;
    transform: none;
}

input, select, textarea {
    width: 100%;
    padding: 14px 16px 14px 45px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    outline: none;
    border-radius: 14px;
    background: rgba(30, 41, 59, 0.6);
    color: white;
    font-family: "Poppins", sans-serif;
    font-size: 14px;
    transition: all 0.25s ease;

textarea {
    resize: vertical;

select {

    background-position: right 14px center;
    cursor: pointer;
}

select option {
    background: #0F172A;
    color: white;
}

input::placeholder,
textarea::placeholder {
    color: #64748B;
}

input:focus, select:focus, textarea:focus {
    border-color: #3B82F6;
    background: rgba(30, 41, 59, 0.9);

    font-size: 16px;

<!-- Language Switcher Dropdown -->
<div class="lang-container">
    <select class="language-select" onchange="changeLanguage(this.value)">

    </select>
</div>

<div class="card">

<a href="cart.html" class="back">

<h1 data-lang="checkoutTitle">Checkout</h1>

<p class="subtitle" data-lang="checkoutSubtitle">
Enter your delivery information.
</p>

    </div>
</div>

<div class="form-group">

    </div>
</div>

<!-- Telegram Account Section -->

    </div>
</div>

<!-- Checkbox: I don't have Telegram -->
<div class="form-group">

        </div>
        <div class="helper-text" data-lang="altSocialHelper">
            e.g., Viber: Your phone number / Instagram: @username / Snapchat: @username / Discord: @username
        </div>
    </div>
</div>

<div class="form-group">
    <label for="city" data-lang="city">City *</label>
    <div class="input-wrapper">
        <i class="fa-solid fa-city"></i>
        <select id="city" required onchange="updateTownships()">
            <option value="" data-lang="selectCity">Select City</option>
            <option value="Yangon / ရန်ကုန်">Yangon / ရန်ကုန်</option>
            <option value="Mandalay / မန္တလေး">Mandalay / မန္တလေး</option>
            <option value="Naypyidaw / နေပြည်တော်">Naypyidaw / နေပြည်တော်</option>
            <option value="Bago / ပဲခူး">Bago / ပဲခူး</option>
            <option value="Pathein / ပုသိမ်">Pathein / ပုသိမ်</option>
            <option value="Mawlamyine / မော်လမြိုင်">Mawlamyine / မော်လမြိုင်</option>
            <option value="Taunggyi / တောင်ကြီး">Taunggyi / တောင်ကြီး</option>
            <option value="Magway / မကွေး">Magway / မကွေး</option>
            <option value="Sagaing / စစ်ကိုင်း">Sagaing / စစ်ကိုင်း</option>
            <option value="Hpa-An / ဘားအံ">Hpa-An / ဘားအံ</option>
        </select>
    </div>
</div>

<div class="form-group">
    <label for="township" data-lang="township">Township *</label>
    <div class="input-wrapper">
        <i class="fa-solid fa-location-dot"></i>
        <select id="township" required onchange="calculateTotals()">
            <option value="" data-lang="selectTownship">Select Township</option>
        </select>
    </div>
</div>

<div class="form-group">
    <label for="road" data-lang="road">Road / Street *</label>
    <div class="input-wrapper">
        <i class="fa-solid fa-road"></i>
        <input id="road" required placeholder="Example: Insein Road" data-lang-placeholder="roadPlaceholder">
    </div>
</div>

<div class="form-group">
    <label for="building" data-lang="building">Building / Apartment (Optional)</label>
    <div class="input-wrapper">
        <i class="fa-solid fa-building"></i>
        <input id="building" placeholder="Apartment, Floor, Room" data-lang-placeholder="buildingPlaceholder">
    </div>
</div>

<div class="form-group">
    <label for="address" data-lang="address">House No. / Landmark *</label>
    <div class="input-wrapper textarea-wrapper">
        <i class="fa-solid fa-house"></i>
        <textarea id="address" rows="3" required placeholder="House No., Landmark" data-lang-placeholder="addressPlaceholder"></textarea>
    </div>
</div>

<div class="form-group">
    <label for="payment" data-lang="paymentMethod">Payment Method *</label>
    <div class="input-wrapper">
        <i class="fa-solid fa-wallet"></i>
        <select id="payment" onchange="togglePaymentInfo()">
            <option value="Cash on Delivery">🚚 Cash on Delivery (COD)</option>
            <option value="KBZPay">💙 KBZPay</option>
            <option value="WavePay">🟡 WavePay</option>
        </select>
    </div>
</div>

<div id="paymentInfo"></div>

<!-- Order Summary Box -->
<div class="summary-box">
    <div class="summary-row">
        <span data-lang="subtotal">Subtotal</span>
        <span id="subtotalDisplay">0 MMK</span>
    </div>
    <div class="summary-row">
        <span data-lang="deliFee">Delivery Fee</span>
        <span id="deliDisplay">0 MMK</span>
    </div>
    <div class="summary-row total">
        <span data-lang="totalAmount">Total Amount</span>
        <span id="totalDisplay">0 MMK</span>
    </div>
</div>

<button type="submit" data-lang="placeOrder">Place Order</button>

</form>

</div>

function toggleTelegramInput() {
    const noTelegram = document.getElementById("noTelegram").checked;
    const telegramGroup = document.getElementById("telegramGroup");
    const telegramInput = document.getElementById("telegram");
    const altSocialGroup = document.getElementById("altSocialGroup");
    const altSocialInput = document.getElementById("altSocial");

    if (noTelegram) {
        telegramGroup.style.display = "none";
        telegramInput.required = false;
        telegramInput.value = "";
        altSocialGroup.style.display = "block";
        altSocialInput.required = true;
    } else {
        telegramGroup.style.display = "block";
        telegramInput.required = true;
        altSocialGroup.style.display = "none";
        altSocialInput.required = false;
        altSocialInput.value = "";
    }
}

function updateTownships(){
    const city = document.getElementById("city").value;
    const townshipSelect = document.getElementById("township");
    const currentLang = localStorage.getItem("language") || "en";
    
    townshipSelect.innerHTML = `<option value="">${currentLang === "mm" ? "မြို့နယ်ကို ရွေးပါ" : "Select Township"}</option>`;

    let selectedTownships = [];
    
    if (city.includes("Yangon")) {
        selectedTownships = townshipData.Yangon;
    } else if (city.includes("Mandalay")) {
        selectedTownships = townshipData.Mandalay;
    } else if (city.includes("Naypyidaw")) {
        selectedTownships = townshipData.Naypyidaw;
    } else if (city.includes("Bago")) {
        selectedTownships = townshipData.Bago;
    } else if (city.includes("Pathein")) {
        selectedTownships = townshipData.Pathein;
    } else if (city.includes("Mawlamyine")) {
        selectedTownships = townshipData.Mawlamyine;
    } else if (city.includes("Taunggyi")) {
        selectedTownships = townshipData.Taunggyi;
    } else if (city.includes("Magway")) {
        selectedTownships = townshipData.Magway;
    } else if (city.includes("Sagaing")) {
        selectedTownships = townshipData.Sagaing;
    } else if (city.includes("Hpa-An")) {
        selectedTownships = townshipData["Hpa-An"];
    }

    if(!selectedTownships) {
        calculateTotals();
        return;
    }

    selectedTownships.forEach((townshipName) => {
        const option = document.createElement("option");
        option.value = townshipName; 
        option.textContent = townshipName; 
        townshipSelect.appendChild(option);
    });
    
    calculateTotals();
}

function calculateTotals(){
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const subtotal = cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
    const township = document.getElementById("township").value;
    const deliFee = deliRates[township] || 0;
    const total = subtotal + deliFee;

    document.getElementById("subtotalDisplay").textContent = subtotal.toLocaleString() + " MMK";
    document.getElementById("deliDisplay").textContent = deliFee.toLocaleString() + " MMK";
    document.getElementById("totalDisplay").textContent = total.toLocaleString() + " MMK";
}

document.getElementById("checkoutForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const subtotal = cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
    const selectedTownship = document.getElementById("township").value;
    const deliFee = deliRates[selectedTownship] || 0;
    const noTelegram = document.getElementById("noTelegram").checked;

    const order = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        telegram: noTelegram ? "No Telegram" : document.getElementById("telegram").value,
        altSocial: noTelegram ? document.getElementById("altSocial").value : "",
        city: document.getElementById("city").value,
        township: selectedTownship,
        road: document.getElementById("road").value,
        building: document.getElementById("building").value,
        address: document.getElementById("address").value,
        payment: document.getElementById("payment").value,
        deliFee: deliFee,
        totalPrice: subtotal + deliFee,
        cart: cart
    };

    try{
        const res = await fetch("/place-order",{
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(order)
        });

        const data = await res.json();

        if(res.status === 401){
            alert("Please sign in first.");
            window.location = "login.html";
            return;
        }

        if(data.success){
            localStorage.removeItem("cart");
            window.location = "order-success.html";
        }else{
            alert(data.message || "Failed to place order.");
        }
    }catch{
        alert("Cannot connect to server.");
    }
});
</script>
