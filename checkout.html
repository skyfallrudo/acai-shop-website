<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:"Poppins",sans-serif;
}

html,body{
width:100%;
min-height:100vh;
overflow-x:hidden;
}

body{
background:#05080f;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
position:relative;
}

body::after{
content:"";
position:fixed;
inset:0;
background-size:cover;
background-position:center;
background-repeat:no-repeat;
z-index:-2;
}

@media(min-width:769px){
body::after{
background-image:url("bg-desktop.jpg");
}
}

@media(max-width:768px){
body::after{
background-image:url("bg-mobile.jpg");
}
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(5,8,15,.70);
z-index:-1;
}

.lang-container{
position:absolute;
top:18px;
right:18px;
z-index:10;
}

.language-select{
padding:8px 12px;
border-radius:10px;
border:1px solid rgba(255,255,255,.15);
background:rgba(15,23,42,.85);
color:white;
cursor:pointer;
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
font-size:13px;
}

.language-select option{
background:#111827;
color:white;
}

.card{
width:100%;
max-width:580px;
background:rgba(15,23,42,.88);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
padding:34px 30px;
box-shadow:0 25px 60px rgba(0,0,0,.45);
position:relative;
z-index:2;
}

.back{
display:inline-flex;
align-items:center;
gap:8px;
text-decoration:none;
color:#93C5FD;
margin-bottom:20px;
font-size:14px;
font-weight:500;
transition:.25s;
}

.back:hover{
color:white;
transform:translateX(-3px);
}

h1{
text-align:center;
font-size:30px;
font-weight:700;
margin-bottom:6px;
}

.subtitle{
text-align:center;
color:#CBD5E1;
margin-bottom:26px;
font-size:14px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-size:13px;
color:#CBD5E1;
font-weight:500;
}

.input-wrapper{
position:relative;
}

.input-wrapper i{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
color:#94A3B8;
font-size:15px;
pointer-events:none;
}

.textarea-wrapper i{
top:20px;
transform:none;
}

input,
select,
textarea{
width:100%;
padding:14px 16px 14px 45px;
border-radius:14px;
border:1px solid rgba(255,255,255,.12);
background:rgba(30,41,59,.60);
color:white;
outline:none;
font-size:14px;
transition:.25s;
}

textarea{
resize:vertical;
padding-top:14px;
}

input::placeholder,
textarea::placeholder{
color:#64748B;
}

input:focus,
select:focus,
textarea:focus{
border-color:#3B82F6;
box-shadow:0 0 0 4px rgba(59,130,246,.15);
background:rgba(30,41,59,.9);
}

select{
appearance:none;
-webkit-appearance:none;
background-image:url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
background-repeat:no-repeat;
background-position:right 14px center;
cursor:pointer;
}

select option{
background:#0F172A;
color:white;
}

.checkbox-label{
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
color:#E2E8F0;
font-size:13px;
}

.checkbox-label input{
width:18px;
height:18px;
accent-color:#2563EB;
cursor:pointer;
}

.alt-social-box{
display:none;
padding:18px;
border-radius:16px;
border:1px dashed rgba(255,255,255,.25);
background:rgba(15,23,42,.5);
margin-bottom:18px;
}

.helper-text{
font-size:12px;
color:#94A3B8;
margin-top:8px;
line-height:1.5;
word-break:break-word;
}

.summary-box{
background:rgba(30,41,59,.6);
border:1px solid rgba(255,255,255,.12);
border-radius:14px;
padding:18px;
margin-bottom:20px;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:8px;
font-size:14px;
color:#CBD5E1;
}

.summary-row.total{
border-top:1px solid rgba(255,255,255,.1);
padding-top:10px;
margin-top:10px;
margin-bottom:0;
font-size:16px;
font-weight:600;
color:#93C5FD;
}

#paymentInfo{
display:none;
padding:16px;
border-radius:14px;
border:1px solid rgba(59,130,246,.3);
background:rgba(30,41,59,.7);
margin-bottom:20px;
font-size:13px;
line-height:1.6;
color:#CBD5E1;
}

#paymentInfo b{
color:#93C5FD;
}

button[type="submit"]{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#3B82F6,#2563EB);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.25s;
box-shadow:0 8px 20px rgba(37,99,235,.25);
}

button[type="submit"]:hover{
transform:translateY(-2px);
box-shadow:0 12px 25px rgba(37,99,235,.35);
}

@media(max-width:600px){

body{
padding:14px;
align-items:flex-start;
}

.card{
margin-top:52px;
padding:24px 18px;

h1{
font-size:24px;

input,
select,

button[type="submit"]{

.summary-row{
font-size:13px;

.summary-row.total{
font-size:15px;
}

.language-select{
font-size:12px;
padding:7px 10px;

}

</style>

<body>

<!-- Language Switcher -->
<div class="lang-container">
    <select class="language-select" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="mm">မြန်မာ</option>
    </select>
</div>

<div class="card">

    <a href="cart.html" class="back">
        <i class="fa-solid fa-arrow-left"></i>
        <span data-lang="backToCart">Back to Cart</span>
    </a>

    <h1 data-lang="checkoutTitle">Checkout</h1>

    <p class="subtitle" data-lang="checkoutSubtitle">
        Enter your delivery information.
    </p>

    <form id="checkoutForm">

        <div class="form-group">
            <label for="name" data-lang="fullName">Full Name *</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user"></i>
                <input id="name" required
                    placeholder="Enter your full name"
                    data-lang-placeholder="fullNamePlaceholder">
            </div>
        </div>

        <div class="form-group">
            <label for="phone" data-lang="phoneNumber">Phone Number *</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-phone"></i>
                <input id="phone"
                    required
                    pattern="^09[0-9]{7,9}$"
                    placeholder="09xxxxxxxxx">
            </div>
        </div>

        <!-- Telegram -->
        <div class="form-group" id="telegramGroup">
            <label for="telegram" data-lang="telegramAcc">
                Telegram Account / Username *
            </label>

            <div class="input-wrapper">
                <i class="fa-brands fa-telegram"></i>
                <input id="telegram"
                    placeholder="@username or Phone Number"
                    data-lang-placeholder="telegramPlaceholder">
            </div>
        </div>

        <!-- No Telegram -->
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox"
                    id="noTelegram"
                    onchange="toggleTelegramInput()">

                <i data-lang="noTelegram">
                    I don't have Telegram
                </i>
            </label>
        </div>

        <!-- Alternative Social -->
        <div class="alt-social-box" id="altSocialGroup">

            <div class="form-group" style="margin-bottom:0;">

                <label for="altSocial"
                    style="color:#93C5FD;"
                    data-lang="altSocialLabel">

                    Where else can we reach you? *

                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-share-nodes"></i>

                    <input id="altSocial"
                        placeholder="Viber, Instagram, Discord..."
                        data-lang-placeholder="altSocialPlaceholder">

                </div>

                <div class="helper-text" data-lang="altSocialHelper">

                    Example:
                    Viber - Phone Number
                    Instagram - @username
                    Discord - @username

                </div>

            </div>

        </div>

        <!-- City -->

        <div class="form-group">

            <label for="city" data-lang="city">City *</label>

            <div class="input-wrapper">

                <i class="fa-solid fa-city"></i>

                <select id="city"
                    required
                    onchange="updateTownships()">

                    <option value="" data-lang="selectCity">
                        Select City
                    </option>

                    <option value="yangon">Yangon / ရန်ကုန်</option>
                    <option value="mandalay">Mandalay / မန္တလေး</option>
                    <option value="naypyidaw">Naypyidaw / နေပြည်တော်</option>
                    <option value="bago">Bago / ပဲခူး</option>
                    <option value="pathein">Pathein / ပုသိမ်</option>
                    <option value="mawlamyine">Mawlamyine / မော်လမြိုင်</option>
                    <option value="taunggyi">Taunggyi / တောင်ကြီး</option>
                    <option value="magway">Magway / မကွေး</option>
                    <option value="sagaing">Sagaing / စစ်ကိုင်း</option>
                    <option value="hpa-an">Hpa-An / ဘားအံ</option>

                </select>

            </div>

        </div>

        <!-- Township -->

        <div class="form-group">

            <label for="township" data-lang="township">
                Township *
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-location-dot"></i>

                <select id="township"
                    required
                    onchange="calculateTotals()">

                    <option value=""
                        data-lang="selectTownship">

                        Select Township

                    </option>

                </select>

            </div>

        </div>

        <!-- Road -->

        <div class="form-group">

            <label for="road" data-lang="road">
                Road / Street *
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-road"></i>

                <input id="road"
                    required
                    placeholder="Example: Insein Road"
                    data-lang-placeholder="roadPlaceholder">

            </div>

        </div>

        <!-- Building -->

        <div class="form-group">

            <label for="building" data-lang="building">
                Building / Apartment (Optional)
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-building"></i>

                <input id="building"
                    placeholder="Apartment, Floor, Room"
                    data-lang-placeholder="buildingPlaceholder">

            </div>

        </div>

        <!-- House -->

        <div class="form-group">

            <label for="address" data-lang="address">
                House No. / Landmark *
            </label>

            <div class="input-wrapper textarea-wrapper">

                <i class="fa-solid fa-house"></i>

                <textarea id="address"
                    rows="3"
                    required
                    placeholder="House No., Landmark"
                    data-lang-placeholder="addressPlaceholder"></textarea>

            </div>

        </div>

        <!-- Payment -->

        <div class="form-group">

            <label for="payment" data-lang="paymentMethod">
                Payment Method *
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-wallet"></i>

                <select id="payment"
                    required
                    onchange="togglePaymentInfo()">

                    <option value="Cash on Delivery">
                        🚚 Cash on Delivery (COD)
                    </option>

                    <option value="KBZPay">
                        💙 KBZPay
                    </option>

                    <option value="WavePay">
                        🟡 WavePay
                    </option>

                </select>

            </div>

        </div>

        <div id="paymentInfo"></div>

        <!-- Order Summary -->

        <div class="summary-box">

            <div class="summary-row">

                <span data-lang="subtotal">Subtotal</span>

                <span id="subtotalDisplay">0 MMK</span>

            </div>

            <div class="summary-row">

                <span data-lang="deliFee">Delivery Fee</span>

                <span id="deliDisplay">0 MMK</span>

            </div>

            <div class="summary-row total">

                <span data-lang="totalAmount">Total Amount</span>

                <span id="totalDisplay">0 MMK</span>

            </div>

        </div>

        <button type="submit" data-lang="placeOrder">
            Place Order
        </button>

    </form>

</div>

function toggleTelegramInput() {
    const noTelegram = document.getElementById("noTelegram").checked;
    const telegramGroup = document.getElementById("telegramGroup");
    const telegramInput = document.getElementById("telegram");
    const altSocialGroup = document.getElementById("altSocialGroup");
    const altSocialInput = document.getElementById("altSocial");

    if (noTelegram) {
        telegramGroup.style.display = "none";
        telegramInput.required = false;
        telegramInput.value = "";
        altSocialGroup.style.display = "block";
        altSocialInput.required = true;
    } else {
        telegramGroup.style.display = "block";
        telegramInput.required = true;
        altSocialGroup.style.display = "none";
        altSocialInput.required = false;
        altSocialInput.value = "";
    }
}

function updateTownships() {
    const city = document.getElementById("city").value.toLowerCase();
    const townshipSelect = document.getElementById("township");
    const currentLang = localStorage.getItem("language") || "en";

    townshipSelect.innerHTML =
        `<option value="">${currentLang==="mm"?"မြို့နယ်ကို ရွေးပါ":"Select Township"}</option>`;

    (townshipData[city] || []).forEach(name=>{
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        townshipSelect.appendChild(option);
    });

    calculateTotals();
}

function calculateTotals() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const subtotal = cart.reduce((s,i)=>s+Number(i.price)*Number(i.qty),0);
    const township = document.getElementById("township").value;
    const deliFee = deliRates[township] || 0;
    const total = subtotal + deliFee;

    document.getElementById("subtotalDisplay").textContent =
        subtotal.toLocaleString()+" MMK";

    document.getElementById("deliDisplay").textContent =
        deliFee.toLocaleString()+" MMK";

    document.getElementById("totalDisplay").textContent =
        total.toLocaleString()+" MMK";
}

function togglePaymentInfo() {
    const payment = document.getElementById("payment").value;
    const info = document.getElementById("paymentInfo");
    const lang = localStorage.getItem("language") || "en";

    if(payment==="KBZPay"){
        info.style.display="block";
        info.innerHTML=lang==="mm"
        ?"<b>KBZPay အချက်အလက်</b><br>ငွေလွှဲရန်: 09xxxxxxxxx (Acai Shop)<br>Screenshot သိမ်းထားပါ။"
        :"<b>KBZPay Info</b><br>Pay to: 09xxxxxxxxx (Acai Shop)<br>Please save your screenshot.";

    }else if(payment==="WavePay"){

        info.style.display="block";

        info.innerHTML=lang==="mm"
        ?"<b>WavePay အချက်အလက်</b><br>ငွေလွှဲရန်: 09xxxxxxxxx (Acai Shop)<br>Screenshot သိမ်းထားပါ။"
        :"<b>WavePay Info</b><br>Pay to: 09xxxxxxxxx (Acai Shop)<br>Please save your screenshot.";

    }else{

        info.style.display="none";

    }
}

document.addEventListener("DOMContentLoaded",()=>{

    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    if(cart.length===0){
        window.location="cart.html";
        return;
    }

    const picker=document.querySelector(".language-select");

    if(picker){
        picker.value=localStorage.getItem("language")||"en";
    }

    toggleTelegramInput();
    calculateTotals();
    togglePaymentInfo();

});

document.getElementById("checkoutForm").addEventListener("submit",async function(e){

    e.preventDefault();

    const cart=JSON.parse(localStorage.getItem("cart"))||[];

    const subtotal=cart.reduce((s,i)=>s+Number(i.price)*Number(i.qty),0);

    const township=document.getElementById("township").value;

    const deliFee=deliRates[township]||0;

    const noTelegram=document.getElementById("noTelegram").checked;

    const order={

        name:document.getElementById("name").value.trim(),

        phone:document.getElementById("phone").value.trim(),

        telegram:noTelegram
            ?"No Telegram"
            :document.getElementById("telegram").value.trim(),

        altSocial:noTelegram
            ?document.getElementById("altSocial").value.trim()
            :"",

        city:document.getElementById("city").value,

        township,

        road:document.getElementById("road").value.trim(),

        building:document.getElementById("building").value.trim(),

        address:document.getElementById("address").value.trim(),

        payment:document.getElementById("payment").value,

        deliFee,

        totalPrice:subtotal+deliFee,

        cart

    };

    try{

        const res=await fetch("/place-order",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            credentials:"include",

            body:JSON.stringify(order)

        });

        const data=await res.json();

        if(res.status===401){

            alert("Please sign in first.");

            window.location="register.html";

            return;

        }

        if(data.success){

            localStorage.removeItem("cart");

            window.location="order-success.html";

        }else{

            alert(data.message||"Failed to place order.");

        }

    }catch{

        alert("Cannot connect to server.");

    }

});

</script>
