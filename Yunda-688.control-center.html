<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acai Admin Dashboard</title>

<link rel="icon" href="./logo.ico?v=2" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#05080f;
    color:white;
    min-height:100vh;
}
#loginOverlay {
    position: fixed;
    inset: 0;
    background: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    padding: 20px;
}

.loginBox {
    width: 100%;
    max-width: 380px;
    background: #ffffff;
    color: #1e293b;
    border: 1px solid #e2e8f0;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 15px 45px rgba(0, 0, 0, .12);
}

.loginBox h1 {
    color: #2563eb;
    text-align:center;
    margin-bottom:6px;
}

.loginBox p {
    color: #475569;
    text-align:center;
    font-size:13px;
    margin-bottom:25px;
}

.loginBox input {
    width:100%;
    padding:14px;
    margin-bottom:14px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    background:#f8fafc;
    color:#1e293b;
    outline:none;
    font-size:14px;
}

.loginBox button {
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563EB;
    color:white;
    font-weight:600;
    cursor:pointer;
}

.loginLogo{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:50%;
    display:block;
    margin:0 auto 15px;
    background:white;
    padding:4px;
}

.loginError{
    color:#F87171;
    font-size:13px;
    text-align:center;
    min-height:20px;
    margin-top:10px;
}

.sidebar{
    width:230px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    background:rgba(15,23,42,.96);
    border-right:1px solid rgba(255,255,255,.06);
    padding:25px 15px;
    z-index:1000;
}

.sidebar-logo{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 10px 25px;
}

.sidebar-logo img{
    width:42px;
    height:42px;
    border-radius:50%;
    background:white;
    padding:3px;
}

.sidebar-logo h2{
    color:#60A5FA;
    font-size:21px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    margin-bottom:7px;
    border-radius:12px;
    color:#CBD5E1;
    text-decoration:none;
    transition:.2s;
    font-size:14px;
}

.sidebar a:hover,
.sidebar a.active{
    background:#1E293B;
    color:white;
}

.sidebar a i{
    width:20px;
    text-align:center;
    color:#60A5FA;
}

.logout-link{
    margin-top:20px !important;
    color:#F87171 !important;
}

.main{
    margin-left:230px;
    padding:28px;
    min-height:100vh;
}

.page-title{
    margin-bottom:25px;
}

.page-title h1{
    font-size:28px;
}

.page-title p{
    color:#94A3B8;
    font-size:13px;
    margin-top:4px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.card{
    background:rgba(15,23,42,.9);
    border:1px solid rgba(255,255,255,.06);
    border-radius:20px;
    padding:20px;
}

.stat-card{
    position:relative;
    overflow:hidden;
}

.stat-icon{
    position:absolute;
    right:18px;
    top:18px;
    width:40px;
    height:40px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(37,99,235,.15);
    color:#60A5FA;
}

.stat-card h3{
    color:#94A3B8;
    font-size:13px;
    font-weight:500;
    margin-bottom:8px;
}

.stat-card h2{
    font-size:24px;
}

.section{
    margin-top:30px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.section-header h2{
    font-size:20px;
}

#productForm{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

#productForm input, #productForm textarea {
    width:100%;
    padding:12px 13px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:11px;
    background:#1E293B;
    color:white;
    outline:none;
}

#productForm textarea {
    grid-column: span 3;
    resize: vertical;
    height: 80px;
}

#productForm input:focus, #productForm textarea:focus{
    border-color:#2563EB;
}

#productForm input[type="file"]{
    padding:9px;
}

#productForm button{
    grid-column: span 3;
    padding:12px;
    border:none;
    border-radius:11px;
    background:#16A34A;
    color:white;
    font-weight:600;
    cursor:pointer;
}

.search{
    width:100%;
    padding:12px 14px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:11px;
    background:#1E293B;
    color:white;
    outline:none;
    margin-bottom:15px;
}

.table-wrap{
    width:100%;
    overflow-x:auto;
    border-radius:16px;
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
}

th, td{
    padding:13px;
    border-bottom:1px solid rgba(255,255,257,.07);
    text-align:left;
    font-size:13px;
}

th{
    background:#1E293B;
    color:#CBD5E1;
    font-weight:600;
}

td{
    background:#111827;
}

.btn{
    border:none;
    padding:8px 11px;
    border-radius:9px;
    color:white;
    cursor:pointer;
    font-size:12px;
    margin:2px;
}

.edit{ background:#2563EB; }
.delete{ background:#DC2626; }
.refresh{ background:#475569; }

#toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#16A34A;
    color:white;
    padding:13px 18px;
    border-radius:12px;
    display:none;
    z-index:100000;
}
#toast.error{ background:#DC2626; }

@media(max-width:900px){
    .sidebar{ width:100%; height:auto; position:sticky; display:flex; overflow-x:auto; }
    .main{ margin-left:0; }
    #productForm{ grid-template-columns:1fr; }
    #productForm textarea, #productForm button { grid-column: span 1; }
}
</style>
</head>

<body>

<div id="loginOverlay">
    <div class="loginBox">
        <img src="logo.jpg" class="loginLogo" alt="Acai Shop">
        <h1>Admin Login</h1>
        <input id="adminUsername" type="text" placeholder="Username" autocomplete="username">
        <input id="adminPassword" type="password" placeholder="Password" autocomplete="current-password">
        <button id="loginButton" onclick="adminLogin()">Login</button>
        <div id="loginError" class="loginError"></div>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-logo">
        <img src="logo.jpg" alt="Acai Shop">
        <h2>Acai Admin</h2>
    </div>
    <a href="#products" class="active"><i class="fa-solid fa-box"></i><span>Products</span></a>
    <a href="#" class="logout-link" onclick="adminLogout();return false;"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
</div>

<div class="main">
    <div class="page-title">
        <h1>Acai Shop Admin Dashboard</h1>
        <p>Manage products with variant colors and multiple image uploads.</p>
    </div>

    <section class="section" id="products">
        <div class="section-header">
            <h2>Products Management</h2>
            <button class="btn refresh" onclick="loadProducts()"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>

        <div class="card">
            <!-- Product Form with Color Options and Multiple Images Support -->
            <form id="productForm" enctype="multipart/form-data">
                <input name="name" id="productName" placeholder="Product Name" required>
                <input name="price" id="productPrice" type="number" min="0" placeholder="Price (MMK)" required>
                <input name="stock" id="productStock" type="number" min="0" placeholder="Stock Quantity" required>
                
                <!-- Color / Variant Options Field (Comma separated: ဥပမာ - Black, Blue, White) -->
                <input name="colors" id="productColors" placeholder="Colors / Variants (comma separated, e.g. Black, Blue)">

                <!-- Multiple Images Upload Field -->
                <input name="images" id="productImages" type="file" multiple accept="image/png,image/jpeg,image/webp" placeholder="Upload Multiple Images">

                <textarea name="description" id="productDescription" placeholder="Product Description..."></textarea>

                <button type="submit" id="productSubmitButton">
                    <i class="fa-solid fa-plus"></i> Add Product
                </button>
            </form>

            <input class="search" id="productSearch" placeholder="Search products...">

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Colors</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="productTable">
                        <tr><td colspan="6" style="text-align:center;">Loading products...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</div>

<div id="toast"></div>

<script>
function showToast(message, error=false){
    const toast = document.getElementById("toast");
    toast.innerText = message;
    toast.classList.toggle("error", error);
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 2500);
}

async function getJSON(url, options={}){
    const res = await fetch(url, { credentials: "include", ...options });
    const data = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(data.message || data.error || "Request failed");
    return data;
}

async function checkAdmin(){
    try {
        const data = await getJSON("/admin-check");
        if(data.loggedIn){
            document.getElementById("loginOverlay").style.display = "none";
            loadProducts();
        } else {
            document.getElementById("loginOverlay").style.display = "flex";
        }
    } catch {
        document.getElementById("loginOverlay").style.display = "flex";
    }
}

async function adminLogin(){
    const username = document.getElementById("adminUsername").value.trim();
    const password = document.getElementById("adminPassword").value;
    const errorBox = document.getElementById("loginError");

    try {
        const data = await getJSON("/admin-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });
        if(data.success){
            document.getElementById("loginOverlay").style.display = "none";
            loadProducts();
        } else {
            errorBox.innerText = data.message || "Wrong credentials.";
        }
    } catch(err) {
        errorBox.innerText = err.message || "Login failed.";
    }
}

async function adminLogout(){
    await getJSON("/admin-logout", { method: "POST" }).catch(()=>{});
    location.reload();
}

async function loadProducts(){
    try {
        const products = await getJSON("/products");
        const table = document.getElementById("productTable");
        table.innerHTML = "";

        if(!products.length){
            table.innerHTML = `<tr><td colspan="6" style="text-align:center;">No products found.</td></tr>`;
            return;
        }

        products.forEach(p => {
            table.innerHTML += `
                <tr>
                    <td>#${p.id}</td>
                    <td>${p.name}</td>
                    <td>${Number(p.price).toLocaleString()} MMK</td>
                    <td>${p.stock}</td>
                    <td>${p.colors || "Default"}</td>
                    <td>
                        <button class="btn delete" onclick="deleteProduct(${p.id})">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </td>
                </tr>`;
        });
    } catch(err) {
        showToast("Failed to load products", true);
    }
}

document.getElementById("productForm").addEventListener("submit", async function(e){
    e.preventDefault();
    const form = this;
    const btn = document.getElementById("productSubmitButton");
    
    const formData = new FormData(form);

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

    try {
        const data = await getJSON("/add-product", {
            method: "POST",
            body: formData
        });

        if(data.success){
            showToast("Product added successfully with colors & images!");
            form.reset();
            loadProducts();
        } else {
            showToast(data.message || "Failed to add product", true);
        }
    } catch(err) {
        showToast(err.message || "Failed to add product", true);
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-plus"></i> Add Product';
    }
});

async function deleteProduct(id){
    if(!confirm("Are you sure you want to delete this product?")) return;
    try {
        await getJSON("/delete-product/" + id, { method: "DELETE" });
        showToast("Product deleted successfully.");
        loadProducts();
    } catch(err) {
        showToast("Delete failed", true);
    }
}

checkAdmin();
</script>
</body>
</html>
