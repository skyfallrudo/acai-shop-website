<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acai Shop - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div class="p-6">
            <h1 class="text-xl font-bold text-blue-500 mb-6"><i class="fa-solid fa-shield-halved mr-2"></i> Acai Admin</h1>
            <nav class="space-y-2">
                <a href="#" onclick="switchTab('dashboard')" class="tab-btn block px-4 py-2.5 rounded-xl bg-blue-600 text-white font-medium"><i class="fa-solid fa-chart-pie mr-2"></i> Dashboard</a>
                <a href="#" onclick="switchTab('products')" class="tab-btn block px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-box mr-2"></i> Products</a>
                <a href="#" onclick="switchTab('orders')" class="tab-btn block px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-shopping-cart mr-2"></i> Orders</a>
                <a href="#" onclick="switchTab('customers')" class="tab-btn block px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-users mr-2"></i> Customers</a>
                <a href="#" onclick="switchTab('pinduoduo')" class="tab-btn block px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white"><i class="fa-solid fa-truck-fast mr-2"></i> Pinduoduo</a>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <button onclick="adminLogout()" class="w-full py-2.5 px-4 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded-xl font-medium transition"><i class="fa-solid fa-right-from-bracket mr-2"></i> Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        <header class="h-16 bg-slate-900/50 backdrop-blur border-b border-slate-800 px-8 flex items-center justify-between">
            <h2 id="pageTitle" class="text-lg font-semibold text-white">Dashboard Overview</h2>
            <button onclick="loadAllData()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium transition"><i class="fa-solid fa-rotate mr-2"></i> Refresh</button>
        </header>

        <div class="p-8 max-w-7xl w-full mx-auto space-y-8">
            <!-- TAB: DASHBOARD -->
            <section id="tab-dashboard" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><p class="text-sm text-slate-400">Total Orders</p><h3 id="statTotalOrders" class="text-3xl font-bold mt-2 text-white">0</h3></div>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><p class="text-sm text-slate-400">Total Customers</p><h3 id="statTotalCustomers" class="text-3xl font-bold mt-2 text-white">0</h3></div>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><p class="text-sm text-slate-400">Total Products</p><h3 id="statTotalProducts" class="text-3xl font-bold mt-2 text-white">0</h3></div>
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl"><p class="text-sm text-slate-400">Product Revenue</p><h3 id="statRevenue" class="text-3xl font-bold mt-2 text-emerald-400">0 MMK</h3></div>
            </section>

            <!-- TAB: PRODUCTS -->
            <section id="tab-products" class="space-y-6 hidden">
                <form id="productForm" onsubmit="handleProductSubmit(event)" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="prodName" placeholder="Product Name" required class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white">
                    <input type="number" id="prodPrice" placeholder="Price (MMK)" required class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white">
                    <input type="number" id="prodStock" placeholder="Stock" required class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white">
                    <input type="text" id="prodColors" placeholder="Colors (e.g. Red, Blue)" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white">
                    <input type="file" id="prodImages" multiple accept="image/*" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-400 file:bg-blue-600 file:text-white file:rounded-lg file:border-0 file:px-3 file:py-1">
                    <button type="submit" class="md:col-span-3 py-3 bg-blue-600 hover:bg-blue-500 font-semibold rounded-xl text-white transition">Add Product</button>
                </form>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                    <table class="w-full text-left"><tbody id="productTableBody" class="divide-y divide-slate-800 text-sm"></tbody></table>
                </div>
            </section>

            <!-- TAB: ORDERS -->
            <section id="tab-orders" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hidden">
                <table class="w-full text-left"><tbody id="orderTableBody" class="divide-y divide-slate-800 text-sm"></tbody></table>
            </section>

            <!-- TAB: CUSTOMERS -->
            <section id="tab-customers" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hidden">
                <table class="w-full text-left"><tbody id="customerTableBody" class="divide-y divide-slate-800 text-sm"></tbody></table>
            </section>

            <!-- TAB: PINDUODUO -->
            <section id="tab-pinduoduo" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hidden">
                <table class="w-full text-left"><tbody id="pinduoduoTableBody" class="divide-y divide-slate-800 text-sm"></tbody></table>
            </section>
        </div>
    </main>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('section[id^="tab-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('bg-blue-600', 'text-white'));
            event.currentTarget.classList.add('bg-blue-600', 'text-white');
            document.getElementById('pageTitle').innerText = tabName.charAt(0).toUpperCase() + tabName.slice(1);
        }

        async function fetchAPI(url) {
            const res = await fetch(url);
            return res.json();
        }

        async function loadDashboard() {
            const data = await fetchAPI('/admin/dashboard');
            document.getElementById('statTotalOrders').innerText = data.totalOrders || 0;
            document.getElementById('statTotalCustomers').innerText = data.totalCustomers || 0;
            document.getElementById('statTotalProducts').innerText = data.totalProducts || 0;
            document.getElementById('statRevenue').innerText = (data.productRevenue || 0).toLocaleString() + ' MMK';
        }

        async function loadProducts() {
            const products = await fetchAPI('/admin/products');
            document.getElementById('productTableBody').innerHTML = products.map(p => `
                <tr class="hover:bg-slate-800/50"><td class="p-4">#${p.id}</td><td class="p-4 font-medium text-white">${p.name}</td><td class="p-4">${Number(p.price).toLocaleString()} MMK</td><td class="p-4">Stock: ${p.stock}</td><td class="p-4 text-right"><button onclick="deleteItem('/delete-product/${p.id}', loadProducts)" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button></td></tr>
            `).join('');
        }

        async function loadOrders() {
            const orders = await fetchAPI('/admin/orders');
            document.getElementById('orderTableBody').innerHTML = orders.map(o => `
                <tr class="hover:bg-slate-800/50"><td class="p-4 font-medium text-blue-400">${o.order_code}</td><td class="p-4">${o.customer}</td><td class="p-4">${Number(o.total).toLocaleString()} MMK</td><td class="p-4"><span class="px-2.5 py-1 rounded-lg text-xs bg-amber-500/10 text-amber-400">${o.status}</span></td><td class="p-4 text-right"><button onclick="deleteItem('/admin/orders/${o.id}', loadOrders)" class="text-red-400"><i class="fa-solid fa-trash"></i></button></td></tr>
            `).join('');
        }

        async function loadCustomers() {
            const customers = await fetchAPI('/admin/customers');
            document.getElementById('customerTableBody').innerHTML = customers.map(c => `
                <tr class="hover:bg-slate-800/50"><td class="p-4 font-mono text-blue-400">${c.customer_code || 'AC-' + c.id}</td><td class="p-4 font-medium text-white">${c.username}</td><td class="p-4 text-slate-300">${c.email}</td><td class="p-4">${c.phone || '-'}</td><td class="p-4 text-slate-400">${c.address || '-'}</td></tr>
            `).join('');
        }

        async function loadPinduoduo() {
            const items = await fetchAPI('/admin/pinduoduo');
            document.getElementById('pinduoduoTableBody').innerHTML = items.map(i => `
                <tr class="hover:bg-slate-800/50"><td class="p-4 font-medium text-white">${i.item_name}</td><td class="p-4 font-mono">${i.tracking_code || '-'}</td><td class="p-4">${Number(i.total_mmk).toLocaleString()} MMK</td><td class="p-4">${i.status}</td></tr>
            `).join('');
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('prodName').value);
            formData.append('price', document.getElementById('prodPrice').value);
            formData.append('stock', document.getElementById('prodStock').value);
            formData.append('colors', document.getElementById('prodColors').value);
            for(let file of document.getElementById('prodImages').files) formData.append('images', file);
            
            const res = await fetch('/admin/products', { method: 'POST', body: formData });
            const data = await res.json();
            if(data.success) { document.getElementById('productForm').reset(); loadProducts(); alert('Product added!'); }
        }

        async function deleteItem(url, reloadCallback) {
            if(!confirm('Are you sure?')) return;
            await fetch(url, { method: 'DELETE' });
            reloadCallback();
        }

        async function adminLogout() {
            await fetch('/admin-logout', { method: 'POST' });
            window.location.href = '/';
        }

        function loadAllData() { loadDashboard(); loadProducts(); loadOrders(); loadCustomers(); loadPinduoduo(); }
        window.addEventListener('DOMContentLoaded', loadAllData);
    </script>
</body>
</html>
