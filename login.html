<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
<title>Sign In | Acai Shop</title>
<script src="language.js"></script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F00XQ96WFJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  gtag('config', 'G-F00XQ96WFJ');
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-color: #05080f;
    min-height: 100vh;
    padding: 20px;
}

body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}

@media (min-width: 769px) {
    body::after {
        background-image: url("bg-desktop.jpg");
    }
}

@media (max-width: 768px) {
    body::after {
        background-image: url("bg-mobile.jpg");
    }
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 8, 15, 0.45);
    z-index: -1;
}

.lang-container {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
}

.language-select {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(15, 23, 42, 0.85);
    color: white;
    outline: none;
    cursor: pointer;
    font-family: Poppins, sans-serif;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 13px;
}

.language-select option {
    background: #111827;
    color: white;
}

.card {
    width: 100%;
    max-width: 420px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 35px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    animation: fade .5s ease;
    position: relative;
    z-index: 2;
}

@keyframes fade {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    padding: 6px;
    background: white;
    margin: 0 auto 18px auto;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    object-fit: cover;
    display: block;
}

h1 {
    color: white;
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #94A3B8;
    margin-bottom: 28px;
    font-size: 15px;
}

.input-box {
    position: relative;
    margin-bottom: 18px;
}

.input-box i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #64748B;
}

.input-box input {
    width: 100%;
    padding: 15px 15px 15px 45px;
    border: 1px solid transparent;
    border-radius: 14px;
    background: #1E293B;
    color: white;
    outline: none;
    font-size: 15px;
    transition: .3s;
}

.input-box input:focus {
    border-color: #2563EB;
    box-shadow: 0 0 18px rgba(37, 99, 235, .35);
}

.input-box input::placeholder {
    color: #64748B;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(37, 99, 235, .35);
}

.link {
    margin-top: 22px;
    font-size: 14px;
    color: #94A3B8;
}

.link a {
    color: #60A5FA;
    text-decoration: none;
    font-weight: 600;
}

.loading {
    display: none;
    margin-top: 15px;
    color: #CBD5E1;
    font-size: 14px;
}
/* ===== Mobile Responsive Fix ===== */
@media (max-width:768px){

  body{
    padding:16px !important;
    align-items:flex-start !important;
  }

  .lang-container{
    top:12px !important;
    right:12px !important;
  }

  .language-select{
    font-size:12px !important;
    padding:7px 10px !important;
  }

  .card{
    width:100% !important;
    max-width:420px !important;
    margin:60px auto 20px !important;
    padding:24px 18px !important;
    border-radius:22px !important;
  }

  .logo{
    width:68px !important;
    height:68px !important;
    padding:5px !important;
    margin-bottom:14px !important;
  }

  h1{
    font-size:24px !important;
    line-height:1.2 !important;
    margin-bottom:6px !important;
  }

  .subtitle{
    font-size:13px !important;
    line-height:1.5 !important;
    margin-bottom:22px !important;
  }

  .input-box{
    margin-bottom:16px !important;
  }

  .input-box i{
    left:14px !important;
    font-size:15px !important;
  }

  .input-box input{
    height:50px !important;
    padding:0 14px 0 42px !important;
    font-size:16px !important;
    border-radius:12px !important;
  }

  button{
    height:50px !important;
    padding:0 !important;
    font-size:15px !important;
    border-radius:12px !important;
  }

  .link{
    margin-top:18px !important;
    font-size:13px !important;
    line-height:1.5 !important;
  }

  .loading{
    font-size:13px !important;
  }
}

@media (max-width:360px){

  .card{
    padding:20px 15px !important;
  }

  .logo{
    width:60px !important;
    height:60px !important;
  }

  h1{
    font-size:21px !important;
  }

  .subtitle{
    font-size:12px !important;
  }

  .input-box input{
    font-size:15px !important;
  }
}
</style>
</head>

<body>

<div class="lang-container">
    <select class="language-select" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="mm">မြန်မာ</option>
    </select>
</div>

<div class="card">
    <img class="logo" src="logo.jpg" alt="Logo">

    <h1 data-lang="welcomeBack">Welcome Back</h1>
    <p class="subtitle" data-lang="signInSubtitle">Sign in to continue shopping.</p>

    <form id="loginForm">
        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input id="email" type="email" placeholder="Email" data-lang-placeholder="emailPlaceholder" required>
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input id="password" type="password" placeholder="Password" data-lang-placeholder="passwordPlaceholder" required>
        </div>

        <div style="text-align:right; margin:-8px 0 18px;">
            <a href="forgot-password.html" style="color:#60A5FA; text-decoration:none; font-size:14px; font-weight:500;" data-lang="forgotPassword">Forgot Password?</a>
        </div>

        <button type="submit" id="loginBtn">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            <span data-lang="signInBtnText">Sign In</span>
        </button>

        <div class="loading" id="loading" data-lang="signingInText">Signing in...</div>
    </form>

    <div class="link">
        <span data-lang="noAccountText">Don't have an account?</span>
        <a href="register.html" data-lang="registerLink">Register</a>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const btn = document.getElementById("loginBtn");
    const loading = document.getElementById("loading");

    btn.disabled = true;
    loading.style.display = "block";

    try {
        const res = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });

        const data = await res.json();

        loading.style.display = "none";
        btn.disabled = false;

        if(data.success){
            window.location = "index.html";
        } else {
            alert(data.message || "Wrong email or password");
        }
    } catch (err) {
        loading.style.display = "none";
        btn.disabled = false;
        alert("Cannot connect to server.");
    }
});
</script>

</body>
</html>
