<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Açaí Shop</title>
    
    <link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    
    <script src="language.js"></script>

    <style>
        :root {
            --bg-dark: #020409;
            --acai-blue: #8da9d4;
            --neon-blue: #3b82f6;
            --neon-cyan: #60a5fa;
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(141, 169, 212, 0.25);
            --text-main: #ffffff;
        }

        [data-theme="light"] {
            --bg-dark: #070b16; /* Intro အလင်းတန်း လှပစွာပေါ်စေရန် Dark Luxury Tone ထိန်းထားပါသည် */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            position: relative;
        }

        /* ===================================================
           1. SLEEK STAGE LIGHTING (NO SPINNING CIRCLES)
        =================================================== */
        /* အပေါ်တည့်တည့်မှ ထိုးချသော Spotlight အလင်းတန်း */
        .spotlight-cone {
            position: fixed;
            top: -15%;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(320px, 75vw, 850px);
            height: 85dvh;
            background: radial-gradient(ellipse at top, rgba(141, 169, 212, 0.28) 0%, rgba(59, 130, 246, 0.08) 45%, transparent 75%);
            clip-path: polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);
            filter: blur(30px);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: stageLightOn 1.2s ease-out 1.15s forwards;
        }

        /* Logo အောက်ခြေရှိ ကြမ်းပြင်အလင်းလိုင်း (Horizon Pedestal) */
        .stage-horizon {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: clamp(220px, 55vw, 460px);
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(141, 169, 212, 0.9), #ffffff, rgba(141, 169, 212, 0.9), transparent);
            box-shadow: 0 0 25px 4px rgba(96, 165, 250, 0.75);
            border-radius: 50%;
            z-index: 3;
            animation: horizonExpand 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
        }

        .stage-floor-glow {
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(240px, 60vw, 500px);
            height: 70px;
            background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.32) 0%, transparent 72%);
            filter: blur(16px);
            pointer-events: none;
            opacity: 0;
            animation: stageLightOn 1s ease-out 1.15s forwards;
        }

        @keyframes stageLightOn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes horizonExpand {
            0% { transform: translateX(-50%) scaleX(0); opacity: 0; }
            60% { transform: translateX(-50%) scaleX(1.15); opacity: 1; }
            100% { transform: translateX(-50%) scaleX(1); opacity: 0.85; }
        }

        /* Floating Dust Canvas */
        #dustCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            animation: stageLightOn 1.5s ease 1.3s forwards;
        }

        /* ===================================================
           2. SHOOTING LIGHT BEAM & IMPACT FLASH (INTRO)
        =================================================== */
        /* အလင်းတန်း ပြေးလာသည့် Effect */
        .shooting-beam {
            position: absolute;
            top: 50%;
            left: -60%;
            width: clamp(180px, 38vw, 380px);
            height: 5px;
            background: linear-gradient(90deg, transparent 0%, #2563eb 35%, #8da9d4 75%, #ffffff 100%);
            border-radius: 999px;
            box-shadow: 
                0 0 20px #60a5fa,
                0 0 45px #3b82f6,
                15px 0 30px #ffffff;
            transform: translateY(-50%);
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            animation: beamStrike 1.1s cubic-bezier(0.4, 0, 0.2, 1) 0.15s forwards;
        }

        /* အလင်းတန်း ထိပ်ဖူးရှိ ကြယ်ပွင့်အလင်း */
        .shooting-beam::after {
            content: "";
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 25px 8px #ffffff, 0 0 50px 15px #60a5fa;
        }

        @keyframes beamStrike {
            0% {
                left: -50%;
                opacity: 0;
                transform: translateY(-50%) scaleX(0.4);
            }
            15% {
                opacity: 1;
            }
            85% {
                left: 50%;
                opacity: 1;
                transform: translate(-50%, -50%) scaleX(1.1);
            }
            100% {
                left: 55%;
                opacity: 0;
                transform: translate(-50%, -50%) scaleX(0.1);
            }
        }

        /* Logo ကို အလင်းတန်း လာမှန်ချိန် ပွင့်ထွက်သွားသော Impact Flash */
        .impact-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: clamp(260px, 60vw, 520px);
            height: clamp(160px, 35vw, 280px);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(141, 169, 212, 0.75) 30%, rgba(59, 130, 246, 0.3) 60%, transparent 75%);
            border-radius: 50%;
            filter: blur(12px);
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            animation: burstFlash 0.85s ease-out 1.02s forwards;
        }

        @keyframes burstFlash {
            0% {
                transform: translate(-50%, -50%) scale(0.1);
                opacity: 0;
            }
            30% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.8);
                opacity: 0;
            }
        }

        /* ===================================================
           3. ACAI LOGO (DIM -> IGNITED + MIRROR REFLECTION)
        =================================================== */
        .stage-main {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px 30px;
        }

        .logo-showcase {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 30px;
            margin-bottom: clamp(42px, 7vh, 68px);
        }

        /* Ambient Backlight behind Logo (Static soft aura, NOT a spinning ring) */
        .logo-aura {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(141, 169, 212, 0.42) 0%, rgba(37, 99, 235, 0.14) 55%, transparent 75%);
            filter: blur(32px);
            opacity: 0;
            z-index: 1;
            animation: auraIgnite 3.5s ease-in-out 1.1s infinite alternate;
        }

        @keyframes auraIgnite {
            0% { opacity: 0.55; transform: scale(0.95); }
            100% { opacity: 0.95; transform: scale(1.08); }
        }

        /* Main PNG Logo: Starts Dim, Ignites when Beam hits! */
        .acai-logo-img {
            width: clamp(230px, 56vw, 430px);
            height: auto;
            object-fit: contain;
            position: relative;
            z-index: 5;
            cursor: pointer;
            /* အစတွင် မှိန်နေမည် */
            opacity: 0.14;
            filter: brightness(0.18) contrast(1.2) grayscale(0.8);
            transform: scale(0.94);
            /* အောက်ခြေတွင် မှန်အရိပ် (Mirror Reflection) ပေါ်နေစေရန် */
            -webkit-box-reflect: below 6px linear-gradient(transparent 62%, rgba(255, 255, 255, 0.18));
            animation: 
                logoIgnite 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1.02s forwards,
                gentleFloat 4.5s ease-in-out 2.15s infinite;
        }

        @keyframes logoIgnite {
            0% {
                opacity: 0.14;
                filter: brightness(0.18) contrast(1.2) grayscale(0.8);
                transform: scale(0.94);
            }
            28% {
                opacity: 1;
                filter: brightness(2.4) drop-shadow(0 0 45px #ffffff) drop-shadow(0 0 80px #60a5fa);
                transform: scale(1.06);
            }
            100% {
                opacity: 1;
                filter: brightness(1.05) drop-shadow(0 12px 35px rgba(59, 130, 246, 0.65)) drop-shadow(0 0 18px rgba(141, 169, 212, 0.85));
                transform: scale(1);
            }
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* ===================================================
           4. BUTTONS REVEAL (SHOP NOW & TRACK ORDER)
        =================================================== */
        .cta-container {
            display: flex;
            gap: 18px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 520px;
            z-index: 15;
            /* အလင်းတန်းဝင်ပြီးမှ ပေါ်လာမည် */
            opacity: 0;
            transform: translateY(30px);
            animation: revealButtons 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.45s forwards;
        }

        @keyframes revealButtons {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pro-btn {
            position: relative;
            overflow: hidden;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 28px;
            border-radius: 18px;
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* SHOP NOW Button */
        .btn-shop-now {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 55%, #3b82f6 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.38);
            box-shadow: 
                0 14px 35px rgba(37, 99, 235, 0.6),
                0 0 20px rgba(141, 169, 212, 0.45) inset;
        }

        /* Continuous Light Shimmer inside Shop Now button */
        .btn-shop-now::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            transform: skewX(-25deg);
            animation: btnShimmer 3s infinite 2.2s;
        }

        @keyframes btnShimmer {
            0% { left: -120%; }
            45%, 100% { left: 160%; }
        }

        .btn-shop-now:hover {
            transform: translateY(-5px) scale(1.04);
            box-shadow: 0 20px 45px rgba(59, 130, 246, 0.85), 0 0 30px rgba(255, 255, 255, 0.6) inset;
        }

        /* TRACK ORDER Button */
        .btn-track-order {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #f8fafc;
            border: 1px solid rgba(141, 169, 212, 0.42);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-track-order:hover {
            transform: translateY(-5px) scale(1.04);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 18px 40px rgba(59, 130, 246, 0.35), 0 0 20px rgba(96, 165, 250, 0.25) inset;
        }

        /* ===================================================
           5. TOP GLASS NAVBAR (APPEARS AFTER INTRO)
        =================================================== */
        nav {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translate(-50%, -30px);
            width: 92%;
            max-width: 1160px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-radius: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            opacity: 0;
            animation: navFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
        }

        @keyframes navFadeIn {
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        .nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-brand img {
            height: 34px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(141, 169, 212, 0.8));
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            transition: 0.25s;
        }

        .icon-btn:hover {
            border-color: var(--neon-cyan);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lang-select {
            padding: 8px 11px;
            border-radius: 13px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        /* ===================================================
           6. MOBILE RESPONSIVE FIT
        =================================================== */
        @media (max-width: 640px) {
            nav {
                top: 12px;
                padding: 9px 14px;
                border-radius: 16px;
            }

            .nav-brand img {
                height: 28px;
            }

            .icon-btn {
                width: 36px;
                height: 36px;
                border-radius: 11px;
            }

            .logo-showcase {
                padding: 15px;
                margin-bottom: 44px;
            }

            .acai-logo-img {
                width: 78vw;
                max-width: 300px;
            }

            .cta-container {
                flex-direction: column;
                gap: 14px;
                max-width: 320px;
            }

            .pro-btn {
                width: 100%;
                padding: 16px 24px;
                font-size: 14.5px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Top-Down Stage Spotlight (No Spinning Circles) -->
    <div class="spotlight-cone" id="spotlightCone"></div>
    <canvas id="dustCanvas"></canvas>

    <!-- Top Navigation Bar (Appears after light intro) -->
    <nav id="topNav">
        <a href="index.html" class="nav-brand">
            <img src="acai-logo.png" onerror="this.src='logo.png'" alt="Açaí">
        </a>

        <div class="nav-actions">
            <select class="lang-select" onchange="if(typeof changeLanguage === 'function') changeLanguage(this.value)">
                <option value="en">EN</option>
                <option value="mm">MM</option>
            </select>

            <a href="cart.html" class="icon-btn" title="Cart">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </a>

            <a href="login.html" class="icon-btn" id="accountBtn" title="Account">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>
    </nav>

    <!-- CENTER STAGE: DIM LOGO -> LIGHT BEAM STRIKE -> BUTTONS REVEAL -->
    <main class="stage-main">
        
        <div class="logo-showcase" id="logoShowcase">
            <!-- 1. အလင်းတန်း ပြေးလာသည့် Beam -->
            <div class="shooting-beam" id="shootingBeam"></div>

            <!-- 2. Logo ကို ထိမှန်ချိန် ပွင့်ထွက်သည့် Flash -->
            <div class="impact-burst" id="impactBurst"></div>

            <!-- 3. နောက်ခံ အလင်းငွေ့နှင့် အောက်ခြေ မှန်အရိပ်လိုင်း -->
            <div class="logo-aura" id="logoAura"></div>
            <div class="stage-horizon" id="stageHorizon"></div>
            <div class="stage-floor-glow" id="stageFloorGlow"></div>

            <!-- 4. Açaí Transparent PNG Logo -->
            <img 
                src="acai-logo.png" 
                onerror="this.src='logo.png'" 
                alt="Açaí" 
                class="acai-logo-img" 
                id="acaiLogo"
                title="Click to replay light intro"
                onclick="replayIntro()"
            >
        </div>

        <!-- 5. ခလုတ် ၂ ခု (អလင်းတန်း ဝင်ပြီးမှ ပေါ်လာမည်) -->
        <div class="cta-container" id="ctaContainer">
            <a href="shop.html" class="pro-btn btn-shop-now">
                <i class="fa-solid fa-bolt"></i>
                <span data-lang="shopNow">Shop Now</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <a href="my-orders.html" class="pro-btn btn-track-order">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span data-lang="myOrders">Track Order</span>
            </a>
        </div>

    </main>

    <script>
        /* --- 1. Replay Intro on Logo Click --- */
        function replayIntro() {
            const elements = [
                "shootingBeam",
                "impactBurst",
                "acaiLogo",
                "logoAura",
                "stageHorizon",
                "stageFloorGlow",
                "spotlightCone",
                "ctaContainer"
            ];

            elements.forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                const currentAnim = getComputedStyle(el).animation;
                el.style.animation = "none";
                void el.offsetWidth; // trigger reflow
                el.style.animation = "";
            });
        }

        /* --- 2. Subtle Floating Light Dust in Spotlight --- */
        const canvas = document.getElementById("dustCanvas");
        const ctx = canvas.getContext("2d");
        let motes = [];

        function setupCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            motes = [];
            const count = window.innerWidth < 640 ? 30 : 55;
            for (let i = 0; i < count; i++) {
                motes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.8 + 0.4,
                    vy: -(Math.random() * 0.35 + 0.1),
                    vx: (Math.random() - 0.5) * 0.25,
                    alpha: Math.random() * 0.55 + 0.15
                });
            }
        }
        window.addEventListener("resize", setupCanvas);
        setupCanvas();

        function animateDust() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let m of motes) {
                m.x += m.vx;
                m.y += m.vy;
                if (m.y < 0) m.y = canvas.height;
                if (m.x < 0) m.x = canvas.width;
                if (m.x > canvas.width) m.x = 0;

                ctx.beginPath();
                ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(141, 169, 212, ${m.alpha})`;
                ctx.fill();
            }
            requestAnimationFrame(animateDust);
        }
        animateDust();

        /* --- 3. Cart Badge & User Login Status --- */
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        document.getElementById("cartCount").innerText = cart.reduce((s, i) => s + (Number(i.qty) || 1), 0);

        fetch("/me", { credentials: "include" })
            .then(r => r.json())
            .then(d => {
                if (d.loggedIn) {
                    const acc = document.getElementById("accountBtn");
                    acc.href = "profile.html";
                    acc.innerHTML = '<i class="fa-solid fa-user-check" style="color:#4ade80;"></i>';
                }
            }).catch(() => {});
    </script>
</body>
</html>
