<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Açaí Shop</title>
    
    <link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    
    <script src="language.js"></script>

    <style>
        :root {
            --bg-dark: #02050d;
            --card-bg: rgba(15, 23, 42, 0.55);
            --border-glow: rgba(141, 169, 212, 0.25);
            --primary-blue: #2563eb;
            --neon-blue: #60a5fa;
            --acai-blue: #8da9d4;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        [data-theme="light"] {
            --bg-dark: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.8);
            --border-glow: rgba(37, 99, 235, 0.2);
            --primary-blue: #2563eb;
            --neon-blue: #1d4ed8;
            --text-main: #0f172a;
            --text-sub: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ==========================================
           PRO INTERACTIVE CANVAS & CYBER GRID
        ========================================== */
        #particleCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .cyber-perspective {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: 
                radial-gradient(circle at 50% 35%, rgba(37, 99, 235, 0.18), transparent 65%),
                linear-gradient(to right, rgba(141, 169, 212, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(141, 169, 212, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 55px 55px, 55px 55px;
            animation: gridDrift 18s linear infinite;
        }

        @keyframes gridDrift {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 55px 55px, 55px 55px; }
        }

        .cursor-aura {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.16) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: -1;
            transition: width 0.3s, height 0.3s;
            filter: blur(25px);
        }

        /* ==========================================
           FLOATING GLASS NAVBAR
        ========================================== */
        nav {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1200px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            border-radius: 22px;
            background: rgba(10, 15, 29, 0.65);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid var(--border-glow);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] nav {
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-logo img {
            height: 36px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(141, 169, 212, 0.7));
            transition: transform 0.35s ease;
        }

        .nav-logo:hover img {
            transform: scale(1.12) rotate(-4deg);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .icon-btn:hover {
            border-color: var(--neon-blue);
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
        }

        .lang-select {
            padding: 9px 12px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        /* ==========================================
           PURE ANIMATED CENTERSTAGE HERO (NO TEXT)
        ========================================== */
        .hero-stage {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1200px;
            padding: 0 20px;
        }

        .logo-portal {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: clamp(280px, 55vw, 480px);
            height: clamp(220px, 40vw, 340px);
            margin-bottom: 45px;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }

        /* Rotating Cyber Energy Rings */
        .portal-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .ring-1 {
            width: clamp(260px, 45vw, 400px);
            height: clamp(260px, 45vw, 400px);
            border: 2px dashed rgba(141, 169, 212, 0.3);
            box-shadow: 0 0 50px rgba(37, 99, 235, 0.25), inset 0 0 50px rgba(37, 99, 235, 0.25);
            animation: spinRight 24s linear infinite;
        }

        .ring-2 {
            width: clamp(310px, 52vw, 470px);
            height: clamp(310px, 52vw, 470px);
            border: 1px solid rgba(96, 165, 250, 0.18);
            border-top-color: var(--neon-blue);
            border-bottom-color: #818cf8;
            animation: spinLeft 14s linear infinite;
        }

        .ring-glow {
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(141, 169, 212, 0.55) 0%, rgba(37, 99, 235, 0.2) 55%, transparent 75%);
            border-radius: 50%;
            filter: blur(30px);
            animation: breatheGlow 3.8s ease-in-out infinite;
        }

        @keyframes spinRight {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinLeft {
            from { transform: rotate(360deg) scale(0.96); }
            50% { transform: rotate(180deg) scale(1.04); }
            to { transform: rotate(0deg) scale(0.96); }
        }

        @keyframes breatheGlow {
            0%, 100% { transform: scale(0.88); opacity: 0.65; }
            50% { transform: scale(1.25); opacity: 1; }
        }

        /* Main PNG Logo with 3D Levitation */
        .acai-main-logo {
            width: 100%;
            max-width: 430px;
            height: auto;
            object-fit: contain;
            position: relative;
            z-index: 5;
            transform: translateZ(50px);
            filter: drop-shadow(0 20px 40px rgba(37, 99, 235, 0.65))
                    drop-shadow(0 0 20px rgba(141, 169, 212, 0.8));
            animation: levitateLogo 4s ease-in-out infinite;
            cursor: pointer;
            user-select: none;
        }

        @keyframes levitateLogo {
            0%, 100% { transform: translateZ(50px) translateY(0px) scale(1); }
            50% { transform: translateZ(70px) translateY(-18px) scale(1.04); }
        }

        /* ==========================================
           PRO ANIMATED ACTION BUTTONS ONLY
        ========================================== */
        .cta-dock {
            display: flex;
            gap: 22px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            z-index: 10;
        }

        .btn-pro-shop {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 18px 46px;
            border-radius: 20px;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #3b82f6 100%);
            background-size: 200% 200%;
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 
                0 15px 40px rgba(37, 99, 235, 0.65),
                0 0 25px rgba(96, 165, 250, 0.5) inset;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulseButton 3s infinite;
        }

        @keyframes pulseButton {
            0%, 100% { box-shadow: 0 15px 40px rgba(37, 99, 235, 0.6), 0 0 20px rgba(96, 165, 250, 0.4) inset; }
            50% { box-shadow: 0 20px 55px rgba(59, 130, 246, 0.9), 0 0 35px rgba(147, 197, 253, 0.75) inset; }
        }

        .btn-pro-shop::before {
            content: "";
            position: absolute;
            top: 0;
            left: -130%;
            width: 80%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            transform: skewX(-25deg);
            animation: laserSweep 2.8s infinite;
        }

        @keyframes laserSweep {
            0% { left: -130%; }
            45%, 100% { left: 160%; }
        }

        .btn-pro-shop:hover {
            transform: translateY(-6px) scale(1.06);
            letter-spacing: 2.5px;
        }

        .btn-pro-track {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 38px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            color: var(--text-main);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid rgba(141, 169, 212, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        [data-theme="light"] .btn-pro-track {
            background: rgba(255, 255, 255, 0.85);
        }

        .btn-pro-track:hover {
            transform: translateY(-6px) scale(1.05);
            border-color: var(--neon-blue);
            box-shadow: 0 18px 40px rgba(37, 99, 235, 0.35), 0 0 20px rgba(96, 165, 250, 0.25) inset;
            color: var(--neon-blue);
        }

        /* Animated Scroll Indicator */
        .scroll-indicator {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--acai-blue);
            font-size: 20px;
            opacity: 0.7;
            animation: bounceDown 2s infinite;
            text-decoration: none;
        }

        @keyframes bounceDown {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -12px); }
            60% { transform: translate(-50%, -6px); }
        }

        /* ==========================================
           PRODUCTS SHOWCASE SECTION
        ========================================== */
        .catalog-section {
            max-width: 1240px;
            margin: 0 auto;
            padding: 40px 5% 90px;
        }

        .search-bar-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 36px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 480px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 20px 15px 48px;
            border-radius: 18px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .search-box input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.35);
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--acai-blue);
            font-size: 16px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 24px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(18px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--neon-blue);
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.5), 0 0 30px rgba(37, 99, 235, 0.3);
        }

        .card-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #020617;
            overflow: hidden;
            position: relative;
        }

        .card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .product-card:hover .card-img-wrap img {
            transform: scale(1.1);
        }

        .stock-pill {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(2, 5, 13, 0.75);
            backdrop-filter: blur(8px);
            color: #4ade80;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(74, 222, 128, 0.35);
        }

        .stock-pill.out {
            color: #f87171;
            border-color: rgba(248, 113, 113, 0.35);
        }

        .card-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .card-title {
            font-size: 15.5px;
            font-weight: 700;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-price {
            font-size: 18.5px;
            font-weight: 800;
            color: var(--neon-blue);
        }

        .card-btn {
            margin-top: auto;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .card-btn:hover {
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.55);
            filter: brightness(1.15);
        }

        @media (max-width: 600px) {
            nav { top: 10px; padding: 10px 16px; width: 94%; }
            .logo-portal { margin-bottom: 35px; }
            .cta-dock { width: 100%; flex-direction: column; gap: 14px; }
            .btn-pro-shop, .btn-pro-track { width: 100%; max-width: 320px; padding: 16px 24px; }
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card-body { padding: 12px; }
            .card-title { font-size: 13.5px; }
            .card-price { font-size: 15px; }
        }
    </style>
</head>
<body>

    <!-- Animated Cyber Background & Particle Canvas -->
    <div class="cyber-perspective"></div>
    <div class="cursor-aura" id="cursorAura"></div>
    <canvas id="particleCanvas"></canvas>

    <!-- Floating Glass Navigation -->
    <nav>
        <a href="index.html" class="nav-logo">
            <img src="acai-logo.png" onerror="this.src='logo.jpg'" alt="Açaí">
        </a>

        <div class="nav-actions">
            <button class="icon-btn" id="themeToggle" title="Theme">
                <i class="fa-solid fa-sun" id="themeIcon"></i>
            </button>

            <select class="lang-select" onchange="if(typeof changeLanguage === 'function') changeLanguage(this.value)">
                <option value="en">EN</option>
                <option value="mm">MM</option>
            </select>

            <a href="cart.html" class="icon-btn" title="Cart">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </a>

            <a href="login.html" class="icon-btn" id="accountBtn" title="Account">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>
    </nav>

    <!-- CENTERPIECE HERO: LOGO + 2 BUTTONS ONLY -->
    <section class="hero-stage" id="heroStage">
        
        <div class="logo-portal" id="logoPortal">
            <div class="portal-ring ring-1"></div>
            <div class="portal-ring ring-2"></div>
            <div class="ring-glow"></div>
            <img src="logo.png" onerror="this.src='logo.jpg'" alt="Açaí" class="acai-main-logo">
        </div>

        <div class="cta-dock">
            <a href="#shopSection" class="btn-pro-shop">
                <i class="fa-solid fa-bolt"></i>
                <span>Shop Now</span>
            </a>

            <a href="my-orders.html" class="btn-pro-track">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span>Track Order</span>
            </a>
        </div>

        <a href="#shopSection" class="scroll-indicator">
            <i class="fa-solid fa-angles-down"></i>
        </a>

    </section>

    <!-- PRODUCTS SECTION -->
    <section class="catalog-section" id="shopSection">
        <div class="search-bar-wrap">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search items...">
            </div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </section>

    <script>
        /* --- 1. Interactive 3D Tilt & Cursor Aura --- */
        const heroStage = document.getElementById("heroStage");
        const logoPortal = document.getElementById("logoPortal");
        const cursorAura = document.getElementById("cursorAura");

        window.addEventListener("mousemove", (e) => {
            cursorAura.style.left = e.clientX + "px";
            cursorAura.style.top = e.clientY + "px";
        });

        heroStage.addEventListener("mousemove", (e) => {
            const rect = heroStage.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            logoPortal.style.transform = `rotateY(${x * 28}deg) rotateX(${-y * 28}deg)`;
        });

        heroStage.addEventListener("mouseleave", () => {
            logoPortal.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        /* --- 2. Floating Cyber Particles Canvas --- */
        const canvas = document.getElementById("particleCanvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 55; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2.2 + 0.6,
                dx: (Math.random() - 0.5) * 0.45,
                dy: (Math.random() - 0.5) * 0.45,
                alpha: Math.random() * 0.65 + 0.2
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(141, 169, 212, ${p.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* --- 3. Theme Toggle --- */
        const themeToggle = document.getElementById("themeToggle");
        const themeIcon = document.getElementById("themeIcon");
        if (localStorage.getItem("theme") === "light") {
            document.body.setAttribute("data-theme", "light");
            themeIcon.className = "fa-solid fa-moon";
        }

        themeToggle.addEventListener("click", () => {
            const isLight = document.body.getAttribute("data-theme") === "light";
            if (isLight) {
                document.body.removeAttribute("data-theme");
                localStorage.setItem("theme", "dark");
                themeIcon.className = "fa-solid fa-sun";
            } else {
                document.body.setAttribute("data-theme", "light");
                localStorage.setItem("theme", "light");
                themeIcon.className = "fa-solid fa-moon";
            }
        });

        /* --- 4. Cart & User Session --- */
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        document.getElementById("cartCount").innerText = cart.reduce((s, i) => s + (Number(i.qty) || 1), 0);

        fetch("/me", { credentials: "include" })
            .then(r => r.json())
            .then(d => {
                if (d.loggedIn) {
                    const btn = document.getElementById("accountBtn");
                    btn.href = "profile.html";
                    btn.innerHTML = '<i class="fa-solid fa-user-check" style="color:#4ade80;"></i>';
                }
            }).catch(() => {});

        /* --- 5. Load & Filter Products --- */
        let allProducts = [];

        async function loadProducts() {
            const grid = document.getElementById("productGrid");
            try {
                const res = await fetch("/products");
                allProducts = await res.json();
                renderProducts(allProducts);
            } catch (err) {
                grid.innerHTML = "";
            }
        }

        function renderProducts(list) {
            const grid = document.getElementById("productGrid");
            if (!Array.isArray(list) || list.length === 0) {
                grid.innerHTML = "";
                return;
            }

            grid.innerHTML = list.map(p => {
                let firstImg = p.image || "logo.png";
                try {
                    if (p.images) {
                        const parsed = JSON.parse(p.images);
                        if (Array.isArray(parsed) && parsed.length > 0) firstImg = parsed[0];
                    }
                } catch (e) {}

                if (firstImg && !firstImg.startsWith("http") && firstImg !== "logo.png" && firstImg !== "logo.jpg") {
                    firstImg = "/uploads/" + firstImg;
                }

                const inStock = Number(p.stock) > 0;

                return `
                    <div class="product-card" onclick="window.location.href='product-detail.html?id=${p.id}'">
                        <div class="card-img-wrap">
                            <span class="stock-pill ${inStock ? '' : 'out'}">
                                ${inStock ? `Stock: ${p.stock}` : 'Sold Out'}
                            </span>
                            <img src="${firstImg}" onerror="this.src='logo.jpg'" alt="${p.name}" loading="lazy">
                        </div>
                        <div class="card-body">
                            <div class="card-title">${p.name}</div>
                            <div class="card-price">${Number(p.price).toLocaleString()} MMK</div>
                            <button class="card-btn" onclick="event.stopPropagation(); window.location.href='product-detail.html?id=${p.id}'">
                                <i class="fa-solid fa-bolt"></i> Shop Now
                            </button>
                        </div>
                    </div>
                `;
            }).join("");
        }

        document.getElementById("searchInput").addEventListener("input", (e) => {
            const q = e.target.value.toLowerCase().trim();
            renderProducts(allProducts.filter(p => 
                String(p.name || "").toLowerCase().includes(q) ||
                String(p.colors || "").toLowerCase().includes(q)
            ));
        });

        loadProducts();
    </script>
</body>
</html>
