<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
    <title>Welcome | Açaí Shop</title>

    <!-- Language translation script integration -->
    <script src="language.js"></script>

    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        /* =========================================================
            CSS VARIABLES (DARK & LIGHT MODE)
            ========================================================= */
        :root {
            --bg-color: #030712;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-glow: rgba(96, 165, 250, 0.15);
            --primary-blue: #3b82f6;
            --accent-glow: #60a5fa;
            --grid-color: rgba(255, 255, 255, 0.03);
            --particle-color: rgba(147, 197, 253, 0.4);
            --btn-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --btn-glow: rgba(59, 130, 246, 0.5);
            --control-bg: rgba(15, 23, 42, 0.6);
        }

        [data-theme="light"] {
            --bg-color: #f0f4f8;
            --text-color: #0f172a;
            --subtext-color: #475569;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.8);
            --card-glow: rgba(59, 130, 246, 0.12);
            --primary-blue: #2563eb;
            --accent-glow: #3b82f6;
            --grid-color: rgba(0, 0, 0, 0.03);
            --particle-color: rgba(37, 99, 235, 0.3);
            --btn-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --btn-glow: rgba(37, 99, 235, 0.4);
            --control-bg: rgba(255, 255, 255, 0.7);
        }

        /* Reset & Base Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
        }

        /* Canvas Particle Layer */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient Glowing Background Blobs */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.75;
            animation: pulseBlob 8s ease-in-out infinite alternate;
        }

        .blob-1 {
            top: 10%;
            left: 15%;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.35) 0%, rgba(0,0,0,0) 70%);
        }

        .blob-2 {
            bottom: 10%;
            right: 15%;
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(147, 197, 253, 0.3) 0%, rgba(0,0,0,0) 70%);
            animation-delay: -4s;
        }

        @keyframes pulseBlob {
            0% { transform: scale(1) translate(0, 0); opacity: 0.5; }
            100% { transform: scale(1.2) translate(30px, -20px); opacity: 0.85; }
        }

        /* Background Grid Overlay */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        /* Top Controls (Theme Toggle & Language Select) */
        .top-controls {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--control-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .control-btn:hover {
            transform: translateY(-2px) scale(1.05);
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .language-select {
            height: 44px;
            padding: 0 16px;
            border-radius: 14px;
            background: var(--control-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .language-select option {
            background: #0f172a;
            color: #ffffff;
        }

        /* Glassmorphic Card Container */
        .main-container {
            position: relative;
            z-index: 10;
            width: min(92%, 460px);
            padding: 48px 36px;
            border-radius: 32px;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.35),
                0 0 40px var(--card-glow);
            text-align: center;
            transform-style: preserve-3d;
            animation: cardEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.92) rotateX(10deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0deg);
            }
        }

        /* Logo Styling & Floating Effect */
        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
            transform-style: preserve-3d;
        }

        .logo-img {
            width: 210px;
            max-width: 85%;
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
            animation: floatLogo 4.5s ease-in-out infinite alternate;
            
            /* --- ဤနေရာတွင် အဖြူခံနောက်ခံအကွက်များကို အလိုအလျောက် ဖျောက်ထုတ်ပေးသည် --- */
            mix-blend-mode: multiply;
        }

        [data-theme="dark"] .logo-img {
            mix-blend-mode: screen; /* Dark mode တွင် အဖြူခံများ လုံးဝမပေါ်တော့ဘဲ ပျောက်ကွယ်သွားမည် */
            filter: drop-shadow(0 12px 25px rgba(96, 165, 250, 0.3));
        }

        @keyframes floatLogo {
            0% {
                transform: translateY(0px) rotate(0deg) scale(1);
            }
            100% {
                transform: translateY(-10px) rotate(1.5deg) scale(1.03);
            }
        }

        /* Typography */
        h1.title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-color) 40%, var(--subtext-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--subtext-color);
            font-size: 14.5px;
            line-height: 1.6;
            margin-bottom: 36px;
            font-weight: 400;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        /* Interactive Shop Now Button */
        .shop-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            height: 56px;
            border-radius: 18px;
            background: var(--btn-gradient);
            color: #ffffff;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            overflow: hidden;
            box-shadow: 0 12px 30px var(--btn-glow);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: none;
            cursor: pointer;
        }

        .shop-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.45), 
                transparent
            );
            transform: skewX(-25deg);
            transition: left 0.75s ease;
        }

        .shop-btn:hover::before {
            left: 140%;
        }

        .shop-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 40px var(--btn-glow);
        }

        .shop-btn:active {
            transform: translateY(-1px) scale(0.99);
        }

        .shop-btn i {
            font-size: 16px;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .shop-btn:hover i {
            transform: translateX(6px);
        }

        /* Mobile Optimization Breakpoints */
        @media (max-width: 480px) {
            .main-container {
                padding: 38px 24px;
                border-radius: 26px;
            }

            .logo-img {
                width: 170px;
            }

            h1.title {
                font-size: 24px;
            }

            p.subtitle {
                font-size: 13.5px;
                margin-bottom: 28px;
            }

            .shop-btn {
                height: 52px;
                font-size: 16px;
            }

            .top-controls {
                top: 16px;
                right: 16px;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- Canvas for Floating Particles -->
    <canvas id="particleCanvas"></canvas>

    <!-- Background Glowing Blobs -->
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>

    <!-- Cyber Background Grid Overlay -->
    <div class="grid-overlay"></div>

    <!-- Top Right Controls -->
    <div class="top-controls">
        <button class="control-btn" id="theme-toggle" aria-label="Toggle Theme">
            <i class="fa-solid fa-sun" id="theme-icon"></i>
        </button>

        <select class="language-select" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="mm">မြန်မာ</option>
        </select>
    </div>

    <!-- Main Centered Glass Card -->
    <main class="main-container" id="glassCard">
        <div class="logo-wrapper">
            <!-- သင့်ရဲ့ လိုဂိုပုံနာမည်ကို ဒီနေရာမှာ ထည့်ပါ (ဥပမာ: acai-logo.png) -->
            <img src="acai-logo.png" 
                 onerror="this.src='https://placehold.co/400x200/0f172a/60a5fa?text=A%C3%A7a%C3%AD'" 
                 class="logo-img" 
                 alt="Açaí Logo">
        </div>

        <h1 class="title" data-lang="welcomeTitle">Welcome to Açaí</h1>

        <p class="subtitle" data-lang="welcomeSubtitle">
            Explore our exclusive collection of luxury accessories crafted for your lifestyle.
        </p>

        <a href="shop.html" class="shop-btn">
            <span data-lang="shopNow">Shop Now</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </main>

    <!-- Interactive Script -->
    <script>
        /* =========================================================
           1. PERSISTENT THEME TOGGLE (DARK / LIGHT MODE)
           ========================================================= */
        const themeToggleBtn = document.getElementById("theme-toggle");
        const themeIcon = document.getElementById("theme-icon");
        const savedTheme = localStorage.getItem("theme") || "dark";

        document.body.setAttribute("data-theme", savedTheme);
        updateThemeIcon(savedTheme);

        themeToggleBtn.addEventListener("click", () => {
            const currentTheme = document.body.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";
            
            document.body.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
            updateThemeIcon(newTheme);
            initParticles();
        });

        function updateThemeIcon(theme) {
            themeIcon.className = theme === "dark" ? "fa-solid fa-sun" : "fa-solid fa-moon";
        }

        /* =========================================================
           2. INTERACTIVE PARTICLES CANVAS SYSTEM
           ========================================================= */
        const canvas = document.getElementById("particleCanvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener("resize", () => {
            resizeCanvas();
            initParticles();
        });

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                const isDark = document.body.getAttribute("data-theme") === "dark";
                ctx.fillStyle = isDark 
                    ? `rgba(147, 197, 253, ${this.opacity})` 
                    : `rgba(37, 99, 235, ${this.opacity})`;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const particleCount = Math.floor((canvas.width * canvas.height) / 14000);
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        /* =========================================================
           3. 3D CARD TILT PARALLAX EFFECT
           ========================================================= */
        const glassCard = document.getElementById("glassCard");

        document.addEventListener("mousemove", (e) => {
            if (window.innerWidth <= 768) return; 
            
            const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 25;

            glassCard.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener("mouseleave", () => {
            glassCard.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        /* =========================================================
           4. INITIALIZATION & LANGUAGE PREFERENCE
           ========================================================= */
        window.onload = function() {
            resizeCanvas();
            initParticles();
            animateParticles();

            const savedLang = localStorage.getItem("language") || "en";
            const langSelect = document.getElementById("langSelect");
            if (langSelect) langSelect.value = savedLang;
            if (typeof changeLanguage === "function") {
                changeLanguage(savedLang);
            }
        };
    </script>
</body>
</html>
