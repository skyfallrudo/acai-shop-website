<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Açaí Shop | Official Portal</title>
    
    <link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
    
    <script src="language.js"></script>

    <style>
        :root {
            --bg-deep: #02040a;
            --acai-pastel: #8da9d4;
            --neon-blue: #3b82f6;
            --neon-cyan: #60a5fa;
            --neon-indigo: #6366f1;
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(141, 169, 212, 0.28);
            --text-main: #ffffff;
        }

        [data-theme="light"] {
            --bg-deep: #eef2ff;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(59, 130, 246, 0.25);
            --text-main: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-deep);
            color: var(--text-main);
            position: relative;
        }

        /* ==========================================
           1. PRO 3D CYBER ENVIRONMENT & CANVAS
        ========================================== */
        #warpCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Moving 3D Cyber Floor & Ceiling Grid */
        .cyber-grid-floor {
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(141, 169, 212, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(141, 169, 212, 0.07) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(600px) rotateX(68deg) translateY(0);
            animation: gridMove 8s linear infinite;
            mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 10%, transparent 65%);
            -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 10%, transparent 65%);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: perspective(600px) rotateX(68deg) translateY(0); }
            100% { transform: perspective(600px) rotateX(68deg) translateY(60px); }
        }

        /* Ambient Aurora Blobs */
        .aurora {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
            animation: auroraFloat 10s ease-in-out infinite alternate;
        }

        .aurora-1 {
            width: 45vw;
            height: 45vw;
            min-width: 300px;
            min-height: 300px;
            background: radial-gradient(circle, #2563eb, transparent 70%);
            top: -15%;
            left: -10%;
        }

        .aurora-2 {
            width: 45vw;
            height: 45vw;
            min-width: 300px;
            min-height: 300px;
            background: radial-gradient(circle, #6366f1, transparent 70%);
            bottom: -15%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes auroraFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.18); }
        }

        /* Interactive Cursor Glow */
        .cursor-glow {
            position: fixed;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, rgba(141, 169, 212, 0.22) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 2;
            filter: blur(20px);
            transition: opacity 0.3s;
        }

        /* ==========================================
           2. FLOATING GLASS NAVBAR
        ========================================== */
        nav {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 1180px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-radius: 22px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35), 0 0 20px rgba(141, 169, 212, 0.08) inset;
            animation: navDrop 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes navDrop {
            from { transform: translate(-50%, -60px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .nav-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-brand img {
            height: 36px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(141, 169, 212, 0.85));
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .nav-brand:hover img {
            transform: scale(1.12) rotate(-5deg);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .glass-icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        [data-theme="light"] .glass-icon-btn {
            background: rgba(37, 99, 235, 0.06);
        }

        .glass-icon-btn:hover {
            transform: translateY(-3px) scale(1.06);
            border-color: var(--neon-cyan);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.45);
        }

        .badge-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
        }

        .lang-switch {
            padding: 9px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        [data-theme="light"] .lang-switch option {
            background: #ffffff;
            color: #0f172a;
        }
        body:not([data-theme="light"]) .lang-switch option {
            background: #0f172a;
            color: #ffffff;
        }

        /* ==========================================
           3. CENTER 3D HOLOGRAPHIC PORTAL & LOGO
        ========================================== */
        .stage-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 70px 20px 30px;
            perspective: 1200px;
        }

        .portal-core {
            position: relative;
            width: clamp(270px, 65vw, 520px);
            height: clamp(240px, 48vw, 390px);
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
            margin-bottom: clamp(28px, 5vh, 52px);
        }

        /* Animated Energy Rings */
        .energy-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .ring-outer {
            width: clamp(260px, 55vw, 440px);
            height: clamp(260px, 55vw, 440px);
            border: 1.5px solid rgba(141, 169, 212, 0.2);
            border-top: 2.5px solid var(--neon-cyan);
            border-bottom: 2.5px solid var(--acai-pastel);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.25), inset 0 0 40px rgba(141, 169, 212, 0.2);
            animation: orbitSpin 12s linear infinite;
        }

        .ring-inner {
            width: clamp(210px, 44vw, 350px);
            height: clamp(210px, 44vw, 350px);
            border: 2px dashed rgba(141, 169, 212, 0.35);
            animation: orbitSpinReverse 18s linear infinite;
        }

        .ring-pulse {
            width: clamp(190px, 40vw, 310px);
            height: clamp(190px, 40vw, 310px);
            border: 1px solid rgba(96, 165, 250, 0.5);
            animation: shockwave 3.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        /* Neon Core Backlight behind transparent PNG */
        .core-backlight {
            position: absolute;
            width: clamp(200px, 42vw, 330px);
            height: clamp(200px, 42vw, 330px);
            background: radial-gradient(circle, rgba(141, 169, 212, 0.65) 0%, rgba(59, 130, 246, 0.3) 45%, transparent 72%);
            border-radius: 50%;
            filter: blur(28px);
            animation: coreBreathe 4s ease-in-out infinite;
        }

        @keyframes orbitSpin {
            0% { transform: rotateZ(0deg) rotateX(18deg) rotateY(10deg); }
            100% { transform: rotateZ(360deg) rotateX(18deg) rotateY(10deg); }
        }

        @keyframes orbitSpinReverse {
            0% { transform: rotateZ(360deg) rotateX(-15deg); }
            100% { transform: rotateZ(0deg) rotateX(-15deg); }
        }

        @keyframes shockwave {
            0% { transform: scale(0.8); opacity: 0.9; }
            100% { transform: scale(1.65); opacity: 0; }
        }

        @keyframes coreBreathe {
            0%, 100% { transform: scale(0.92); opacity: 0.7; }
            50% { transform: scale(1.22); opacity: 1; }
        }

        /* TRUE TRANSPARENT PNG LOGO: acai-logo.png */
        .acai-hero-png {
            width: 92%;
            max-width: 450px;
            height: auto;
            object-fit: contain;
            position: relative;
            z-index: 10;
            transform: translateZ(65px);
            filter: 
                drop-shadow(0 0 18px rgba(141, 169, 212, 0.95))
                drop-shadow(0 20px 45px rgba(37, 99, 235, 0.75));
            animation: floatMaster 4.2s ease-in-out infinite;
            cursor: pointer;
            transition: filter 0.3s ease;
        }

        .acai-hero-png:hover {
            filter: 
                drop-shadow(0 0 28px rgba(255, 255, 255, 0.95))
                drop-shadow(0 0 55px rgba(59, 130, 246, 1));
        }

        @keyframes floatMaster {
            0%, 100% { transform: translateZ(65px) translateY(0px) scale(1); }
            50% { transform: translateZ(85px) translateY(-18px) scale(1.04); }
        }

        /* ==========================================
           4. EXPLOSIVE ACTION BUTTONS (SHOP & TRACK)
        ========================================== */
        .action-dock {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            z-index: 20;
            width: 100%;
            max-width: 560px;
            animation: dockRise 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes dockRise {
            from { transform: translateY(45px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .btn-cyber {
            position: relative;
            overflow: hidden;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 19px 32px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        /* SHOP NOW - Primary Neon Button */
        .btn-shop {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #3b82f6 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 15px 40px rgba(37, 99, 235, 0.65),
                0 0 25px rgba(141, 169, 212, 0.55) inset;
            animation: shopPulse 3s infinite;
        }

        @keyframes shopPulse {
            0%, 100% { box-shadow: 0 15px 40px rgba(37, 99, 235, 0.6), 0 0 20px rgba(141, 169, 212, 0.4) inset; }
            50% { box-shadow: 0 22px 55px rgba(59, 130, 246, 0.95), 0 0 35px rgba(255, 255, 255, 0.7) inset; }
        }

        /* Laser Shimmer Sweep */
        .btn-shop::before {
            content: "";
            position: absolute;
            top: 0;
            left: -130%;
            width: 75%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.75), transparent);
            transform: skewX(-25deg);
            animation: laserBeam 2.8s infinite;
        }

        @keyframes laserBeam {
            0% { left: -130%; }
            45%, 100% { left: 160%; }
        }

        .btn-shop:hover {
            transform: translateY(-6px) scale(1.05);
            letter-spacing: 2.2px;
        }

        .btn-shop:active {
            transform: scale(0.97);
        }

        /* TRACK ORDER - Glass Secondary Button */
        .btn-track {
            background: var(--glass-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            color: var(--text-main);
            border: 1px solid rgba(141, 169, 212, 0.45);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35), 0 0 15px rgba(141, 169, 212, 0.12) inset;
        }

        .btn-track:hover {
            transform: translateY(-6px) scale(1.05);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 18px 45px rgba(59, 130, 246, 0.4), 0 0 25px rgba(96, 165, 250, 0.3) inset;
        }

        .btn-track:active {
            transform: scale(0.97);
        }

        /* ==========================================
           5. MOBILE FIRST RESPONSIVE PERFECTION
        ========================================== */
        @media (max-width: 640px) {
            nav {
                top: 14px;
                width: 92%;
                padding: 10px 16px;
                border-radius: 18px;
            }

            .nav-brand img {
                height: 30px;
            }

            .glass-icon-btn {
                width: 38px;
                height: 38px;
                border-radius: 12px;
            }

            .stage-container {
                justify-content: center;
                padding: 60px 20px 25px;
            }

            .portal-core {
                width: 88vw;
                height: 72vw;
                max-height: 300px;
                margin-bottom: 36px;
            }

            .acai-hero-png {
                width: 86%;
                max-width: 310px;
            }

            .action-dock {
                flex-direction: column;
                gap: 14px;
                width: 100%;
                max-width: 340px;
            }

            .btn-cyber {
                width: 100%;
                padding: 17px 24px;
                font-size: 15px;
                border-radius: 18px;
            }

            .cursor-glow {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- 3D Cyber Grid & Aurora Glows -->
    <div class="cyber-grid-floor"></div>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>
    <div class="cursor-glow" id="cursorGlow"></div>
    <canvas id="warpCanvas"></canvas>

    <!-- Floating Glass Navigation -->
    <nav>
        <a href="index.html" class="nav-brand">
            <img src="acai-logo.png" onerror="this.src='logo.png'" alt="Açaí">
        </a>

        <div class="nav-controls">
            <button class="glass-icon-btn" id="themeBtn" title="Toggle Theme">
                <i class="fa-solid fa-sun" id="themeIcon"></i>
            </button>

            <select class="lang-switch" onchange="if(typeof changeLanguage === 'function') changeLanguage(this.value)">
                <option value="en">EN</option>
                <option value="mm">MM</option>
            </select>

            <a href="cart.html" class="glass-icon-btn" title="Cart">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="badge-count" id="cartCount">0</span>
            </a>

            <a href="login.html" class="glass-icon-btn" id="accountBtn" title="Account">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>
    </nav>

    <!-- PURE PRO HERO STAGE: TRANSPARENT PNG LOGO + 2 BUTTONS ONLY -->
    <main class="stage-container" id="stageContainer">
        
        <div class="portal-core" id="portalCore">
            <div class="energy-ring ring-outer"></div>
            <div class="energy-ring ring-inner"></div>
            <div class="energy-ring ring-pulse"></div>
            <div class="core-backlight"></div>
            
            <!-- အစစ်အမှန် Transparent PNG: acai-logo.png -->
            <img src="acai-logo.png" onerror="this.src='logo.png'" alt="Açaí" class="acai-hero-png" onclick="window.location.href='shop.html'">
        </div>

        <div class="action-dock">
            <a href="shop.html" class="btn-cyber btn-shop">
                <i class="fa-solid fa-bolt"></i>
                <span data-i18n="shop_now">Shop Now</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <a href="my-orders.html" class="btn-cyber btn-track">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span data-i18n="track_order">Track Order</span>
            </a>
        </div>

    </main>

    <script>
        /* --- 1. 3D Interactive Parallax (Desktop Mouse + Mobile Touch) --- */
        const stage = document.getElementById("stageContainer");
        const portal = document.getElementById("portalCore");
        const cursorGlow = document.getElementById("cursorGlow");

        window.addEventListener("mousemove", (e) => {
            cursorGlow.style.left = e.clientX + "px";
            cursorGlow.style.top = e.clientY + "px";

            const x = (e.clientX / window.innerWidth - 0.5) * 32;
            const y = (e.clientY / window.innerHeight - 0.5) * 32;
            portal.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        window.addEventListener("mouseleave", () => {
            portal.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        /* Mobile Touch Tilt Effect */
        window.addEventListener("touchmove", (e) => {
            if (!e.touches[0]) return;
            const touch = e.touches[0];
            const x = (touch.clientX / window.innerWidth - 0.5) * 24;
            const y = (touch.clientY / window.innerHeight - 0.5) * 24;
            portal.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        }, { passive: true });

        window.addEventListener("touchend", () => {
            portal.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        /* --- 2. Interactive Starfield & Energy Particles Canvas --- */
        const canvas = document.getElementById("warpCanvas");
        const ctx = canvas.getContext("2d");
        let stars = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            const count = window.innerWidth < 640 ? 45 : 85;
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2.4 + 0.6,
                    speedX: (Math.random() - 0.5) * 0.6,
                    speedY: (Math.random() - 0.5) * 0.6,
                    alpha: Math.random() * 0.75 + 0.25,
                    pulse: Math.random() * 0.02 + 0.005
                });
            }
        }
        window.addEventListener("resize", initCanvas);
        initCanvas();

        function renderStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let s of stars) {
                s.x += s.speedX;
                s.y += s.speedY;
                s.alpha += s.pulse;
                if (s.alpha > 1 || s.alpha < 0.2) s.pulse = -s.pulse;

                if (s.x < 0) s.x = canvas.width;
                if (s.x > canvas.width) s.x = 0;
                if (s.y < 0) s.y = canvas.height;
                if (s.y > canvas.height) s.y = 0;

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(141, 169, 212, ${s.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#60a5fa";
                ctx.fill();
            }
            requestAnimationFrame(renderStars);
        }
        renderStars();

        /* --- 3. Theme Toggle --- */
        const themeBtn = document.getElementById("themeBtn");
        const themeIcon = document.getElementById("themeIcon");
        if (localStorage.getItem("theme") === "light") {
            document.body.setAttribute("data-theme", "light");
            themeIcon.className = "fa-solid fa-moon";
        }

        themeBtn.addEventListener("click", () => {
            const isLight = document.body.getAttribute("data-theme") === "light";
            if (isLight) {
                document.body.removeAttribute("data-theme");
                localStorage.setItem("theme", "dark");
                themeIcon.className = "fa-solid fa-sun";
            } else {
                document.body.setAttribute("data-theme", "light");
                localStorage.setItem("theme", "light");
                themeIcon.className = "fa-solid fa-moon";
            }
        });

        /* --- 4. Cart Badge & User Login Status --- */
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        document.getElementById("cartCount").innerText = cart.reduce((sum, i) => sum + (Number(i.qty) || 1), 0);

        fetch("/me", { credentials: "include" })
            .then(r => r.json())
            .then(d => {
                if (d.loggedIn) {
                    const acc = document.getElementById("accountBtn");
                    acc.href = "profile.html";
                    acc.innerHTML = '<i class="fa-solid fa-user-check" style="color:#4ade80;"></i>';
                }
            }).catch(() => {});
    </script>
</body>
</html>
