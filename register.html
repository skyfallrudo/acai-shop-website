<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
<title>Create Account | Acai Shop</title>
<script src="language.js"></script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F00XQ96WFJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-F00XQ96WFJ');

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-color: #05080f;
    min-height: 100vh;
    padding: 20px 0;
}

/* ===== Background Image Fix ===== */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}

/* PC Desktop Background */
@media (min-width: 769px) {
    body::after {
        background-image: url("bg-desktop.jpg");
    }
}

/* Mobile Background */
@media (max-width: 768px) {
    body::after {
        background-image: url("bg-mobile.jpg") !important;
    }
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 8, 15, 0.45);
    z-index: -1;
}

/* Language Switcher Styling */
.lang-container {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
}

.language-select {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(15, 23, 42, 0.85);
    color: white;
    outline: none;
    cursor: pointer;
    font-family: Poppins, sans-serif;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 13px;
}

.language-select option {
    background: #111827;
    color: white;
}

.glow {
    position: fixed;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 550px;
    height: 180px;
    background: radial-gradient(circle, rgba(255, 245, 210, 0.15), transparent 75%);
    filter: blur(22px);
    pointer-events: none;
    z-index: 1;
}

.card {
    position: relative;
    z-index: 2;
    width: 420px;
    padding: 38px;
    border-radius: 26px;
    background: rgba(15, 23, 42, 0.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    animation: float 5s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

.logo {
    text-align: center;
    margin-bottom: 18px;
}

.logo img {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: white;
    padding: 6px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    object-fit: cover;
}

h1 {
    color: white;
    text-align: center;
    font-size: 30px;
    margin-bottom: 8px;
}

p {
    text-align: center;
    color: #94A3B8;
    margin-bottom: 28px;
    font-size: 14px;
}

.input {
    position: relative;
    margin-bottom: 18px;
}

.input i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #94A3B8;
}

.input input {
    width: 100%;
    padding: 15px 18px 15px 48px;
    background: #1E293B;
    border: 1px solid transparent;
    border-radius: 14px;
    outline: none;
    color: white;
    font-size: 15px;
    transition: .3s;
}

.input input::placeholder {
    color: #64748B;
}

.input input:focus {
    border-color: #2563EB;
    box-shadow: 0 0 18px rgba(37, 99, 235, .35);
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(37, 99, 235, .4);
}

.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #94A3B8;
}

.footer a {
    color: #60A5FA;
    text-decoration: none;
    font-weight: 500;
}

.footer a:hover {
    text-decoration: underline;
}

/* Loading Overlay */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 10, 20, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.loading-box {
    background: rgba(15, 23, 42, 0.92);
    padding: 35px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
    min-width: 300px;
}

.spinner {
    width: 58px;
    height: 58px;
    margin: auto;
    border: 4px solid rgba(255, 255, 255, 0.12);
    border-top: 4px solid #3B82F6;
    border-radius: 50%;
    animation: spin .9s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

.loading-box h3 {
    color: white;
    margin: 18px 0 8px;
}

.loading-box p {
    color: #94A3B8;
    margin: 0;
}

/* ---------- Mobile Responsive ---------- */
@media (max-width: 768px) {
    body {
        padding: 16px !important;
        align-items: flex-start !important;
    }

    .lang-container {
        top: 12px !important;
        right: 12px !important;
    }

    .language-select {
        padding: 6px 10px !important;
        font-size: 12px !important;
    }

    .glow {
        width: 260px !important;
        height: 100px !important;
        top: 8px !important;
    }

    .card {
        width: 100% !important;
        max-width: 420px !important;
        margin: 58px auto 18px !important;
        padding: 24px 18px !important;
        border-radius: 22px !important;
        animation: none !important;
    }

    .logo img {
        width: 68px !important;
        height: 68px !important;
        padding: 5px !important;
    }

    h1 {
        font-size: 24px !important;
        line-height: 1.2 !important;
    }

    p {
        font-size: 13px !important;
        line-height: 1.5 !important;
        margin-bottom: 20px !important;
    }

    .input {
        margin-bottom: 15px !important;
    }

    .input i {
        left: 14px !important;
        font-size: 15px !important;
    }

    .input input {
        height: 50px !important;
        padding: 0 14px 0 42px !important;
        font-size: 16px !important;
        border-radius: 12px !important;
    }

    button {
        height: 50px !important;
        padding: 0 !important;
        font-size: 15px !important;
        border-radius: 12px !important;
    }

    .footer {
        margin-top: 18px !important;
        font-size: 13px !important;
        line-height: 1.5 !important;
    }

    .loading-box {
        width: 90% !important;
        max-width: 310px !important;
        min-width: auto !important;
        padding: 26px 20px !important;
    }

    .spinner {
        width: 48px !important;
        height: 48px !important;
    }
}

@media (max-width: 360px) {
    .card {
        padding: 20px 15px !important;
    }

    h1 {
        font-size: 21px !important;
    }

    .logo img {
        width: 60px !important;
        height: 60px !important;
    }
}
</style>
</head>

<body>

<!-- Language Switcher Dropdown -->
<div class="lang-container">
    <select class="language-select" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="mm">မြန်မာ</option>
    </select>
</div>

<div class="glow"></div>

<div class="card">
    <div class="logo">
        <img src="logo.jpg" alt="Logo">
    </div>

    <h1 data-lang="createAccountTitle">Create Account</h1>

    <p data-lang="createAccountSubtitle">Enter your email and password to receive a verification code.</p>

    <form onsubmit="event.preventDefault(); sendOTP();">
        <div class="input">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="Email Address" data-lang-placeholder="emailPlaceholder" required>
        </div>

        <div class="input">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Password" data-lang-placeholder="passwordPlaceholder" required>
        </div>

        <button type="submit">
            <i class="fa-solid fa-paper-plane"></i>
            <span data-lang="sendOtpBtnText">Send OTP</span>
        </button>
    </form>

    <div class="footer">
        <span data-lang="alreadyHaveAccount">Already have an account?</span>
        <a href="login.html" data-lang="signInLink">Sign In</a>
    </div>
</div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
        <div class="spinner"></div>
        <h3 data-lang="sendingCodeTitle">Sending verification code...</h3>
        <p data-lang="pleaseWaitText">Please wait a moment.</p>
    </div>
</div>

<script>
async function sendOTP(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const loading = document.getElementById("loadingOverlay");

  loading.style.display = "flex";

  try {
    const res = await fetch("/send-otp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if(data.success){
      window.location =
        "verify-otp.html?email=" +
        encodeURIComponent(email) +
        "&password=" +
        encodeURIComponent(password);
    } else {
      loading.style.display = "none";
      alert(data.message || "Failed to send OTP.");
    }
  } catch(err) {
    loading.style.display = "none";
    alert("Cannot connect to server.");
  }
}

// Initial Language Check
document.addEventListener("DOMContentLoaded", () => {
  const savedLang = localStorage.getItem("language") || "en";
  const langSelect = document.querySelector(".language-select");
  if (langSelect) langSelect.value = savedLang;

  if (typeof changeLanguage === "function") {
    changeLanguage(savedLang);
  }
});
</script>

</body>
</html>
