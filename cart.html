<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./logo.ico?v=2" type="image/x-icon">
<title>Shopping Cart | Acai Shop</title>

<style>
/* --- Light Mode (Default) --- */
:root {
    --bg-color: #f8fafc;
    --text-color: #0f172a;
    --card-bg: #ffffff;
    --border-color: rgba(0, 0, 0, 0.08);
    --primary-blue: #2563eb;
    --accent-text: #2563eb;
    --subtext-color: #64748b;
    --qty-bg: #f1f5f9;
}

/* --- Dark Mode --- */
[data-theme="dark"] {
    --bg-color: #05080f;
    --text-color: #ffffff;
    --card-bg: rgba(15, 23, 42, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
    --primary-blue: #2563eb;
    --accent-text: #60A5FA;
    --subtext-color: #94A3B8;
    --qty-bg: rgba(30, 41, 59, 0.7);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

body {
    background-color: var(--bg-color);
    min-height: 100vh;
    color: var(--text-color);
    padding: 30px 20px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

/* Top Right Controls Container */
.top-controls {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
}

.icon-btn {
    width: 38px;
    height: 38px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color);
    cursor: pointer;
    transition: 0.3s;
}

.icon-btn:hover {
    background: var(--primary-blue);
    color: white;
    border-color: var(--primary-blue);
}

.language-select {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
    color: var(--text-color);
    outline: none;
    cursor: pointer;
    font-family: Poppins, sans-serif;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: 13px;
}

.language-select option {
    background: #111827;
    color: white;
}

.container {
    max-width: 650px;
    width: 100%;
    margin: 0 auto;
    position: relative;
    z-index: 2;
}

.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 22px;
    color: var(--accent-text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.25s ease;
}

.back:hover {
    opacity: 0.8;
    transform: translateX(-3px);
}

h1 {
    text-align: center;
    margin-bottom: 28px;
    font-size: 30px;
    font-weight: 700;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 20px;
    border-radius: 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    gap: 15px;
}

.item-details h3 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
}

.item-details .price {
    color: var(--accent-text);
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
}

.item-details .stock-info {
    color: var(--subtext-color);
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.qty {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.qty-controls {
    display: flex;
    align-items: center;
    background: var(--qty-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 3px;
}

.qty-controls .btn-qty {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 9px;
    background: #2563EB;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.qty-controls .btn-qty:hover:not(:disabled) {
    background: #1D4ED8;
}

.qty-controls .btn-qty:disabled {
    background: #475569;
    cursor: not-allowed;
    opacity: 0.6;
}

.qty-val {
    padding: 0 12px;
    font-size: 15px;
    font-weight: 600;
    min-width: 30px;
    text-align: center;
}

.remove {
    background: rgba(220, 38, 38, 0.15) !important;
    color: #FCA5A5 !important;
    border: 1px solid rgba(220, 38, 38, 0.3) !important;
    padding: 8px 14px !important;
    border-radius: 12px !important;
    font-size: 13px !important;
    font-weight: 500 !important;
    cursor: pointer;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.remove:hover {
    background: rgba(220, 38, 38, 0.8) !important;
    color: white !important;
}

.total-box {
    margin-top: 24px;
    background: var(--card-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 22px 25px;
    border-radius: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
}

.total-box #total {
    color: var(--accent-text);
    font-size: 22px;
}

.checkout {
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #3B82F6, #2563EB);
    color: white;
    font-family: "Poppins", sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.checkout:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
    background: linear-gradient(135deg, #2563EB, #1D4ED8);
}

.empty {
    text-align: center;
    padding: 60px 20px;
    background: var(--card-bg);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 24px;
    border: 1px solid var(--border-color);
}

.empty i {
    font-size: 48px;
    color: var(--subtext-color);
    margin-bottom: 16px;
    display: block;
}

.empty h2 {
    font-size: 20px;
    font-weight: 600;
}

@media (max-width: 580px) {
    body {
        padding: 20px 15px;
    }

    .item {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .qty {
        width: 100%;
        justify-content: space-between;
    }

    h1 {
        font-size: 24px;
    }
}

/* ===== Mobile Responsive Fix ===== */
@media (max-width:768px){
  body{
    padding:16px !important;
  }

  .top-controls{
    top:12px !important;
    right:12px !important;
  }

  .language-select{
    font-size:12px !important;
    padding:7px 10px !important;
  }

  .container{
    max-width:100% !important;
    margin-top:42px !important;
  }

  .back{
    font-size:13px !important;
    margin-bottom:18px !important;
  }

  h1{
    font-size:24px !important;
    margin-bottom:22px !important;
  }

  .item{
    padding:16px !important;
    border-radius:18px !important;
    gap:14px !important;
  }

  .item-details{
    width:100%;
  }

  .item-details h3{
    font-size:16px !important;
    line-height:1.3;
    word-break:break-word;
  }

  .item-details .price{
    font-size:14px !important;
  }

  .item-details .stock-info{
    font-size:12px !important;
  }

  .qty{
    width:100%;
    justify-content:space-between !important;
    align-items:center !important;
  }

  .qty-controls{
    border-radius:10px !important;
  }

  .qty-controls .btn-qty{
    width:30px !important;
    height:30px !important;
    font-size:15px !important;
  }

  .qty-val{
    padding:0 10px !important;
    font-size:14px !important;
    min-width:26px !important;
  }

  .remove{
    padding:7px 12px !important;
    font-size:12px !important;
    border-radius:10px !important;
  }

  .total-box{
    margin-top:20px !important;
    padding:18px !important;
    border-radius:18px !important;
    font-size:16px !important;
  }

  .total-box #total{
    font-size:20px !important;
  }

  .checkout{
    height:50px !important;
    padding:0 !important;
    font-size:15px !important;
    border-radius:12px !important;
    margin-top:18px !important;
  }

  .empty{
    padding:45px 18px !important;
    border-radius:20px !important;
  }

  .empty i{
    font-size:42px !important;
  }

  .empty h2{
    font-size:18px !important;
  }
}

@media (max-width:360px){
  .item{
    padding:14px !important;
  }

  .item-details h3{
    font-size:15px !important;
  }

  .qty{
    gap:10px !important;
    flex-wrap:wrap;
  }

  .remove{
    width:100%;
    justify-content:center;
  }

  .total-box{
    font-size:15px !important;
  }

  .total-box #total{
    font-size:18px !important;
  }
}
</style>
</head>

<body data-theme="dark">

<div class="top-controls">
    <!-- Dark / Light Mode Toggle Button -->
    <button class="icon-btn" id="theme-toggle" title="Toggle Theme">
        <i class="fa-solid fa-sun" id="theme-icon"></i>
    </button>
    <select class="language-select" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="mm">မြန်မာ</option>
    </select>
</div>

<div class="container">

<a href="index.html" class="back">
    <i class="fa-solid fa-arrow-left"></i> <span data-lang="continueShopping">Continue Shopping</span>
</a>

<h1 data-lang="shoppingCartTitle">Shopping Cart</h1>

<div id="cartItems"></div>

<div class="total-box">
    <span data-lang="totalText">Total</span>
    <span id="total">0 MMK</span>
</div>

<button id="checkoutBtn" class="checkout">
    <i class="fa-solid fa-credit-card"></i> <span data-lang="proceedCheckout">Proceed to Checkout</span>
</button>

</div>

<script>
/* --- Dark/Light Mode Toggle Logic --- */
const themeToggleBtn = document.getElementById("theme-toggle");
const themeIcon = document.getElementById("theme-icon");
const currentTheme = localStorage.getItem("theme") || "dark";

document.body.setAttribute("data-theme", currentTheme);
updateThemeIcon(currentTheme);

themeToggleBtn.addEventListener("click", () => {
    let theme = document.body.getAttribute("data-theme");
    let newTheme = theme === "dark" ? "light" : "dark";
    
    document.body.setAttribute("data-theme", newTheme);
    localStorage.setItem("theme", newTheme);
    updateThemeIcon(newTheme);
});

function updateThemeIcon(theme) {
    if (theme === "dark") {
        themeIcon.className = "fa-solid fa-sun";
    } else {
        themeIcon.className = "fa-solid fa-moon";
    }
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let products = [];

async function loadProducts(){
    try {
        products = await fetch("/products").then(r=>r.json());
    } catch (e) {
        console.error("Error loading products:", e);
    }
}

function getStock(name){
    const p = products.find(x=>x.name===name);
    return p ? Number(p.stock) : 0;
}

function saveCart(){
    localStorage.setItem("cart", JSON.stringify(cart));
}

function renderCart(){
    const list = document.getElementById("cartItems");
    const totalBox = document.getElementById("total");

    list.innerHTML = "";

    let total = 0;

    const currentLang = localStorage.getItem("language") || "en";
    const t = translations[currentLang] || translations.en;

    const stockLabel = t.stock || "Stock";
    const removeLabel = t.remove || "Remove";
    const emptyText = t.cartEmpty || "Your cart is empty";

    if(cart.length===0){
        list.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-cart-shopping"></i>
                <h2>${emptyText}</h2>
            </div>
        `;
        totalBox.innerText="0 MMK";
        return;
    }

    cart.forEach((item,index)=>{
        total += item.price * item.qty;
        const stock = getStock(item.name);

        list.innerHTML += `
            <div class="item">
                <div class="item-details">
                    <h3>${item.name}</h3>
                    <p class="price">${Number(item.price).toLocaleString()} MMK</p>
                    <small class="stock-info"><i class="fa-solid fa-box-archive"></i> ${stockLabel}: ${stock}</small>
                </div>

                <div class="qty">
                    <div class="qty-controls">
                        <button onclick="changeQty(${index},-1)" class="btn-qty">-</button>
                        <span class="qty-val">${item.qty}</span>
                        <button
                            onclick="changeQty(${index},1)"
                            class="btn-qty"
                            ${item.qty>=stock?"disabled":""}
                        >
                            +
                        </button>
                    </div>

                    <button
                        class="remove"
                        onclick="removeItem(${index})"
                    >
                        <i class="fa-solid fa-trash-can"></i> ${removeLabel}
                    </button>
                </div>
            </div>
        `;
    });

    totalBox.innerText = Number(total).toLocaleString()+" MMK";
}

function changeQty(index,change){
    const stock = getStock(cart[index].name);

    if(change===1 && cart[index].qty>=stock){
        alert("Only "+stock+" items left.");
        return;
    }

    cart[index].qty += change;

    if(cart[index].qty<=0){
        cart.splice(index,1);
    }

    saveCart();
    renderCart();
}

function removeItem(index){
    cart.splice(index,1);
    saveCart();
    renderCart();
}

document.getElementById("checkoutBtn").addEventListener("click",()=>{
    if(cart.length===0){
        alert("Your cart is empty.");
        return;
    }
    window.location="checkout.html";
});

(async()=>{
    await loadProducts();
    renderCart();
})();
</script>

</body>
</html>
