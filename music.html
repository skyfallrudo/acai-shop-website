<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sienna - Windows Error Lyrics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f8d7e8 0%, #e6d8f7 50%, #fce8d5 100%);
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    /* နောက်ခံပုံပြောင်းဖို့ ခလုတ် (စနှိပ်လိုက်ရင် ပျောက်သွားမယ်) */
    #bg-picker {
      position: fixed;
      top: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid #bdbdbd;
      padding: 6px 12px;
      font-size: 12px;
      color: #333;
      cursor: pointer;
      border-radius: 4px;
      z-index: 20;
    }

    #bg-input {
      display: none;
    }

    /* Windows Error Dialog Box */
    .win-box {
      width: min(310px, 86vw);
      background: #ffffff;
      border: 1px solid #999999;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      border-radius: 2px;
      overflow: hidden;
      animation: popIn 0.08s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.96); opacity: 0.7; }
      to { transform: scale(1); opacity: 1; }
    }

    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px 8px 12px;
      background: #ffffff;
      font-size: 13px;
      color: #1a1a1a;
    }

    .close-btn {
      font-size: 15px;
      color: #444;
      cursor: pointer;
      padding: 0 6px;
      line-height: 1;
    }

    .content {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px 24px 20px;
      background: #ffffff;
      min-height: 82px;
    }

    /* အပြာရောင် (i) Icon */
    .info-icon {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5c8df6 0%, #1c44b8 70%, #122d82 100%);
      border: 2px solid #d5ddf5;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: Georgia, serif;
      font-weight: bold;
      font-size: 21px;
      font-style: italic;
    }

    #lyric-text {
      font-size: 14px;
      color: #111111;
      line-height: 1.45;
      word-break: break-word;
    }

    .footer {
      background: #f0f0f0;
      border-top: 1px solid #dfdfdf;
      padding: 10px 14px;
      display: flex;
      justify-content: flex-end;
    }

    #ok-btn {
      min-width: 78px;
      padding: 5px 18px;
      font-size: 13px;
      font-family: inherit;
      color: #000000;
      background: #e1e1e1;
      border: 1px solid #0078d7;
      box-shadow: inset 0 0 0 1px #ffffff;
      cursor: pointer;
    }

    #ok-btn:active {
      background: #cce4f7;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <label id="bg-picker" for="bg-input">Change Wallpaper</label>
  <input type="file" id="bg-input" accept="image/*" />

  <div class="win-box" id="win-box">
    <div class="title-bar">
      <span>Windows Error</span>
      <span class="close-btn" onclick="nextLyric()">✕</span>
    </div>
    <div class="content">
      <div class="info-icon">i</div>
      <div id="lyric-text"></div>
    </div>
    <div class="footer">
      <button id="ok-btn" onclick="nextLyric()">OK</button>
    </div>
  </div>

  <script>
    // ဒီထဲမှာ စာကြောင်းတွေကို အစဉ်လိုက် ဖြည့်ပေးပါ
    const lyrics = [
      "And I smile when I think of",
      "all the times we had",
      "On the beach in the winter",
      "when the waves were mad",
      "Down by the water",
      "crystal clear",
      "See her face in the forest",
      "then it disappears"
    ];

    let index = 0;
    const lyricEl = document.getElementById("lyric-text");
    const winBox = document.getElementById("win-box");
    const bgPicker = document.getElementById("bg-picker");
    const bgInput = document.getElementById("bg-input");

    function renderLyric() {
      lyricEl.textContent = lyrics[index];
      // နှိပ်လိုက်တိုင်း box အသစ်ပွင့်လာသလို pop effect ပြန်ပေးမယ်
      winBox.style.animation = "none";
      void winBox.offsetWidth;
      winBox.style.animation = "popIn 0.08s ease-out";
    }

    function nextLyric() {
      // စနှိပ်လိုက်တာနဲ့ Wallpaper ပြောင်းတဲ့ခလုတ်ကို ဖျောက်မယ် (Screen ရှင်းနေအောင်)
      bgPicker.classList.add("hidden");

      index++;
      if (index < lyrics.length) {
        renderLyric();
      } else {
        // အဆုံးရောက်ရင် box ပိတ်သွားမယ်
        winBox.classList.add("hidden");
      }
    }

    // Keyboard က Enter ဒါမှမဟုတ် Space နှိပ်ရင်လည်း နောက်တစ်ကြောင်းတက်မယ်
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        nextLyric();
      }
    });

    // ကိုယ်ကြိုက်တဲ့ Wallpaper ပုံရွေးထည့်ဖို့
    bgInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.body.style.backgroundImage = `url('${ev.target.result}')`;
      };
      reader.readAsDataURL(file);
    });

    renderLyric();
  </script>
</body>
</html>
