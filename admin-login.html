<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Acai Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0F172A;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.card{
width:100%;
max-width:380px;
background:#111827;
padding:35px;
border-radius:24px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin-bottom:18px;
border:none;
border-radius:12px;
background:#1E293B;
color:white;
font-size:15px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2563EB;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
}

button:hover{
background:#1D4ED8;
}
</style>
</head>

<body>

<div class="card">

<h1>Admin Login</h1>

<form id="loginForm">

<input
type="text"
id="username"
placeholder="Admin Username"
required>

<input
type="password"
id="password"
placeholder="Admin Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit",async function(e){

e.preventDefault();

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value;

const res = await fetch("/admin-login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username,
password
})

});

const data = await res.json();

if(data.success){

window.location = "admin.html";

}else{

alert(data.message || "Wrong username or password");

}

});

</script>

</body>
</html>
