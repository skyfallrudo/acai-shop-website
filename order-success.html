<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

body {
    background-color: #05080f;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 20px;
    position: relative;
    color: white;
}


body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}


@media (min-width: 769px) {
    body::after {
        background-image: url("bg-desktop.jpg");
    }
}

@media (max-width: 768px) {
    body::after {
        background-image: url("bg-mobile.jpg");
    }
}


body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 8, 15, 0.65);
    z-index: -1;
}

.card {
    max-width: 480px;
    width: 100%;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 28px;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    position: relative;
    z-index: 2;
}

.icon {
    width: 85px;
    height: 85px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #16A34A;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    color: white;
    box-shadow: 0 10px 25px rgba(22, 163, 74, 0.35);
}

h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 12px;
}

p {
    color: #CBD5E1;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.buttons {
    display: grid;
    gap: 12px;
}

.btn {
    padding: 14px 20px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.25s ease;
}

.primary {
    background: #2563EB;
    color: white;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
}

.secondary {
    background: rgba(30, 41, 59, 0.8);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.primary:hover {
    background: #1D4ED8;
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(37, 99, 235, 0.35);
}

.secondary:hover {
    background: rgba(51, 65, 85, 0.9);
    transform: translateY(-2px);
}

@media (max-width: 600px) {
    .card {
        padding: 32px 22px;
    }

    h1 {
        font-size: 24px;
    }

    p {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="card">

<div class="icon">
  <i class="fa-solid fa-check"></i>
</div>

<h1>Order Successful!</h1>

<p>
Thank you for shopping with <b>Acai Shop</b>.<br>
Your order has been received successfully and we will process it soon.
</p>

<div class="buttons">

<a href="my-orders.html" class="btn primary">
  <i class="fa-solid fa-box"></i> View My Orders
</a>

<a href="index.html" class="btn secondary">
  <i class="fa-solid fa-bag-shopping"></i> Continue Shopping
</a>

</div>

</div>

</body>
</html>
