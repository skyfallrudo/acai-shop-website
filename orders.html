<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acai Shop - Orders Admin</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F00XQ96WFJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-F00XQ96WFJ');
</script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
}

body {
    background-color: #05080f;
    min-height: 100vh;
    color: white;
    padding: 25px 20px;
    position: relative;
}

/* Background ပုံကို fixed အလွှာသီးသန့်ခွဲထုတ်ပြီး PC/Mobile ခွဲခြားပေးထားသည် */
body::after {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}

/* PC (ကွန်ပျူတာ Screen များ) အတွက် Desktop ပုံ */
@media (min-width: 769px) {
    body::after {
        background-image: url("https://raw.githubusercontent.com/skyfallrudo/acai-assets/main/bg-desktop.jpg");
    }
}

/* ဖုန်း Screen များအတွက် Mobile ပုံ */
@media (max-width: 768px) {
    body::after {
        background-image: url("https://raw.githubusercontent.com/skyfallrudo/acai-assets/main/bg-mobile.jpg");
    }
}

/* အမည်းရောင် ပါးပါးအုပ်ထားသည့် အလွှာ (Blur မပါသောကြောင့် ပုံမဝါးပါ) */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(5, 8, 15, 0.65);
    z-index: -1;
}

.container {
    max-width: 900px;
    margin: auto;
    position: relative;
    z-index: 2;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 15px;
}

h1 {
    font-size: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #94A3B8;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    transition: .25s;
    background: rgba(15, 23, 42, 0.6);
    padding: 8px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.back-btn:hover {
    color: white;
    background: rgba(30, 41, 59, 0.8);
    transform: translateX(-3px);
}

.order {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    padding: 24px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
}

.order-title {
    font-size: 20px;
    font-weight: 700;
    color: #F8FAFC;
}

.customer-info {
    margin-top: 10px;
    font-size: 14px;
    color: #CBD5E1;
    line-height: 1.7;
}

.customer-info i {
    width: 20px;
    color: #3B82F6;
}

.status {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    display: inline-block;
}

.Pending { background: #475569; color: white; }
.Packed { background: #EA580C; color: white; }
.Shipped { background: #2563EB; color: white; }
.Delivered { background: #16A34A; color: white; }

.items {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding: 16px;
    border-radius: 14px;
    margin-top: 16px;
}

.items-header {
    font-weight: 600;
    font-size: 14px;
    color: #94A3B8;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    font-size: 15px;
    color: #E2E8F0;
}

.item:last-child {
    border-bottom: none;
}

.total {
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: 700;
}

.total-amount {
    color: #60A5FA;
}

.empty {
    text-align: center;
    padding: 70px 20px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
}

.empty h2 {
    font-size: 22px;
    margin-bottom: 8px;
}

.empty p {
    color: #94A3B8;
}

@media(max-width: 600px) {
    body {
        padding: 18px 12px;
    }

    .top-bar {
        flex-direction: column;
    }

    .item {
        font-size: 14px;
    }

    .total {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>📦 Acai Shop Orders</h1>
  <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Home</a>
</div>

<div id="orders"></div>

</div>

<script>
fetch("/orders")
  .then(response => response.json())
  .then(orders => {
    const container = document.getElementById("orders");

    if (!orders || orders.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <h2>No Orders Found</h2>
          <p>There are no customer orders yet.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = "";

    orders.forEach(order => {
      let items = [];

      try {
        items = typeof order.items === "string" ? JSON.parse(order.items) : order.items;
      } catch (e) {
        items = [];
      }

      let itemHTML = "";

      items.forEach(item => {
        itemHTML += `
          <div class="item">
            <span>${item.name} × ${item.qty}</span>
            <span>${Number(item.price * (item.qty || 1)).toLocaleString()} MMK</span>
          </div>
        `;
      });

      const statusClass = order.status || "Pending";

      container.innerHTML += `
        <div class="order">
          <div class="top-bar">
            <div>
              <div class="order-title">Order #${order.id}</div>
              <div class="customer-info">
                <div><i class="fa-solid fa-user"></i> <strong>Customer:</strong> ${order.customer || "N/A"}</div>
                <div><i class="fa-solid fa-phone"></i> <strong>Phone:</strong> ${order.phone || "N/A"}</div>
                <div><i class="fa-solid fa-location-dot"></i> <strong>Address:</strong> ${order.address || "N/A"}</div>
              </div>
            </div>

            <div>
              <span class="status ${statusClass}">${statusClass}</span>
            </div>
          </div>

          <div class="items">
            <div class="items-header">Ordered Items</div>
            ${itemHTML}
          </div>

          <div class="total">
            <span>Total Amount</span>
            <span class="total-amount">${Number(order.total).toLocaleString()} MMK</span>
          </div>
        </div>
      `;
    });
  })
  .catch(error => {
    console.error(error);
    document.getElementById("orders").innerHTML = `
      <div class="empty">
        <h2>Cannot Load Orders</h2>
        <p>Please check your server connection.</p>
      </div>
    `;
  });
</script>

</body>
</html>
